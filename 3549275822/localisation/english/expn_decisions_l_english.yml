l_english:
 TAKING_LOAN_FLAG: "Another loan is not in progress"
 GENERAL_STAFF_FLAG: "General Staff is not occupied with another plan"
 civil_investments:0 "Invest in Civilian Industry"
 civil_investments_desc:0 "We can allocate the government budget to sponsor the construction of new industrial facilities, fostering economic growth and enhancing our nation's production capabilities." 
 war_investments:0 "Invest in Arms Industry"
 war_investments_desc:0 "We can allocate government funds to establish factories dedicated to the production of weaponry, ensuring a steady supply of arms to support our national defense efforts."
 naval_investments:0 "Invest in Maritime Industry"
 naval_investments_desc:0 "We can utilize state funds to sponsor the construction of new dockyards, bolstering our maritime infrastructure and enhancing our naval and industrial capabilities."
 land_nationalization:0 "Nationalize Private Owned Land"
 land_nationalization_desc:0 "There are unused lands within our country owned by foreign companies. To ensure they contribute to our national development, we can seize these lands and repurpose them for long-term productive use." 
 forced_industrialization:0 "Rapid Industrialization"
 forced_industrialization_desc:0 "Rather than waiting for or sponsoring investments, we can expedite industrialization by seizing buildings suitable for conversion into industrial facilities and repurposing them efficiently to meet our needs in a short time frame."
 petrol_investment:0 "Invest in Petroleum Industry"
 petrol_investment_desc:0 "We can sponsor the construction of new refineries dedicated to domestic synthetic oil production, reducing our reliance on imports and strengthening our energy independence."
 land_distribution:0 "Land Distribution"
 land_distribution_desc:0 "In our nation, many individuals struggle with poverty and endure inhumane living conditions. To address this, we can clear the overcrowded city slums and provide these individuals with a few acres of land for farming, offering them a fresh start and an opportunity to build a better life."
 steel_investments:0 "Invest in Steel Production"
 steel_investments_desc:0 "Steel is an essential material for both light and heavy industries in the modern world. By sponsoring the construction of steel mills, we can significantly boost our steel production capacity and ensure adequate reserves for industrial and national needs."
 establish_university:0 "Establish New University"
 establish_university_desc:0 "Higher education institutions play a vital role in advancing our national research efforts. By allocating a portion of the state budget to establish new universities, we can ensure our nation remains competitive and does not fall behind in the modern world."
 forced_recruitment:0 "Mandatory Recruitment"
 forced_recruitment_desc:0 "Indeed, it is the duty of every citizen to contribute to the defense of our nation in times of need, whether through voluntary action or, when necessary, by fulfilling their obligations under the law. The survival and strength of our nation depend on the collective efforts of all its people."
 seize_industry:0 "Seize Production Assets"
 seize_industry_desc:0 "We may "temporarily" seize privately owned factories, converting them into arms manufacturing facilities or redirecting their resources to contribute to the national war effort, ensuring the swift production of essential materials for our cause."
 mining_effort:0 "Extensive Mining Effort"
 mining_effort_desc:0 "Other rare materials, such as tungsten and aluminum, are crucial, particularly for the arms industry. We must intensify our mining efforts to uncover potential reserves of tungsten and aluminum within our country, securing these vital resources for our production needs."
 infrastructure_investments:0 "Develop State Infrastructure"
 infrastructure_investments_desc:0 "To modernize our countryside, we must focus on improving the quality of roads and overall infrastructure in rural areas, ensuring better connectivity and fostering economic growth throughout the region."
 seize_weaponry:0 "Seize Civilian Weaponry"
 seize_weaponry_desc:0 "It is clear that a significant number of licensed and unlicensed firearms are owned by citizens across the country. In this critical time, we can seize these weapons to supply our forces, ensuring they are equipped for the challenges ahead."
 seize_transport:0 "Seize Civilian Merchant Ships"
 seize_transport_desc:0 "Maintaining our logistics lines at sea is crucial for the uninterrupted flow of supplies and potential arms imports. We can seize civilian merchant fleets to ensure this." 
 austerity_measures:0 "Austerity Measures"
 austerity_measures_desc:0 "Tough times demand tough decisions, and in these challenging moments, we must enact new laws to regulate industry and compel the population to contribute more actively to our war effort."
 railway_effort:0 "Invest in National Railways"
 railway_effort_desc:0 "In our time, railroads serve as the lifeblood of a nation, connecting its vital regions and enabling economic and logistical cohesion. By allocating a portion of our budget to bolster the railway industry for a specified period, we can enhance our infrastructure and ensure sustained growth and connectivity." 
 mobilize_reserves:0 "Mobilize the Militia"
 form_militias:0 "Form the National Militia"
 form_militias_desc:0 "In addition to relying on our professional army, we can organize our civilian population to serve as paramilitary forces in times of war. By registering able-bodied and skilled individuals into paramilitary organizations, we can quickly mobilize a capable and effective force when needed. §GPicking this decision will make mobilization and deployment of national militia divisions available in times of war. Number of divisions could be mobilized are determined by the amount of our civilian factories.§!" 
 mobilize_reserves_desc:0 "We must mobilize our paramilitary organizations to establish militia brigades, drawing from the ranks of our skilled population to bolster our defenses. §RThere will be economical consequences but we need every hand that can hold and fire a gun.§!" 
 demobilization_mission:0 "Demobilizing the Militia"
 demobilization_mission_desc:0 "Now that the war is over, we should demobilize our militia and allow them to return everyday life. §RInsisting on keeping skilled population active in our armed forces can trigger severe civil unrest and further economical burden.§!"
 demobilize_reserves:0 "Demobilize the National Militia"
 demobilize_reserves_desc:0 "Now that the war is over, we should demobilize our militia and allow them to return everyday life."
 investments_category:0 "National Development"
 investments_category_desc:0 "As the importance of economic and industrial development grows with each passing day, especially in these turbulent times, we must prioritize the strategic use of government funds to enhance and modernize our economic and industrial infrastructure. Only through such efforts can we achieve the status of a fully modernized nation."
 mobilization_category:0 "National Mobilization"
 mobilization_category_desc:0 "War has descended upon our lands, and it is now our duty to take every necessary measure to defend our sovereignty and protect our people. In these trying times, difficult decisions must be made, but no sacrifice is too great when the preservation of our independence is at stake." 
 purchase_surplus_equipment:0 "Purchase Surplus Equipment"
 purchase_surplus_equipment_desc:0 "Neutral nations are often eager to supply their customers with outdated yet still functional military equipment. By purchasing the necessary weaponry from these third parties, we can temporarily address our equipment shortages." 
 fight_forever:0 "The Last Stand"
 fight_forever_desc:0 ""I demolish my bridges behind me... then there is no choice but to move forward." §RUse this decision wisely, for it's only available for once. Picking this will disable post-capitulation decisions!§!"
 economics_category:0 "National Finance"
 economics_category_desc:0 "A nation's fiscal policies and financial structure are pivotal in determining its strength and resilience. As the government, we hold the authority and responsibility to modify and, if necessary, recalibrate our financial system. Strategic decisions made with precise timing can significantly enhance our economic capabilities and national prosperity."  
 take_small_loan:0 "Take Small Loan"
 take_small_loan_desc:0 "We can utilize small-sized and short-term loans to temporarily increase our budget and strengthen our economic capabilities." 
 take_medium_loan:0 "Take Medium Loan"
 take_medium_loan_desc:0 "We can utilize medium-sized and short-term loans to temporarily increase our budget and strengthen our economic capabilities." 
 take_large_loan:0 "Take Large Loan"
 take_large_loan_desc:0 "We can utilize large-sized and short-term loans to temporarily increase our budget and strengthen our economic capabilities." 
 poverty_fund:0 "Social Welfare Investments"
 poverty_fund_desc:0 "We can allocate additional government funds to temporarily increase support for our social welfare programs. Providing enhanced benefits to the low-income population will help stabilize our nation by reducing economic disparity and fostering social cohesion."
 government_savings:0 "Increase Government Savings"
 government_savings_desc:0 "For a limited period, we can reduce certain "non-essential" expenditures from the government budget. The funds saved through these measures can be redirected to support and strengthen our economy."
 increase_taxes:0 "Increase Taxation"
 increase_taxes_desc:0 "We can implement targeted increases in specific taxation areas, such as income tax and consumption tax, to boost government revenue and support essential national initiatives."
 decrease_taxes:0 "Cancel Additional Taxes"
 decrease_taxes_desc:0 "While governments often favor higher taxes to sustain their operations, the public usually holds a different view. To ease tensions and appease our discontented population, we can consider temporarily lowering tax rates, fostering goodwill and stability."
 make_investments:0 "Invest in Foreign Markets"
 make_investments_desc:0 "We can invest in foreign stock exchanges, markets, or land using the government budget. While such ventures always carry risks, with the guidance of our skilled and experienced economists, we can potentially generate profits from these investments." 
 general_staff_category:0 "Army High Command"
 general_staff_category_desc:0 "Battles are fought by soldiers, but it's the high-ranking officers in our armed forces who formulate the plans and lead them. During wartime, we must decide on specific strategies to implement on land."   
 focus_offensive:0 "Focus on Offensive"
 focus_offensive_desc:0 "The high command will devise their plans with a primary focus on offensive operations."
 focus_defence:0 "Focus on Defence"
 focus_defence_desc:0 "The high command will devise their plans with a primary focus on defensive efforts."
 focus_planning:0 "Focus on Planning"
 focus_planning_desc:0 "The high command will devise their plans with a primary focus on preparing for offensive."
 focus_logistics:0 "Focus on Logistics"
 focus_logistics_desc:0 "The high command will devise their plans with a primary focus on ensuring constant supply flow."
 capitulation_category:0 "Beaten, But Not Defeated"
 capitulation_category_desc:0 "Despite our soldiers' bravery and our best efforts, our nation has fallen into enemy hands. However, we have established a government in exile, and with determined political maneuvering, we can secure the tools and equipment needed to continue our struggle for liberation."
 purchase_civ_factory:0 "Purchase a Factory for Civilian Use"
 purchase_civ_factory_desc:0 "We can allocate a portion of our budget to purchase a factory on allied soil, incorporating it into our economy and bolstering our production capabilities."
 purchase_mil_factory:0 "Purchase a Factory for Arms Production"
 purchase_mil_factory_desc:0 "We can allocate a portion of our budget to purchase a factory on allied soil, using it for arms production to further supply our troops."
 ask_manpower:0 "Ask for Manpower"
 ask_manpower_desc:0 "Through targeted lobbying efforts, we could persuade our allies to transfer some of their troops to our command, significantly bolstering the size and strength of our army." 
 request_guns:0 "Request Guns"
 request_guns_desc:0 "Although every country faces a critical need for weaponry and ammunition during wartime, we can attempt to persuade our allies to transfer some of their outdated or surplus weapons to support our efforts."
 request_equipment:0 "Request Equipment"
 request_equipment_desc:0 "While guns are the primary tools of war, sending our troops into battle without sufficient support equipment is a surefire way to deplete our manpower in modern warfare. We must exert pressure on our allies to lend us the necessary equipment to sustain our forces."
 rescue_volunteers:0 "Rescue Resistance Members"
 rescue_volunteers_desc:0 "Numerous volunteers and resistance members in our homeland are valiantly fighting against enemy oppression. By initiating covert operations, we can rescue these individuals and integrate them into our army." 
 request_funds:0 "Request Funds"
 request_funds_desc:0 "With our resources severely limited after the loss of our homeland, we can appeal to our allies for financial support. This assistance would help us sustain our efforts and care for our people until we succeed in liberating our nation."
 aircraft_market_category:0 "Global Aircraft Market"
 aircraft_market_category_desc:0 "Aircraft usage in warfare is barely over three decades old, yet in this short timespan, the world has witnessed its game-changing impact on the battlefield. Our industrial and technological capabilities do not match those of the great powers and may not be sufficient for domestic mass production of air vessels. However, with diplomatic efforts and budget expansions, we can make our skies safer."
