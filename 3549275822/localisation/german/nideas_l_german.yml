NIDEAS_IDEA_GROUP5_SPIRIT7:0	"§HIdeen für Spionage: Verbesserte Kommunikationsmethoden§!"
NIDEAS_IDEA_GROUP5_SPIRIT8:0	"§HIdeen für Spionage: Regionale Integration§!"
NIDEAS_IDEA_GROUP5_SPIRIT_SPEC1:0	"§HIdeen für Spionage: Spezialisiert – Genie der Verschlüsselung§!"
NIDEAS_IDEA_GROUP5_SPIRIT_SPEC2:0	"§HIdeen für Spionage: Spezialisiert – Meister der Codeknackerei§!"
NIDEAS_IDEA_GROUP5_SPIRIT1_desc:0	"Unser Geheimdienst ist noch jung und schwach. Mit zusätzlichen staatlichen Mitteln können wir unseren Dienst weiter ausbauen und uns vor ausländischen, subversiven Bedrohungen schützen."
NIDEAS_IDEA_GROUP5_SPIRIT2_desc:0	"Unseren Agenten mangelt es an Erfahrung, und sie müssen umfassend geschult werden, um im Einsatz erfolgreich zu sein. Ein strenges Ausbildungsprogramm wird sie sicherlich auf den neuesten Stand bringen und sicherstellen, dass sie nur das Beste für unsere Geheimdienste leisten."
NIDEAS_IDEA_GROUP5_SPIRIT3_desc:0	"Die derzeitige Bürokratie des Dienstes ist von Korruption und Inkompetenz geprägt, was letztlich die Expansion des Dienstes einschränkt. Wir müssen die Ineffizienz von oben beseitigen und die Verwaltung durch fleißige, unbestechliche Persönlichkeiten ersetzen, die ihre Arbeit erledigen."
NIDEAS_IDEA_GROUP5_SPIRIT4_desc:0	"Unsere Verschlüsselungsabteilung hat bedeutende Durchbrüche in ihrer Computerforschung erzielt und damit den Weg für ein weitaus effizienteres System geebnet. Es ist unerlässlich, dass wir diese Informationen mit unseren großen Elektronikunternehmen teilen, um diese Revolution im ganzen Land voranzutreiben."
NIDEAS_IDEA_GROUP5_SPIRIT5_desc:0	"Die Verwaltung spielt seit einiger Zeit mit dem Gedanken an die "Bastion", eine moderne, zentrale Abteilung in der Hauptstadt, die sich auf Spionageabwehr spezialisiert. Dieses wachsame Auge wird zweifellos dazu beitragen, Spione aus unserem Land zu entfernen."
NIDEAS_IDEA_GROUP5_SPIRIT6_desc:0	"Mit dem Bau der Bastion können wir nun damit beginnen, ihre Reichweite zu vergrößern. Durch den Bau versteckter Bunker, Stützpunkte und Außenposten für unsere Spione können wir ein Netzwerk von Agentenzentren schaffen, das die Wirksamkeit der Bastion erweitert und gleichzeitig alle Spuren ihrer Existenz beseitigt, sodass unser Land für ausländische Spione zu einem schwer fassbaren Schatten wird."
NIDEAS_IDEA_GROUP5_SPIRIT7_desc:0	"Die Kommunikation über Funk ist für unsere Spione zwar sehr nützlich, aber sie ist nicht die einzige Möglichkeit, Informationen zu verbreiten. Indem wir verschlüsselte Nachrichten in aller Öffentlichkeit und unter dem Deckmantel alltäglicher Aktivitäten verstecken, können wir unseren Spionen ermöglichen, mehr Zeit außerhalb ihres Verstecks und im Einsatz zu verbringen, wodurch wir mehr Informationen sammeln können."
NIDEAS_IDEA_GROUP5_SPIRIT8_desc:0	"Es ist wichtig, dass unsere Spione unentdeckt bleiben und sich völlig unauffällig unter die Menge mischen. Wir werden unsere Spione kontinuierlich dazu ermutigen, die Sprache zu lernen, die Menschen zu beeindrucken und die Arbeitsplätze unserer Feinde zu übernehmen, damit sie sich integrieren und das Risiko, entdeckt zu werden, verringern können."
NIDEAS_IDEA_GROUP5_SPIRIT_SPEC1_desc:0	""
