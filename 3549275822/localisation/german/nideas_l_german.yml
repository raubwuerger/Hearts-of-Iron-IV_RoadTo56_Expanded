NIDEAS_IDEA_GROUP6_BUTTON1_DESC_TT:0	"Unsere Industrien müssen sich auf die sich verändernden geopolitischen Rahmenbedingungen einstellen. Durch die Entwicklung von Technologien zur effizienteren Umrüstung unserer Fabriken können wir leichter zwischen zivilen und militärischen Anforderungen wechseln; das Kräfteverhältnis wird immer zu unseren Gunsten sein."
NIDEAS_IDEA_GROUP6_BUTTON2_DESC_TT:0	"Das Potenzial unserer besten Köpfe wird mit jedem Tag verschwendet. Ihr Talent kann besser genutzt werden, indem man sie darin schult, die Details bestehender Konstruktionen und der von anderen Staaten geteilten Konstruktionen zu kennen. Schon bald werden sie diese groben Entwürfe sicherlich verbessern."
NIDEAS_IDEA_GROUP6_BUTTON3_DESC_TT:0	"Innovation bedeutet Überwindung, aber ohne einen klaren Fokus wird unsere technologische Stärke immer hinter der Konkurrenz zurückbleiben. Die Umstrukturierung unserer Abteilungen in separate Forschungsräte für die verschiedenen Wissenschaftsbereiche, in denen wir die Finanzierung und damit die Technologieproduktion kontrollieren können, wird unsere Zukunft sichern. Ob sie uns nun helfen, in die Lüfte zu steigen, die Meere zu beherrschen oder das Land zu kontrollieren, wir werden bereit sein."
NIDEAS_IDEA_GROUP6_BUTTON4_DESC_TT:0	"Ohne das Vertrauen unseres Volkes sind wir nichts. Da unsere Regierung von allen Seiten herausgefordert wird, wird uns der Patriotismus unseres Volkes helfen, uns mühelos an jede Situation anzupassen. Die Sicherung dieser Unterstützung durch eine breite Mobilisierung ist für eine schnelle Änderung unserer Politik unerlässlich."
NIDEAS_IDEA_GROUP6_BUTTON5_DESC_TT:0	"Die Neuausrichtung unserer Forschungsräte auf die bevorstehenden Kriegsanstrengungen ist für unseren Erfolg unerlässlich. Wir sollten unsere Aufmerksamkeit auf die Verbesserung der Organisation unserer Streitkräfte richten, um schnell und effektiv reagieren zu können."
NIDEAS_IDEA_GROUP6_BUTTON6_DESC_TT:0	"Das geopolitische Klima ist in Flammen aufgegangen. Die konventionelle Kriegsführung hat sich erneut als blutig und kostspielig erwiesen. Unsere ganze Aufmerksamkeit sollte auf die Forschung im Bereich der Ballistik gerichtet sein, damit wir nie wieder Blut vergießen müssen."
NIDEAS_IDEA_GROUP6_BUTTON7_DESC_TT:0	"Mit dem erhöhten Verbrauch an Nachschub zur Unterstützung unseres Militärs werden die Menschen der Hungersnot überdrüssig. Unsere klügsten Köpfe werden damit beauftragt, moderne Infrastrukturlösungen zu entwickeln, um einen schnellen Aufbau und eine schnelle Umverteilung von Gütern in unserem ganzen Land zu ermöglichen."
NIDEAS_IDEA_GROUP6_BUTTON8_DESC_TT:0	"Unsere Ressourcen sind knapp und werden durch die Geschwindigkeit, mit der wir Güter von A nach B transportieren können, eingeschränkt. Ein Team unserer besten Ingenieure hat Entwürfe entwickelt, die die Verarbeitung von Gütern in unseren Lagern automatisieren und die Lieferzeiten um mindestens das Fünffache beschleunigen würden."
NIDEAS_IDEA_GROUP6_BUTTON1_COMPLETE_DESC_TT:0	"Unsere Industrien müssen sich auf die Anpassung an das sich wandelnde geopolitische Klima vorbereiten. Durch die Entwicklung von Technologien zur effizienteren Umrüstung unserer Fabriken können wir unseren Fokus leichter zwischen zivilen und militärischen Bedürfnissen verlagern; das Kräfteverhältnis wird immer zu unseren Gunsten sein."
