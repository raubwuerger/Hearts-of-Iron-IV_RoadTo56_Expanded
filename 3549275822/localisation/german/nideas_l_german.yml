NIDEAS_IDEA_GROUP9_BUTTON1_DESC_TT:0	"Jede moderne, mächtige Nation benötigt eine Luftwaffe, um die Armee aus der Luft zu entlasten. Es ist an der Zeit, dass wir beginnen, ernsthaft in die Ressourcen, Doktrinen und das Oberkommando zu investieren, die unsere zukünftige Luftwaffe ausmachen werden."
NIDEAS_IDEA_GROUP9_BUTTON2_DESC_TT:0	"Wir können nicht einfach darauf warten, dass sich die Begabten der Akademie zeigen und freiwillig melden. Um die Luftwaffe problemlos auszubauen, müssen wir aktiv nach neuen Talenten suchen, sie fördern und sie sofort in höhere Positionen berufen."
NIDEAS_IDEA_GROUP9_BUTTON3_DESC_TT:0	"Die derzeitige Ausbildung innerhalb der Akademie ist zwar gut, aber wir müssen uns um ihre Verbesserung bemühen. Indem wir höhere Erwartungen an unsere Studenten stellen, stellen wir sicher, dass jeder angehende Pilot sein Flugzeug in- und auswendig kennt und weiß, wie man es am besten einsetzt."
NIDEAS_IDEA_GROUP9_BUTTON4_DESC_TT:0	"Der Staat hat ein nationales Luftverteidigungsprogramm ratifiziert, das sicherstellen soll, dass kein feindliches Flugzeug das Land erreichen kann. Als erster Teil dieses neuen Programms wurden namhafte Unternehmen aus dem Elektroniksektor kontaktiert und beauftragt, massiv in statische Verteidigungs- und Radarplattformen zu investieren."
NIDEAS_IDEA_GROUP9_BUTTON5_DESC_TT:0	"Im Rahmen des ADP wurde in einer privaten Sitzung zwischen dem Staatsoberhaupt und unserem nationalen Geheimdienst vereinbart, dass sie sich auf die Entschlüsselung feindlicher Luftflotten und die Analyse ihrer Bewegungen konzentrieren werden."
NIDEAS_IDEA_GROUP9_BUTTON6_DESC_TT:0	"Als letzter Schritt des ADP wurden die großen Industrieunternehmen des Landes dazu angehalten, eine stärker auf Schutz ausgerichtete Politik zu verfolgen, um sicherzustellen, dass sowohl ihre Industrieanlagen als auch ihre Produkte besser für die Verteidigung gegen feindliche Flugzeuge geeignet sind."
NIDEAS_IDEA_GROUP9_BUTTON7_DESC_TT:0	"Es ist offensichtlich, dass das Land bald in den Krieg ziehen wird. Mit unserer verstärkten Luftwaffe und unseren motivierten Piloten ist jetzt der richtige Zeitpunkt gekommen, um die letzten Verbesserungen an unseren Flugzeugen vorzunehmen und unsere Flughäfen für den bevorstehenden langen Konflikt massiv auszubauen."
NIDEAS_IDEA_GROUP9_BUTTON8_DESC_TT:0	"Den Studenten der Akademie muss beigebracht werden, sich wie ihre Mentoren und ehemaligen Kriegshelden anzustrengen. Die Verherrlichung unserer ehemaligen Spitzenpiloten wird unsere Studenten weiter motivieren, ihr Bestes zu geben und selbst zu Legenden zu werden."
NIDEAS_IDEA_GROUP9_BUTTON9_DESC_TT:0	"Die neueste der potenziellen Doktrinen, die derzeit von der Akademie geprüft wird, ist ein optimierter Einsatz von Bomberstaffeln und deren Daten innerhalb und außerhalb des feindlichen Territoriums, um sicherzustellen, dass unter Berücksichtigung feindlicher Variablen maximaler Schaden angerichtet werden kann."
NIDEAS_IDEA_GROUP9_BUTTON1_COMPLETE_DESC_TT:0	"Jede moderne, mächtige Nation benötigt eine Luftwaffe, um die Armee aus der Luft zu entlasten.Es ist an der Zeit, dass wir beginnen, ernsthaft in die Ressourcen, Doktrinen und das Oberkommando zu investieren, die unsere zukünftige Luftwaffe ausmachen werden."
NIDEAS_IDEA_GROUP9_BUTTON2_COMPLETE_DESC_TT:0	"Wir können nicht einfach darauf warten, dass sich die Begabten der Akademie zeigen und freiwillig melden. Um die Luftwaffe leicht zu vergrößern, müssen wir aktiv nach neuen Talenten suchen, sie fördern und sie sofort in höhere Positionen berufen."
NIDEAS_IDEA_GROUP9_BUTTON3_COMPLETE_DESC_TT:0	"Die derzeitige Ausbildung an der Akademie ist zwar gut, aber wir müssen uns um ihre Verbesserung bemühen. Höhere Erwartungen an unsere Studenten stellen wird sicherstellen, dass jeder angehende Pilot sein Flugzeug in- und auswendig kennt und weiß, wie man es am besten einsetzt."
NIDEAS_IDEA_GROUP9_BUTTON4_COMPLETE_DESC_TT:0	"Der Staat hat ein nationales Luftverteidigungsprogramm ratifiziert, das sicherstellen soll, dass kein feindliches Flugzeug das Land erreichen kann. Als erster Teil dieses neuen Programms wurden namhafte Unternehmen aus dem Elektroniksektor kontaktiert und beauftragt, umfangreich in statische Verteidigungs- und Radarplattformen zu investieren."
NIDEAS_IDEA_GROUP9_BUTTON5_COMPLETE_DESC_TT:0	"Im Rahmen des ADP wurde in einer privaten Sitzung zwischen dem Staatsoberhaupt und unserem nationalen Nachrichtendienst vereinbart, dass dieser sich auf die Entschlüsselung feindlicher Luftflotten und die Analyse ihrer Bewegungen konzentrieren wird."
NIDEAS_IDEA_GROUP9_BUTTON6_COMPLETE_DESC_TT:0	"Als letzter Schritt des ADP wurden die großen Industrieunternehmen des Landes dazu angehalten, eine stärker auf Schutz ausgerichtete Politik zu verfolgen, um sicherzustellen, dass sowohl ihre Industrieanlagen als auch ihre Produkte besser für die Verteidigung gegen feindliche Flugzeuge geeignet sind."
NIDEAS_IDEA_GROUP9_BUTTON7_COMPLETE_DESC_TT:0	"Es ist offensichtlich, dass das Land bald in den Krieg ziehen wird. Mit unserer verstärkten Luftwaffe und unseren motivierten Piloten ist jetzt der richtige Zeitpunkt gekommen, um die letzten Verbesserungen an unseren Flugzeugen vorzunehmen und unsere Flughäfen für den bevorstehenden langen Konflikt massiv auszubauen."
NIDEAS_IDEA_GROUP9_BUTTON9_COMPLETE_DESC_TT:0	" Die neueste der potenziellen Doktrinen, die derzeit von der Akademie geprüft wird, sieht einen optimierten Einsatz von Bomberstaffeln und deren Daten innerhalb und außerhalb des feindlichen Territoriums vor, um sicherzustellen, dass unter Berücksichtigung feindlicher Variablen maximaler Schaden angerichtet werden kann."
