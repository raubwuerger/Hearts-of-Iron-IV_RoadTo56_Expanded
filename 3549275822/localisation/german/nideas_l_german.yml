NIDEAS_IDEA_GROUP4_BUTTON8_COMPLETE_DESC_TT:0	"Den Schülern der Akademie muss beigebracht werden, sich wie ihre Mentoren und ehemaligen Kriegshelden anzustrengen. Die Verherrlichung unserer ehemaligen Spitzenpiloten wird unsere Schüler zusätzlich motivieren, ihr Bestes zu geben und selbst zu Legenden zu werden."
