NIDEAS_IDEA_GROUP7_BUTTON1_DESC_TT:0	"Seit Jahrtausenden werden Schlachten auf dem Land ausgetragen und gewonnen. Es wäre unklug von uns, nicht die besten taktischen Köpfe der Landkriegsführung zusammenzubringen und sie mit großzügigen finanziellen Mitteln zu unterstützen."
NIDEAS_IDEA_GROUP7_BUTTON2_DESC_TT:0	"Da unsere Finanzmittel jeden Winkel unseres Landes erreichen, melden sich immer mehr eifrige Rekruten mit dem Ziel, die Spitze zu erreichen. Die Schaffung eines Fast-Track-Programms, um dies zu erreichen, wird für einen frischen Nachschub an Talenten und die damit einhergehende hohe Moral sorgen."
NIDEAS_IDEA_GROUP7_BUTTON3_DESC_TT:0	"Unser Heimatland ist von allen Seiten gefährdet, und die Kriegstrommeln werden immer lauter. Unsere Streitkräfte müssen mit allen möglichen Ressourcen ausgestattet werden, um die Nation zu verteidigen. Ob wir nun an den Stränden, auf den Landeplätzen, auf den Feldern und in den Straßen oder in den Hügeln kämpfen müssen, wir werden bereit sein. Wir werden niemals kapitulieren."
NIDEAS_IDEA_GROUP7_BUTTON4_DESC_TT:0	"Eine bis an die Zähne mit modernen Waffen ausgerüstete Armee wird jede Streitmacht überwältigen. Unsere klügsten Köpfe müssen mit der anspruchsvollen Aufgabe betraut werden, die Qualität unserer Streitkräfte auf Weltklasseniveau zu halten."
NIDEAS_IDEA_GROUP7_BUTTON5_DESC_TT:0	"Die Geschichte lehrt uns, dass hundert Elite-Veteranen einer Horde unorganisierter Kräfte Paroli bieten können. Es ist unsere Pflicht, unseren neuen Rekruten die Mittel zur Verfügung zu stellen, um dieses Niveau der Meisterschaft durch maßgeschneiderte Ausbildungsprogramme zu erreichen."
NIDEAS_IDEA_GROUP7_BUTTON6_DESC_TT:0	" Unsere derzeitige Kommandostruktur ist veraltet und nicht mehr funktionsfähig. Ihre Modernisierung wird nicht nur sicherstellen, dass es keine Fehltritte zwischen den Bataillonen gibt, sondern auch, dass sich jede Komponente unabhängig vom Kommando an schnell wechselnde Situationen anpassen kann."
NIDEAS_IDEA_GROUP7_BUTTON7_DESC_TT:0	"Unser Ziel ist der Sieg, und wir werden den Preis dafür mit Blut und Schweiß bezahlen. Unser Waffenentwicklungsprogramm muss verstärkt werden, wobei der Schwerpunkt auf der rohen Feuerkraft liegen muss, die jeder Mann und jede Frau einsetzen kann."
NIDEAS_IDEA_GROUP7_BUTTON8_DESC_TT:0	"Jeder, der daran interessiert ist, der Armee beizutreten, muss eingezogen werden, unabhängig von Alter oder Fähigkeiten. Alle, die kein Interesse haben, werden in Branchen versetzt, die für die Herstellung der gesamten Ausrüstung, die unsere riesige Streitmacht benötigt, von entscheidender Bedeutung sind."
NIDEAS_IDEA_GROUP7_BUTTON9_DESC_TT:0	"Wir haben alle, die dazu bereit waren, eingezogen und die anderen in die Fabriken geschickt. Aber unsere Armee muss noch größer werden. Die Zwangsrekrutierung ist derzeit das einzige Mittel, um dies zu erreichen, selbst wenn wir dafür auf die Bereitstellung der gesamten Ausrüstung verzichten müssen, die für das Überleben im Einsatz erforderlich ist."
NIDEAS_IDEA_GROUP7_BUTTON1_COMPLETE_DESC_TT:0	"Seit Jahrtausenden werden Schlachten auf dem Land ausgetragen und gewonnen. Es wäre unklug von uns, nicht die besten taktischen Köpfe der Landkriegsführung zusammenzubringen und sie mit großzügigen finanziellen Mitteln zu unterstützen."
NIDEAS_IDEA_GROUP7_BUTTON2_COMPLETE_DESC_TT:0	"Da unsere Finanzierung jeden Winkel unseres Landes erreicht, melden sich immer mehr eifrige Rekruten mit dem Ziel, die Spitze zu erreichen. Die Schaffung eines Fast-Track-Programms, um dies zu erreichen, wird für einen frischen Nachschub an Talenten und die damit einhergehende hohe Moral sorgen."
NIDEAS_IDEA_GROUP7_BUTTON3_COMPLETE_DESC_TT:0	"Unser Heimatland ist von allen Seiten gefährdet, und die Kriegstrommeln werden immer lauter. Unsere Streitkräfte müssen mit allen möglichen Ressourcen ausgestattet werden, um die Nation zu verteidigen. Ob wir nun an den Stränden, auf den Landeplätzen, auf den Feldern und in den Straßen oder in den Hügeln kämpfen müssen, wir werden bereit sein. Wir werden niemals kapitulieren."
NIDEAS_IDEA_GROUP7_BUTTON4_COMPLETE_DESC_TT:0	"Eine bis an die Zähne mit modernen Waffen ausgerüstete Armee wird jede Streitmacht überwältigen. Unsere klügsten Köpfe müssen mit der anspruchsvollen Aufgabe betraut werden, die Qualität unserer Streitkräfte auf Weltklasseniveau zu halten."
NIDEAS_IDEA_GROUP7_BUTTON5_COMPLETE_DESC_TT:0	"Die Geschichte lehrt uns, dass hundert Elite-Veteranen einer Horde unorganisierter Kräfte Paroli bieten können. Es ist unsere Pflicht, unseren neuen Rekruten durch maßgeschneiderte Ausbildungsprogramme die Mittel an die Hand zu geben, um dieses Niveau zu erreichen."
NIDEAS_IDEA_GROUP7_BUTTON6_COMPLETE_DESC_TT:0	"Unsere derzeitige Kommandostruktur ist veraltet und nicht mehr zeitgemäß. Ihre Modernisierung wird nicht nur sicherstellen, dass es keine Missverständnisse zwischen den Bataillonen gibt, sondern auch, dass sich jede Komponente unabhängig vom Kommando an schnell wechselnde Situationen anpassen kann."
NIDEAS_IDEA_GROUP7_BUTTON7_COMPLETE_DESC_TT:0	"Unser Ziel ist der Sieg, und wir werden den Preis dafür mit Blut und Schweiß bezahlen. Unser Waffenentwicklungsprogramm muss mit einem Fokus auf roher Feuerkraft, die jeder Mann und jede Frau einsetzen kann, gestärkt werden."
NIDEAS_IDEA_GROUP4_BUTTON9_COMPLETE_DESC_TT:0	"Unsere Ingenieure schlagen vor, dass alle Torpedo-Abschusssysteme verbessert werden können, indem wir unsere Sichtweise auf Torpedos ändern. Schließlich kommt es nicht auf die Größe des Sprengkopfes an, sondern darauf, wie man ihn einsetzt."
