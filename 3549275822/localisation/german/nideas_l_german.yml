NIDEAS_IDEA_GROUP3_BUTTON1_DESC_TT:0	"Unsere Fabriken sind veraltet, und wir müssen bereit sein, den Preis dafür zu zahlen. Durch die Subventionierung der Bauwerkzeugindustrie wird die Produktion gesteigert und die Reparaturkosten für die Unternehmen gesenkt."
NIDEAS_IDEA_GROUP3_BUTTON2_DESC_TT:0	"Investitionen in den Bereich Prospektion und Bohrungen werden uns neue Reserven an wertvollen Rohstoffen erschließen, mit denen wir handeln können."
NIDEAS_IDEA_GROUP3_BUTTON3_DESC_TT:0	"Unsere Wirtschaft verlangsamt sich; wir müssen weiterhin finanzielle Anreize für Industrieprojekte bieten, um die Nachfrage zu steigern, auch wenn dies auf Kosten des Wohnungsbaus geht."
NIDEAS_IDEA_GROUP3_BUTTON4_DESC_TT:0	"Die Bereitstellung von mehr Geld für Bildungsangebote, die aktiv für Karrieren in der Industrie werben, wird die Beschäftigung im Ingenieurswesen rasch steigern. Einige werden möglicherweise neue Durchbrüche in der industriellen Forschung erzielen und uns so einen Wettbewerbsvorteil sichern."
NIDEAS_IDEA_GROUP3_BUTTON5_DESC_TT:0	"Unser Wirtschaftswachstum kann ohne mehr Arbeitskräfte nicht aufrechterhalten werden. Wir müssen die Kosten tragen, um mehr Zivilisten in unseren Fabriken zu beschäftigen."
NIDEAS_IDEA_GROUP3_BUTTON6_DESC_TT:0	"Die Schaffung neuer Transportverbindungen, um mehr Rohstoffe zu den Fabriken zu transportieren, wird die Produktion steigern, solange die Arbeiter Überstunden leisten."
NIDEAS_IDEA_GROUP3_BUTTON7_DESC_TT:0	"Die zunehmende wirtschaftliche Belastung der Zivilbevölkerung aufgrund der destabilisierenden politischen Lage weltweit ist nicht unbemerkt geblieben. Wir können es uns nicht leisten, dass sich Armut in unserem Land ausbreitet, und müssen die Sozialleistungen erhöhen, unabhängig von den Kosten."
NIDEAS_IDEA_GROUP3_BUTTON8_DESC_TT:0	"Wenn wir die Sozialausgaben erhöhen, müssen wir sicherstellen, dass die Wirtschaft weiter wächst, um dies zu finanzieren. Die Finanzierung wichtiger Wirtschaftssektoren wird dazu beitragen, das Wachstum anzukurbeln und die Zivilbevölkerung zufrieden zu stellen."
NIDEAS_IDEA_GROUP3_BUTTON1_COMPLETE_DESC_TT:0	"Unsere Fabriken sind veraltet, und wir müssen bereit sein, den Preis dafür zu zahlen. Durch die Subventionierung der Baugeräteindustrie wird die Produktion gesteigert und die Reparaturkosten für die Unternehmen gesenkt."
