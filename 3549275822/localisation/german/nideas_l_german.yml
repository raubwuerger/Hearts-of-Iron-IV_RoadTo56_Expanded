NIDEAS_IDEA_GROUP9_SPIRIT1_desc:0	"Jede moderne, mächtige Nation benötigt eine Luftwaffe, um die Armee aus der Luft zu entlasten.Es ist an der Zeit, dass wir beginnen, ernsthaft in die Ressourcen, Doktrinen und das Oberkommando zu investieren, die unsere zukünftige Luftwaffe ausmachen werden."
NIDEAS_IDEA_GROUP9_SPIRIT2_desc:0	"Wir können nicht einfach darauf warten, dass sich die Begabten der Akademie zeigen und freiwillig melden. Um die Luftwaffe leicht erweitern zu können, müssen wir aktiv nach neuen Talenten suchen, sie fördern und sie sofort in höhere Positionen berufen."
NIDEAS_IDEA_GROUP9_SPIRIT3_desc:0	"Die derzeitige Ausbildung an der Akademie ist zwar gut, aber wir müssen uns um ihre Verbesserung bemühen. Höhere Erwartungen an unsere Studenten stellen wird sicherstellen, dass jeder angehende Pilot sein Flugzeug in- und auswendig kennt und weiß, wie man es am besten einsetzt."
NIDEAS_IDEA_GROUP9_SPIRIT4_desc:0	"Der Staat hat ein nationales Luftverteidigungsprogramm ratifiziert, das sicherstellen soll, dass kein feindliches Flugzeug das Land berührt. Als erster Teil dieses neuen Programms wurden namhafte Unternehmen aus dem Elektroniksektor kontaktiert und beauftragt, umfangreich in statische Verteidigungs- und Radarplattformen zu investieren."
NIDEAS_IDEA_GROUP9_SPIRIT5_desc:0	"Im Rahmen des ADP wurde in einer privaten Sitzung zwischen dem Staatsoberhaupt und unserem nationalen Geheimdienst vereinbart, dass sie sich auf die Entschlüsselung feindlicher Luftflotten und die Analyse ihrer Bewegungen konzentrieren werden."
NIDEAS_IDEA_GROUP9_SPIRIT6_desc:0	"Als letzter Schritt des ADP wurden die großen Industrieunternehmen des Landes dazu angehalten, eine stärker auf Schutz ausgerichtete Politik zu verfolgen, um sicherzustellen, dass sowohl ihre Industrieanlagen als auch ihre Produkte besser für die Verteidigung gegen feindliche Flugzeuge geeignet sind."
NIDEAS_IDEA_GROUP9_SPIRIT7_desc:0	"Es ist offensichtlich, dass das Land bald in den Krieg ziehen wird. Mit unserer verstärkten Luftwaffe und unseren motivierten Piloten ist jetzt der richtige Zeitpunkt gekommen, um die letzten Verbesserungen an unseren Flugzeugen vorzunehmen und unsere Flughäfen für den bevorstehenden langen Konflikt massiv auszubauen."
NIDEAS_IDEA_GROUP9_SPIRIT8_desc:0	"Den Studenten der Akademie muss beigebracht werden, sich wie ihre Mentoren und ehemaligen Kriegshelden anzustrengen. Die Verherrlichung unserer ehemaligen Spitzenpiloten wird unsere Studenten weiter inspirieren, ihr Bestes zu geben und selbst zu Legenden zu werden."
