NIDEAS_IDEA_GROUP8_BUTTON1_DESC_TT:0	"Diejenigen, die die Meere beherrschen, verändern den Verlauf des Krieges. Es liegt an uns, durch Investitionen in die Marine jetzt zukünftige Siege zu sichern."
NIDEAS_IDEA_GROUP8_BUTTON2_DESC_TT:0	" Wir haben finanzielle Investitionen in die Marine getätigt, aber es mangelt uns an Personal für unsere schnell wachsende Flotte. Unter den Reihen befinden sich zukünftige Admirale, die unabhängig von ihrer Erfahrung unverzüglich befördert werden müssen."
NIDEAS_IDEA_GROUP8_BUTTON3_DESC_TT:0	"Unsere Flotte ist mächtig, hat jedoch die Kapazitäten unserer Privatindustrie bei weitem übertroffen, was ihre Instandhaltung betrifft. Es besteht nun ein starker politischer Wille, diese Werften zu verstaatlichen, um restriktive Maßnahmen aufzuheben, die die Produktion viel zu lange eingeschränkt haben."
NIDEAS_IDEA_GROUP8_BUTTON4_DESC_TT:0	"Die Effizienz unserer Industrie kann drastisch verbessert werden, indem wir einfach Schiffsteile in Massen produzieren, unabhängig davon, ob wir sie gerade benötigen."
NIDEAS_IDEA_GROUP8_BUTTON5_DESC_TT:0	"Die Planung von Kriegsspielen ist für die Organisation einer Flotte unserer Größe von entscheidender Bedeutung. Mit verbesserten Taktiken werden wir sicherlich jeden Gegner, ob groß oder klein, auf offener See besiegen."
NIDEAS_IDEA_GROUP8_BUTTON6_DESC_TT:0	"Wir können die Standardstrukturen unserer Marinehäfen erheblich verbessern, indem wir unnötige Kontrollen und Vorschriften abschaffen. Ohne bürokratische Hürden können wir die privatisierten maritimen Industrien noch weiter vorantreiben."
NIDEAS_IDEA_GROUP8_BUTTON7_DESC_TT:0	"Die Konzentration auf schnelle Operationen kleiner Flotten erfordert eine Neubewertung der Vorgehensweise bei Operationen gegen eine größere maritime Präsenz. Unsere Admirale müssen darauf trainiert werden, die Integrität ihrer Schiffe um jeden Preis zu bewahren, auch wenn dies übervorsichtig erscheint, damit wir den Kampf an einem anderen Tag fortsetzen können."
NIDEAS_IDEA_GROUP8_BUTTON8_DESC_TT:0	"Die Entwicklung fortschrittlicher meteorologischer Modelle, um unseren Admiralen die aktuellsten Wetterinformationen zur Verfügung zu stellen, wird es ihnen ermöglichen, diese zu ihrem Vorteil zu nutzen. Unsere Feinde werden einen unüberwindbaren Sturm sehen, während wir eine Gelegenheit erkennen, kalkulierten Schaden anzurichten."
NIDEAS_IDEA_GROUP8_BUTTON9_DESC_TT:0	"Unsere Ingenieure schlagen vor, dass alle Torpedoabschusssysteme verbessert werden können, indem wir unsere Sichtweise auf Torpedos ändern. Schließlich kommt es nicht auf die Größe des Sprengkopfes an, sondern darauf, wie man ihn einsetzt."
