NIDEAS_IDEA_GROUP4_BUTTON1_DESC_TT:0	"Proteste stellen eine der größten Belastungen für unsere Streitkräfte dar, da sie mit der Ausdehnung unserer Territorien immer häufiger in Gewalt ausarten. Durch sorgfältige Formulierung können wir Gesetze entwerfen, die den Umfang und die potenzielle Gefahr von Protesten begrenzen und gleichzeitig den Anschein einer gleichberechtigten Gesellschaft wahren."
NIDEAS_IDEA_GROUP4_BUTTON2_DESC_TT:0	"Unsere besten Ingenieure betrachten unsere Infrastruktur als Engpass in unserer Industrie. Wir müssen alle Anstrengungen unternehmen, um alle unsere Bürger im ganzen Land miteinander zu verbinden und ihnen Zugang zu Arbeitsplätzen zu verschaffen, die unsere Expansion weiter vorantreiben können."
NIDEAS_IDEA_GROUP4_BUTTON3_DESC_TT:0	"Unsere Verfassung ist veraltet und fehlerhaft. Im Zuge unserer Expansion müssen unsere Gesetzgeber regelmäßig Gesetzesentwürfe ausarbeiten, die die Grundlagen unserer Union korrigieren. Wir müssen uns zur Reform dieses zentralen Dokuments verpflichten, um diese zunehmend zeitaufwändige Aufgabe zu vermeiden und unserem Land einen zuvor verbotenen Weg zu ermöglichen."
NIDEAS_IDEA_GROUP4_BUTTON4_DESC_TT:0	"Wir sind zu einer der größten Mächte geworden, die diese Erde zieren. Unsere Macht ist unbestritten. Unser Volk steht hinter uns. Unsere Herrschaft ist absolut."
NIDEAS_IDEA_GROUP4_BUTTON5_DESC_TT:0	"Indem wir Einheimischen aus unseren neu erworbenen Gebieten den Zugang zu diesem besonderen Dienst ermöglichen, vermeiden wir, dass unsere neuesten Waffen und unsere besten Soldaten für Garnisonsaufgaben eingesetzt werden müssen. Diese Hilfstruppen sind zudem besser mit der lokalen Bevölkerung vertraut und werden nicht als ausländische Invasoren angesehen, sodass wir unsere Aufmerksamkeit ohne Bedenken auf andere Bereiche richten können."
NIDEAS_IDEA_GROUP4_BUTTON6_DESC_TT:0	"Wir haben eine neue Verbindung zu unserer multiethnischen Bevölkerung aufgebaut, die nun aktiv an unserer Gesellschaft teilhaben möchte. Sie lebt in einer weltweit bekannten Gleichberechtigung und fördert die Einwanderung aus nah und fern."
NIDEAS_IDEA_GROUP4_BUTTON7_DESC_TT:0	"Zwang ist ein mächtiges und wirksames Mittel, das wir einsetzen müssen, um die Massen dazu zu bringen, unsere expansionistische Politik zu unterstützen. Widerwillen ist lediglich ein Hindernis, das wir überwinden müssen."
NIDEAS_IDEA_GROUP4_BUTTON8_DESC_TT:0	"Es ist unvermeidlich, dass wir mit lokalen Persönlichkeiten, die die Opposition gegen uns anführen, aneinandergeraten. Eine sorgfältige Auslese kann notwendig sein, um zivile Unruhen zu schlichten, während wir eine uns wohlgesonnene Bevölkerung in unsere neu erworbenen Gebiete bringen."
NIDEAS_IDEA_GROUP4_BUTTON1_COMPLETE_DESC_TT:0	"Proteste sind eine der größten Belastungen für unsere Streitkräfte, da sie mit der Ausdehnung unserer Territorien immer häufiger in Gewalt ausarten. Durch sorgfältige Formulierungen können wir Gesetze entwerfen, die den Umfang und die potenzielle Gefahr von Protesten begrenzen und gleichzeitig den Anschein einer gleichberechtigten Gesellschaft wahren."
