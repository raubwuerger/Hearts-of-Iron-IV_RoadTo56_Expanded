NIDEAS_MAIN_TITLE:0	"Nationale Ideen"
NIDEAS_OPEN_BUTTON_TT:0	"Klicken Sie hier, um Ihre §HNationale Ideen§!\n\nanzuzeigen. Sobald Ideen verfügbar sind, leuchtet dieses Symbol auf."
NIDEAS_CW_ICON_TT:0	"§RBürgerkrieg im Gange§!"
NIDEAS_CW_ICON_DESC_TT:0	" Ihre Regierung hat während der internen Unruhen keine Zeit, die aktuellen bürokratischen Praktiken zu verbessern und zu innovieren. \n\nNach Kriegsende erhalten Sie eine Rückerstattung von £pol_power 50 für alle Ideen, die bereits von beiden Seiten des Bürgerkriegs übernommen wurden, und alle nationalen Ideen werden zurückgesetzt."
nideas.1.a:0	"Einverstanden"
nideas.1.t:0	"Die Regierung neu aufstellen"
nideas.1.desc:0	"Das Land hat den Bürgerkrieg überwunden, jedoch nicht ohne Verluste. Während der politischen Unruhen wurden bewährte Verwaltungsverfahren, laufende Gesetzesvorlagen und Finanzierungsvereinbarungen gestört oder sogar verloren. Ihre neue Regierung hat sich neu organisiert und konzentriert sich nun intensiv darauf, zur Normalität zurückzukehren. \n\n§RSie erhalten eine Rückerstattung von £pol_power 50 für alle Ideen, die bereits von beiden Seiten des Bürgerkriegs übernommen wurden, und alle nationalen Ideen werden zurückgesetzt. §!"
