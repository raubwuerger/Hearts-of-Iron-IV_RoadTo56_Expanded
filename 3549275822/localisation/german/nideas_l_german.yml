NIDEAS_IDEA_GROUP2_BUTTON1_DESC_TT:0	"Unsere Präsenz muss auf der Weltbühne spürbar sein. Gibt es einen besseren Weg, neue Beziehungen zu knüpfen, als unsere Soft Power zu nutzen, um ein lukratives Handelsabkommen zu erzielen?"
NIDEAS_IDEA_GROUP2_BUTTON2_DESC_TT:0	"Wir können unseren wachsenden Einfluss bei eng verbündeten Staaten nutzen, um Forschungsabkommen zu schließen, die für beide Seiten von Vorteil sind, und so unseren technologischen Vorsprung gegenüber unfreundlichen Regierungen zu wahren."
NIDEAS_IDEA_GROUP2_BUTTON3_DESC_TT:0	"Mit der Ausweitung unserer diplomatischen Missionen gibt es Personen in der Regierung, die versuchen werden, Verhandlungen zu ihrem eigenen Vorteil zu nutzen. Wir müssen dies untersuchen, egal wie unbedeutend es auch sein mag, wenn wir im Ausland Vertrauen genießen wollen. "
NIDEAS_IDEA_GROUP2_BUTTON4_DESC_TT:0	"Wir werden unsere Diplomaten in Taktgefühl und Diplomatie schulen, um genau das zu erreichen, was wir wollen, ohne uns die ausländische Partei zum Feind zu machen."
NIDEAS_IDEA_GROUP2_BUTTON5_DESC_TT:0	"Indem wir unfreundlichen Staaten angemessene Zugeständnisse machen, können wir Konfrontationen gänzlich vermeiden. Unser großartiges Land soll nie wieder von Krieg heimgesucht werden."
NIDEAS_IDEA_GROUP2_BUTTON6_DESC_TT:0	"Wir werden unsere einzigartige neutrale Haltung nutzen, um uns vor Angreifern zu schützen. Sollten sie gegen uns vorgehen, wird sich die ganze Welt hinter unsere Sache stellen!"
NIDEAS_IDEA_GROUP2_BUTTON7_DESC_TT:0	"Durch die diskrete Einrichtung einer neuen Propagandaabteilung unter dem Deckmantel der öffentlichen Kommunikation bleiben unsere wahren Absichten unentdeckt und die öffentliche Meinung unserer Sache treu!"
NIDEAS_IDEA_GROUP2_BUTTON8_DESC_TT:0	"Eine starke Rhetorik kann selbst die unkooperativsten Menschen, ob aus der Region oder aus der Ferne, hinter uns versammeln. Dies ist eine notwendige Maßnahme, um alles, was wir wollen, mit Gewalt zu sichern, damit unsere Nation nicht auseinanderbricht."
NIDEAS_IDEA_GROUP2_BUTTON1_COMPLETE_DESC_TT:0	"Unsere Präsenz muss auf der Weltbühne spürbar sein. Gibt es einen besseren Weg, neue Beziehungen zu knüpfen, als unsere Soft Power zu nutzen, um ein lukratives Handelsabkommen zu erzielen?"
NIDEAS_IDEA_GROUP2_BUTTON2_COMPLETE_DESC_TT:0	"Wir können unseren wachsenden Einfluss bei eng verbündeten Staaten nutzen, um Forschungsabkommen zu schließen, die für beide Seiten von Vorteil sind, und so unseren technologischen Vorsprung gegenüber unfreundlichen Regierungen zu wahren."
