NIDEAS_IDEA_GROUP1_BUTTON1_DESC_TT:0	"Täglich strömen Ausländer in unser Land und bringen die Gedanken und Ideale ihrer Heimat mit. Durch die Überprüfung dieser Neuankömmlinge wird sichergestellt, dass niemand, der unsere Grenze überschreitet, ideologische Abweichungen hegt."
NIDEAS_IDEA_GROUP1_BUTTON2_DESC_TT:0	"Unsere Nation blickt auf eine lange Geschichte zurück, in der einige der besten Denker, Redner und Macher hervorgegangen sind. Sie nehmen einen wichtigen Platz im Leben unserer Bürger ein. Wenn wir sie davon überzeugen können, an unsere politischen Ideale zu glauben, wird der einfache Bürger diesem Beispiel folgen und uns ohne Frage unterstützen."
NIDEAS_IDEA_GROUP1_BUTTON3_DESC_TT:0	"Der Fortschritt unserer Nation hängt in hohem Maße von der Zuverlässigkeit unseres Kabinetts ab. Eine flexiblere Politik und die Anerkennung aller Minister, unabhängig von ihrer Position, stellen sicher, dass Kabinettsmitglieder bei Bedarf schnell und effizient ersetzt werden können."
NIDEAS_IDEA_GROUP1_BUTTON4_DESC_TT:0	"Unsere jüngsten Bemühungen um den politischen Status quo haben unser Land zweifellos zum Besseren verändert. Mit unseren konsolidierten Reformen können wir mit Zuversicht sagen, dass sich unsere politische Lage massiv verbessert hat und in Zukunft noch weitere Verbesserungen möglich sein werden."
NIDEAS_IDEA_GROUP1_BUTTON5_DESC_TT:0	"Die weltweiten Ereignisse haben deutlich gemacht, dass demokratische Ideale der Weg in die Zukunft sind und dass alle Menschen frei sprechen, handeln und denken können müssen. Wir werden eine völlig neue Bill of Rights verfassen, die die Sicherheit unseres Volkes und sein Recht auf ein Leben in Freiheit in Friedens- und Kriegszeiten gewährleistet. "
NIDEAS_IDEA_GROUP1_BUTTON6_DESC_TT:0	"Unsere Nation ist seit einiger Zeit ein leuchtendes Symbol für die Freiheit des Menschen. Die Partei ist der Ansicht, dass es nun an der Zeit ist, das ultimative Ziel der Partei festzuschreiben und es der Welt zu verkünden – die Notwendigkeit, sicherzustellen, dass allen Menschen, ob Brüder oder nicht, die gleichen Rechte und gleichen Freiheiten garantiert werden. Wenn wir dies erreichen, werden die Menschen unter uns dies sicherlich akzeptieren. "
NIDEAS_IDEA_GROUP1_BUTTON7_DESC_TT:0	"Die Ereignisse in der Welt haben gezeigt, dass man dem Volk in keiner Weise zutrauen kann, die Nation zu führen. Wir müssen die republikanischen Ideale außer Kraft setzen und einen brandneuen Kriegsrat einrichten, der das Volk wieder bewaffnet und bereit ist, die Nation auf alle möglichen populistischen Katastrophen vorzubereiten."
NIDEAS_IDEA_GROUP1_BUTTON8_DESC_TT:0	" Unsere Herrschaft soll absolut sein und muss dies auch bleiben, um das Volk vor sich selbst zu schützen. Eine absolute Herrschaft garantiert, dass unsere Bürokraten ungehindert arbeiten können und dass, falls es dazu kommen sollte, eine aggressive Verteidigungspolitik schneller und effizienter verfolgt werden kann."
NIDEAS_IDEA_GROUP1_BUTTON1_COMPLETE_DESC_TT:0	"Jeden Tag strömen Ausländer in unser Land und bringen die Gedanken und Ideale ihrer Heimat mit. Durch die Überprüfung dieser Neuankömmlinge wird sichergestellt, dass niemand, der unsere Grenze überschreitet, ideologische Abweichungen hegt."
NIDEAS_IDEA_GROUP1_BUTTON2_COMPLETE_DESC_TT:0	"Unsere Nation hat eine lange Tradition, einige der besten Denker, Redner und Macher hervorzubringen. Sie nehmen einen wichtigen Platz im Leben unserer Bürger ein. Wenn wir sie davon überzeugen können, an unsere politischen Ideale zu glauben, dann wird der einfache Bürger diesem Beispiel folgen und uns ohne Frage unterstützen."
NIDEAS_IDEA_GROUP1_BUTTON3_COMPLETE_DESC_TT:0	"Der Fortschritt unserer Nation hängt in hohem Maße von der Zuverlässigkeit unseres Kabinetts ab. Eine flexiblere Politik und die Anerkennung aller Minister, unabhängig von ihrer Position, stellen sicher, dass Kabinettsmitglieder bei Bedarf schnell und effizient ersetzt werden können."
NIDEAS_IDEA_GROUP1_BUTTON4_COMPLETE_DESC_TT:0	"Unsere jüngsten Bemühungen um den politischen Status quo haben unser Land zweifellos zum Besseren verändert. Mit unseren gefestigten Reformen können wir mit Zuversicht sagen, dass sich unsere politische Lage massiv verbessert hat und in Zukunft noch weitere Verbesserungen möglich sein werden."
NIDEAS_IDEA_GROUP1_BUTTON5_COMPLETE_DESC_TT:0	"Die weltweiten Ereignisse haben deutlich gemacht, dass demokratische Ideale der Weg in die Zukunft sind und dass alle Menschen frei sprechen, handeln und denken können müssen. Wir werden eine völlig neue Bill of Rights verfassen, die die Sicherheit unseres Volkes und sein Recht auf ein Leben in Freiheit in Friedens- und Kriegszeiten gewährleistet."
NIDEAS_IDEA_GROUP1_BUTTON6_COMPLETE_DESC_TT:0	"Unsere Nation ist seit einiger Zeit ein leuchtendes Symbol für die Freiheit des Menschen. Die Partei ist der Ansicht, dass es nun an der Zeit ist, das ultimative Ziel der Partei festzuschreiben und es der Welt zu verkünden – die Notwendigkeit, sicherzustellen, dass allen Menschen, Brüdern oder anderen, die gleichen Rechte und gleichen Freiheiten garantiert werden. Wenn wir dies erreichen, werden die Menschen unter uns dies sicherlich akzeptieren."
NIDEAS_IDEA_GROUP1_BUTTON7_COMPLETE_DESC_TT:0	"Die Ereignisse in der Welt haben gezeigt, dass man dem Volk in keiner Weise zutrauen kann, die Nation zu führen. Wir müssen die republikanischen Ideale außer Kraft setzen und einen neuen Kriegsrat einrichten, der das Volk wieder bewaffnet und bereit ist, die Nation auf alle möglichen populistischen Katastrophen vorzubereiten."
NIDEAS_IDEA_GROUP1_BUTTON8_COMPLETE_DESC_TT:0	"Unsere Herrschaft soll absolut sein und muss dies auch bleiben, um das Volk vor sich selbst zu schützen. Eine absolute Herrschaft garantiert, dass unsere Beamten ungehindert arbeiten können und dass, falls es dazu kommen sollte, eine aggressive Verteidigungspolitik schneller und effizienter verfolgt werden kann."
