ecf_ai_toggle:0	"ECF-KI-Entscheidungen"
ecf_ai_toggle_desc:0	" Mit dieser Entscheidungskategorie können Sie die Fähigkeit der KI, erweiterte kontinuierliche Fokussierungen zu verwenden, aktivieren oder deaktivieren. Sie haben auch die Möglichkeit, diese Entscheidungskategorie dauerhaft auszublenden."
