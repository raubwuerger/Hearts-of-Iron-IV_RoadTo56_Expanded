l_german:
continuous_increase_war_support:0	"Militaristische Propaganda"
continuous_increase_war_support_desc:0	"Zu lange hat unsere Nation die ständig wachsenden militärischen Spannungen um uns herum ignoriert. Es wäre in unserem besten Interesse, die Bevölkerung auf das Unvermeidliche vorzubereiten."
continuous_increase_stability:0	"Soziale Reformen"
continuous_increase_stability_desc:0	"Unsere Nation ist sozial in unbekanntes Terrain abgestürzt. Angesichts der politischen Unruhen in unserem Land wäre es in unserem besten Interesse, dieses Problem zu lösen, bevor es zu spät ist."
continuous_science_haven:0	"Zufluchtsort für die Wissenschaft"
continuous_science_haven_desc:0	"Da unsere Technologie im Vergleich zu unseren Nachbarn stark unterentwickelt ist, müssen wir alle unsere Ressourcen einsetzen, um sie zu verbessern."
continuous_foreign_volunteers:0	"Ausländische Freiwillige"
continuous_foreign_volunteers_desc:0	"Der Mangel an Arbeitskräften hat unsere diplomatischen Bemühungen unbestreitbar behindert. Um diesem Problem entgegenzuwirken, werden Versprechen an die Bevölkerung unserer Nachbarländer, auf unserer Seite zu kämpfen, im Austausch gegen umfangreiches persönliches Eigentum und eine beträchtliche Geldsumme sie sicherlich dazu bewegen, für uns zu kämpfen."
continuous_immigration:0	"Einwanderung"
continuous_immigration_desc:0	"Eine dauerhaftere Lösung für unser Problem des Arbeitskräftemangels wäre die Lockerung unserer Einwanderungsgesetze und die Verbesserung der Lebensbedingungen in unserem Land. Dies wird die überzeugten Nationalisten verärgern, die an die militärische Stärke des Landes ohne ausländische Freiwillige glauben."
continuous_consumer_goods_investment:0	"Investitionen in Konsumgüter"
continuous_consumer_goods_investment_desc:0	"Die begrenzten Vorräte unseres Landes werden ineffizient genutzt, und es wird immer schwieriger, unsere militärischen und zivilen Bedürfnisse gleichmäßig auszugleichen. Eine verstärkte politische und finanzielle Unterstützung für die Forschung und Entwicklung besserer Methoden zur Rationierung unserer Vorräte sollte hier Abhilfe schaffen."
continuous_land_doctrine_research:0	"Landdoktrin-Übungen"
continuous_land_doctrine_research_desc:0	"Kriegsführung ist ein Kampf der Strategien, und Strategien ändern sich ständig. Dies wurde durch die zahlreichen Fehler des letzten Weltkriegs schmerzlich deutlich. Wenn wir dem Feind in strategischer Hinsicht einen Schritt voraus sind, verschafft uns das den Vorteil, den wir benötigen, um unsere Kriege zu gewinnen."
continuous_air_doctrine_research:0	"Luftdoktrin-Übungen"
continuous_air_doctrine_research_desc:0	"Die Luftwaffe ist ein unverzichtbares Instrument der modernen Kriegsführung, und wenn wir herausfinden, wie wir sie am besten einsetzen können, verschafft uns das einen technologischen Vorsprung gegenüber unseren Feinden."
continuous_naval_doctrine_research:0	"Übungen zur Marinedoktrin"
continuous_naval_doctrine_research_desc:0	"Marinen gibt es schon seitdem der Mensch das Wasser entdeckt hat, nun ja, nicht wirklich, aber es werden neue Formen der Seekriegsführung erforscht, die unsere Vorstellung von der Marine revolutionieren werden. Eine stärkere Fokussierung auf die Technologie der Marine wird uns sicherlich die uneingeschränkte Herrschaft über die Meere ermöglichen."
continuous_military_think_tank:0	"Militärischer Think Tank"
continuous_military_think_tank_desc:0	"Die Schaffung eines Think Tanks, dem sowohl hochrangige Feldmarschälle als auch neu beförderte Generäle angehören, wird es uns ermöglichen, Kriegspläne und Operationen schneller umzusetzen und die Fähigkeiten unserer Generäle weiterzuentwickeln."
continuous_national_defense:0	"Nationale Verteidigung"
continuous_national_defense_desc:0	"Da ausländische Invasoren große Teile unseres Landes besetzt halten, sollten wir in einer letzten Anstrengung unsere Zivilbevölkerung mit allen verfügbaren Waffen versorgen und gleichzeitig unsere Befestigungsanlagen ausbauen, um ihre Invasion zu verlangsamen."
continuous_resistance_suppression:0	"Unterdrückung des Widerstands"
continuous_resistance_suppression_desc:0	"Der Gedanke, dass ausländische Zivilisten gegen unsere erfolgreiche Nation rebellieren könnten, ist unseren Vorgesetzten völlig entgangen. Um dieses Problem zu beheben, wird ein Teil unserer Industrie darauf umgestellt, mehr Vorräte für unsere unzureichenden Garnisonen zu produzieren."
continuous_renounce_foreign_occupation:0	"Ausländische Besatzung ablehnen"
continuous_renounce_foreign_occupation_desc:0	" Nach der Niederlage unserer Nation im Krieg setzt unser Volk den Kampf gegen die Besatzung fort. Unsere Exilregierung hat von unseren Verbündeten die Erlaubnis erhalten, an unser besetztes Volk zu senden, damit es seinen Kampf gegen die Besatzer fortsetzt und mit regelmäßigen Updates über die Kriegsanstrengungen und die letztendliche Rückkehr unserer Regierung rechnen kann."
continuous_work_with_local_leaders:0	"Zusammenarbeit mit lokalen Führern"
continuous_work_with_local_leaders_desc:0	" Unsere jüngsten Gebietserweiterungen haben uns zwar enorme Ressourcen und Fabriken beschert, aber auch ihren Preis. Die meisten Einheimischen sind mit unserer derzeitigen Herrschaft unzufrieden und sabotieren aktiv unsere neuen Fabriken und Ressourcen. Um sie von ihren alten Gewohnheiten abzubringen, müssen wir Kontakt zu lokalen Führern aufnehmen und eine Verbindung aufbauen, um die Beziehungen zwischen ihnen und unserer Regierung zu verbessern."
continuous_national_teachings:0	"Nationale Lehren"
continuous_national_teachings_desc:0	"Der große Zustrom neuer Menschen in das Land nach unserer jüngsten territorialen Expansion hat es schwierig gemacht, die Bevölkerung zu kontrollieren. Um die Macht in den von uns kontrollierten Regionen zu behalten, müssen wir unsere neuen Gebiete so nationalisieren wie wir selbst. Eine umfassende Unterweisung aller Altersgruppen über unsere Ideologie und unser Land in den besetzten Gebieten wird die Spannungen zwischen ihnen und ihrer neuen Regierung abbauen."
continuous_nationalism:0	"Nationalismus"
continuous_nationalism_desc:0	"In einem verzweifelten Akt des Überlebens, in dem mehr ausgegeben wird, als das Land einnimmt, und durch massive Propagandakampagnen Schulden gemacht werden, wird die Bevölkerung dieses Landes davon überzeugt, dass nicht nur ihre Regierung verloren gehen würde, sondern auch ihre gesamte Kultur und Lebensweise, die sie seit ihrer Geburt kennen, was die Menschen dazu bringen würde, den Kampf mit allen Mitteln fortzusetzen."
continuous_political_correction_democratic:0	"Politische Korrektur"
continuous_political_correction_democratic_desc:0	"Die demokratische Ideologie hat sich unter den Menschen weltweit als großer Erfolg erwiesen, aber angesichts der Präsenz fremder Ideologien in unseren Regierungsbehörden wäre es vorteilhaft, diese direkt anzusprechen, um sie mit der Mehrheit in Einklang zu bringen."
continuous_political_correction_communist:0	"Politische Säuberungen"
continuous_political_correction_communist_desc:0	"Der Kommunismus ist und bleibt die beste Ideologie. Die Beseitigung jeglicher Opposition gegen den Kommunismus wird die politische Zukunft der Nation sichern."
continuous_political_correction_fascist:0	"Politische Säuberungen"
continuous_political_correction_fascist_desc:0	"Der Faschismus hat unserer Nation in vielerlei Hinsicht geholfen. Die Sicherheit des Faschismus wird in absehbarer Zukunft unser Hauptaugenmerk sein. Jedem, der dieser Aussage nicht zustimmt, sollte man nicht vertrauen."
continuous_political_correction_neutrality:0	"Politische Herausforderer"
continuous_political_correction_neutrality_desc:0	"Die politische Sicherheit des großen Führers wurde in den letzten Monaten in Frage gestellt. Es wird ein Kabinett gebildet, um zu bestimmen, wer für und wer gegen unseren großen Führer ist. Jegliche Opposition wird unterbunden."
continuous_political_correction_nationalist:0	"Politische Säuberungen"
continuous_political_correction_nationalist_desc:0	"Angesichts der aktuellen Lage in der Welt scheint es die beste Vorgehensweise zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_totalist_principles:0	"Totalitäre Prinzipien"
continuous_totalist_principles_desc:0	"Angesichts der aktuellen Lage in der Welt scheint es die beste Vorgehensweise zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_syndicalist_principles:0	"Syndikalistische Prinzipien"
continuous_syndicalist_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es die beste Vorgehensweise zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_radical_socialist_principles:0	"Radikal-sozialistische Prinzipien"
continuous_radical_socialist_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_social_democrat_principles:0	"Sozialdemokratische Prinzipien"
continuous_social_democrat_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_social_liberal_principles:0	"Sozial-liberale Prinzipien"
continuous_social_liberal_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es am besten, die Zukunft unserer Ideologie zu sichern."
continuous_market_liberal_principles:0	"Marktliberale Prinzipien"
continuous_market_liberal_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_social_conservative_principles:0	"Sozialkonservative Prinzipien"
continuous_social_conservative_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_authoritarian_democrat_principles:0	"Autoritäre demokratische Prinzipien"
continuous_authoritarian_democrat_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_paternal_autocrat_principles:0	"Paternalistische autokratische Prinzipien"
continuous_paternal_autocrat_principles_desc:0	"Angesichts der aktuellen Weltlage scheint es die beste Vorgehensweise zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_national_populist_principles:0	"Nationalpopulistische Prinzipien"
continuous_national_populist_principles_desc:0	"Angesichts der aktuellen Lage in der Welt scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_people_principles:0	"Volksprinzipien"
continuous_people_principles_desc:0	"Angesichts des aktuellen Zustands der Ödnis scheint es am besten zu sein, die Zukunft unserer Ideologie zu sichern." "
continuous_intellectuals_principles:0	"Intellektuelle Grundsätze"
continuous_intellectuals_principles_desc:0	"Angesichts des aktuellen Zustands der Ödnis scheint es die beste Vorgehensweise zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_elites_principles:0	"Elite-Prinzipien"
continuous_elites_principles_desc:0	"Angesichts des aktuellen Zustands der Ödnis scheint es die beste Vorgehensweise zu sein, die Zukunft unserer Ideologie zu sichern."
continuous_ruler_principles:0	"Herrscherprinzipien"
continuous_ruler_principles_desc:0	"Angesichts des aktuellen Zustands der Ödnis scheint die Sicherung der Zukunft unserer Ideologie die beste Vorgehensweise zu sein."
continuous_synthetic_nation:0	"Synthetische Nation"
continuous_synthetic_nation_desc:0	"Der Mangel an natürlichen Ressourcen in unserem Land, insbesondere an Öl und Kautschuk, hat unsere militärischen Fähigkeiten erheblich beeinträchtigt. Es werden Mittel für die Errichtung und Verbesserung synthetischer Raffinerien bereitgestellt, um diese Probleme zu beheben."
continuous_infrastructure_improvements:0	"Verbesserung der Infrastruktur"
continuous_infrastructure_improvements_desc:	"Der schlechte Zustand unserer Straßen hat die industrielle Expansion und die Truppenbewegungen unseres Landes behindert. Eine Aufstockung des Budgets für die Verbesserung unserer Infrastruktur wird die dringend notwendigen Reparaturen und Erweiterungen ermöglichen."
continuous_new_naval_structures:	"Neue Marineeinrichtungen"
continuous_new_naval_structures_desc:	"Landkriegsführung wird immer überlegen sein gegenüber Seekriegsführung, jedoch sind die Seestreitkräfte dieses Landes stagniert. Täglich bemühen wir uns, mit anderen Ländern auf offener See zu konkurrieren. Ein Fokus auf den Aufbau von Marinestützpunkten und Werften wird notwendig sein, damit wir unseren Ruhm auf den Meeren zurückgewinnen können."
continuous_new_aerial_structures:	"Neue Luftstrukturen"
continuous_new_aerial_structures_desc:	"Landkriegsführung wird immer Luftkriegsführung überlegen sein, aber die Luftstreitkräfte dieses Landes stagnieren. Jeden Tag kämpfen wir darum, mit anderen Ländern in der Luft mithalten zu können. Um unseren Ruhm in den Lüften zurückzugewinnen, müssen wir uns auf den Aufbau von Luftwaffenstützpunkten und Radarstationen konzentrieren."
continuous_defense_in_depth:0	"Tiefgehende Verteidigung"
continuous_defense_in_depth_desc:0	"Angesichts der politischen Unruhen, in die die Welt zu geraten scheint, erscheint es nahezu unmöglich, unser Heimatland mit den begrenzten personellen Ressourcen unseres Landes zu verteidigen. Um dies auszugleichen, muss ein großes Engagement für den Bau massiver Befestigungsanlagen entlang unserer Grenze erfolgen, um potenzielle ausländische Angreifer davon abzuhalten, unser Land zu erobern."
continuous_exploit_natural_resources:0	"Ausbeutung natürlicher Ressourcen"
continuous_exploit_natural_resources_desc:0	"Erhöhte Ausgaben für die Gewinnung der natürlichen Ressourcen dieses Landes würden dazu beitragen, unseren Außenhandel und den Aufbau unseres Militärs zu unterstützen."
continuous_lower_industrial_taxes:0	"Senkung der Industriesteuern"
continuous_lower_industrial_taxes_desc:0	"Die Senkung der Steuern für unsere zivile Industrie wird dazu beitragen, Unternehmen Geld zurückzugeben, damit sie sich verbessern und expandieren können, um unsere Wirtschaft anzukurbeln. Der Nachteil ist, dass wir zur Aufrechterhaltung eines ausgeglichenen Haushalts die Steuern für unsere Militärindustrie erhöhen müssen. Dies wird sich erheblich auf unsere zukünftigen Kriegsanstrengungen auswirken und es für Unternehmen schwieriger machen, von Konflikten zu profitieren."
continuous_lower_military_taxes:0	"Senkung der Militärsteuern"
continuous_lower_military_taxes_desc:0	"Die Senkung der Militärsteuern wird es Unternehmen, die versuchen, von Kriegen zu profitieren, ermöglichen, sich zu verbessern und zu expandieren. Der Nachteil ist, dass wir zur Aufrechterhaltung eines ausgeglichenen Haushalts die Steuern für die zivile Industrie erhöhen müssen. Dies wird es für Unternehmen aufgrund der gestiegenen Preise schwieriger machen, ihre Produkte zu verkaufen."
continuous_industry_for_autonomy:0	"Industrie für Autonomie"
continuous_industry_for_autonomy_desc:0	"Wenn wir unseren Oberherrn davon überzeugen, unsere nationale Autonomie im Austausch für einen größeren Anteil an unserer Industrie zu erhöhen, können wir unsere Unabhängigkeit gewinnen, und es wird unserem Oberherrn helfen, indem es ihm langfristig mehr Fabriken zur Verfügung stellt, um seine eigene Wirtschaft anzukurbeln."
continuous_foreign_investments_ecf:0	"Ausländische Investitionen"
continuous_foreign_investments_ecf_desc:0	"Investitionen in ausländische Gebiete, indem wir ihnen beim Aufbau ihrer Unternehmen helfen und im Gegenzug einen kleinen Teil ihrer Einnahmen erhalten, werden uns finanziell helfen, da wir dadurch Gesetze erlassen und Minister ernennen können."
continuous_volunteers_program:0	"Freiwilligenprogramm"
continuous_volunteers_program_desc:0	"Die Einführung des Freiwilligenprogramms würde es unserem Land erleichtern, in den Ausgang ausländischer Kriege einzugreifen, indem die Öffentlichkeit davon überzeugt wird, dass die Unterstützung eines anderen Landes in seinem Kampf dazu beitragen würde, die Ausbreitung anderer gefährlicher Ideologien zu verhindern."
continuous_temporary_agents_ecf:0	"Befristete Agenten"
continuous_temporary_agents_ecf_desc:0	"§R\"STRENG GEHEIM\"§!"
continuous_counter_intelligence:	"Spionageabwehr"
continuous_counter_intelligence_desc:	" Es gibt §RBetrüger§! unter uns."
continuous_infantry_equipment_research:	"Forschung zu Infanterieausrüstung"
continuous_infantry_equipment_research_desc:	"Die Erfindung des Pulvergewehrs gilt als eine der einflussreichsten Erfindungen in der gesamten Menschheitsgeschichte. Warum sollte man es nicht verbessern? "
continuous_air_equipment_research:	"Forschung im Bereich Luftfahrt"
continuous_air_equipment_research_desc:	"Flugzeuge haben sich im letzten Weltkrieg als wirksames Mittel erwiesen. Es wäre in unserem besten Interesse, diese Konstruktionen zu unserem Vorteil zu nutzen und zu verbessern."
continuous_naval_equipment_research:0	"Forschung im Bereich Marine"
continuous_naval_equipment_research_desc:0	"Unsere derzeitigen industriellen Kapazitäten schränken die Anzahl der Marineschiffe ein, die wir bauen können. Um unserer Marine eine Chance gegen unsere Feinde zu geben, sollten wir uns auf die Qualität konzentrieren. Eine stärkere Fokussierung auf die Technologie der Marine wird uns sicherlich die uneingeschränkte Herrschaft über die Meere sichern."
continuous_artillery_research:0	"Artillerieforschung"
continuous_artillery_research_desc:0	"Die Nachwirkungen des letzten Weltkriegs verfolgen uns bis heute. Angesichts der überall wachsenden Spannungen wird es notwendig, unsere Armeen für einen weiteren großen Konflikt zu finanzieren. Artillerie war und ist die Zukunft der Kriegsführung."
continuous_armor_research:0	"Panzerforschung"
continuous_armor_research_desc:0	"Die Nachwirkungen des letzten Weltkriegs verfolgen uns bis heute. Die Zahl der unnötigen Todesfälle belastet die Gemüter der Menschen. Was wir brauchen, ist ein schneller und entschiedener Sieg über unsere Feinde. Aus den Lehren der Schlachten des letzten Weltkriegs wird der massive Einsatz von Panzern in unseren Armeen uns sicherlich den Sieg bringen!"
continuous_industry_research:0	"Industrieforschung"
continuous_industry_research_desc:0	"Wenn die Zahl der Soldaten auf dem Schlachtfeld keine Rolle spielt, entscheidet die Menge an Waffen, die ein Land herstellen kann, über den Ausgang eines Krieges. Bessere Fertigungstechniken und der großflächige Bau von militärischen Fabriken werden unseren Soldaten mehr Waffen an die Hand geben und unserem Land mehr Siege einbringen."
continuous_rocketry_research:0	"Raketenforschung"
continuous_rocketry_research_desc:0	""Grundlagenforschung ist das, was ich mache, wenn ich nicht weiß, was ich mache." – Wernher von Braun"
continuous_nuclear_research:0	"Kernforschung"
continuous_nuclear_research_desc:0	"Jetzt bin ich der Tod, der Zerstörer der Welten." – Julius Robert Oppenheimer"
continuous_owb_robotics_research:0	"Robotikforschung"
continuous_owb_robotics_research_desc:0	"Mr. Handy, es funktioniert einfach!" – Gründer und CEO von RobCo, Robert Edwin House ... wahrscheinlich"
continuous_boost_freedom:0	"Autonomie erhöhen"
continuous_boost_freedom_desc:0	"Durch die Umstrukturierung unserer Kolonialverwaltung und die Einstellung einheimischer Verwaltungsbeamter werden wir mit der Zeit in der Lage sein, unsere Angelegenheiten selbst in die Hand zu nehmen."
continuous_restrict_freedom:0	"Untertanen unterdrücken"
continuous_restrict_freedom_desc:0	"Unsere Kolonialuntertanen haben ziemlich absurde Vorstellungen von Dingen wie "Selbstbestimmung" oder "nationale Unabhängigkeit". Es ist an der Zeit, sie von diesen Vorstellungen abzubringen."
continuous_industry_for_autonomy_tt:0	"Fabriken an Oberherr: §R+50 %§! \nTäglicher Autonomiegewinn: §G+2,0§!"
