JGT03_mklsjd:0	"McClusky Luftlandung"
JGT03_mklsjd_desc:0	"Der tapfere Kommandant McClusky hat uns vielleicht einen unerwarteten Effekt im Krieg beschert....."
JGT03_ljhz:0	"Landbombardierung"
JGT03_ljhz_desc:0	"Mit der Infanterie durch die Linien brechen"
