l_german:
expandable_soldier_doctrine_spirit:0	"Doktrin des ausbaufähigen Soldaten"
JGT01_zzwy:0	"Politischer Kommissar"
JGT01_zzwy_desc:0	"Die vollständige Bezeichnung lautet Politischer Kommissar. Es handelt sich um den führenden Kader, der für die parteipolitische Arbeit in den Kampfeinheiten der Armeen der UdSSR und der sozialistischen Länder nach dem Vorbild der Sowjetunion auf Regimentsebene und darüber verantwortlich ist, wobei die militärischen Befehlshaber auf derselben Ebene zusammenfassend als Leiter der Einheit bezeichnet werden."
airborne_vanguard_spirit:0	"Luftlande-Vorhut"
JGT01_smzypd:0	"Granaten über Leichen"
JGT01_smzypd_desc:0	"Die Armeedoktrin, sich durch den richtigen Einsatz von Feuerkraft einen Vorteil gegenüber dem Feind zu verschaffen und dann die Feuerkraft des Feindes zu unterdrücken."
JGT01_zyqbj:0	"CIA"
JGT01_zyqbj_desc:0	"Eine Organisation, die geheime Detektivarbeit betreibt, um vertrauliche Informationen von einem Gegner oder Konkurrenten zu erhalten oder Sabotageaktivitäten zum Vorteil der Partei durchzuführen, für die sie arbeitet."
JGT01_yggs:0	"Festung"
JGT01_yggs_desc:0	"Auf eine starke Festung ist immer Verlass"
JGT01_sdz:0	"Blitzkrieg"
JGT01_sdz_desc:0	"Panzer-Vorwärts!"
JGT01_tzzz:0	"Spezialtruppen"
JGT01_tzzz_desc:0	"Wer wagt, gewinnt"
JGT01_zzcc:0	"Unser Wille vereint sich wie eine Festung"
JGT01_zzcc_desc:0	"Wir werden unser Fleisch und Blut einsetzen, um eine weitere Große Mauer zu errichten."
JGT01_gxzy:0	"Herausragende Verdienste"
JGT01_zzj:0	"das Politische Büro"
JGT01_zzj_desc:0	"Männer, Waffen und militärische Ideologie, die drei Grundelemente einer Armee."
JGT01_xdjx:0	"West Point"
JGT01_xdjx_desc:0	"Richtige Strategie und Taktik sind wichtiger als überlegene Kraft."
JGT01_wushidao:0	"bushido"
JGT01_wushidao_desc:0	"Stirb ohne zu denken, stirb ohne Angst, stirb ohne zu zögern."
JGT01_scmz:0	"Die Mandschurei zuerst"
JGT01_scmz_desc:0	"Die Mandschus sind für die Acht Banner zuständig."
JGT01_wzgh:0	"Gleichheit der fünf Völker"
JGT01_wzgh_desc:0	"Die Völker Chinas und der Mandschurei sind gleichberechtigt, und zusammen mit den Chinesen, Mandschus, Mongolen, Muslimen und Tibetern bilden sie das Volk einer großen Nation."
JGT01_hfjx:0	"Militärakademie der Republik China"
JGT01_hfjx_desc:0	"Der Weg ist nicht weit, lassen Sie sich nicht beunruhigen. Wir werden weiterhin treu und aufrichtig sein. Führen Sie den Geist unserer Schule weiter. Führen Sie den Geist unserer Schule weiter!"
JGT01_ncsb:0	"OB"
JGT01_ncsb_desc:0	"Die faschistische paramilitärische Organisation Ossewa brandwag wird die Führung unserer Streitkräfte übernehmen. Um die Interessen der weißen Südafrikaner weiter zu sichern, müssen wir den Anteil der Farbigen in Südafrika begrenzen, indem wir sie aus den Streitkräften entfernen und auf das Land zurücktreiben"
JGT01_nslmdry:0	"Salomos Nachfolger"
JGT01_nslmdry_desc:0	"Das Äthiopische Reich war in geistiger Hinsicht der Nachfolger des Reiches von Axum, das von den Nachkommen des legendären Königs Salomon und der Königin von Saba, den Verteidigern des koptisch-orthodoxen Glaubens, regiert wurde. Ihr Untergang war eine Tragödie für die äthiopische koptische Orthodoxie, aber der äthiopische Geist lebt weiter - und es liegt an denen wie uns, die nach ihnen kommen, ihn wiederzubeleben!"
JGT01_zyxz:0	"Die Verfassung der Freiheit"
JGT01_zyxz_desc:0	"Befreien wir uns von der Angst, befreien wir uns von der gegenseitigen Unterdrückung, befreien wir uns von unserer eigenen Unterdrückung, und schaffen wir gemeinsam eine Gesellschaft der Liebe und des Friedens."
JGT01_napolun:0	"Militärakademie Saint-Cyr"
JGT01_napolun_desc:0	"Ils s'instruisent pour vaincre."
JGT01_fulongzhi:0	"Militärakademie Frunze"
JGT01_fulongzhi_desc:0	"Im April 1924 wurde Wolodymyr in seiner Eigenschaft als stellvertretender Vorsitzender des Revolutionären Militärkomitees der UdSSR und Stabschef der Roten Armee der Arbeiter und Bauern zum Direktor der Militärakademie ernannt."
JGT01_sanghesite:0	"Königliche Militärakademie Sandhurst"
JGT01_sanghesite_desc:0	"Die Königliche Militärakademie Sandhurst ist eine der wichtigsten Einrichtungen für die Ausbildung von Nachwuchsoffizieren in Großbritannien und eine der ältesten und renommiertesten Institutionen der Welt für die Ausbildung von Armeeoffizieren."
JGT01_xsjjs:0	"Der Geist der neuen Vierten Armee"
JGT01_xsjjs_desc:0	"Auf den Befehl der Partei hören, fester Glaube; Ausdauer, Tapferkeit und Mut; die gesamte Situation berücksichtigen, für das Land tolerieren; innere und äußere Einheit, Einigkeit im Ziel; Einigkeit im Ziel, strenge Disziplin."
JGT01_wdwgzz:0	"Der Große Vaterländische Krieg"
JGT01_wdwgzz_desc:0	"Die Rote Armee, die Rote Marine und alle Bürger der UdSSR sollten jeden Zentimeter des sowjetischen Territoriums verteidigen, sollten bis zum letzten Blutstropfen für die Verteidigung unserer Städte und Dörfer kämpfen und den Mut, die Initiative und den Einfallsreichtum zeigen, der unserem Volk innewohnt."
JGT01_tszddf:0	"Die Klinge des Eisernen Kreuzes"
JGT01_tszddf_desc:0	"Die germanischen Völker stehen über allen anderen Völkern."
JGT01_xsdfn:0	"Frauen im neuen Zeitalter"
JGT01_xsdfn_desc:0	"Emanzipation der Frauen und Entwicklung der Arbeitskraft"
JGT01_lql:0	"Die Heartland-Theorie"
JGT01_lql_desc:0	"Wer das Kernland kontrolliert, kontrolliert die Weltinsel, und wer die Weltinsel kontrolliert, kontrolliert die Welt."
JGT01_ycshycx:0	"Kämpfen bis zum bitteren Ende"
JGT01_ycshycx_desc:0	"einhunderttausend junge Männer einhunderttausend Soldaten; Der Kommandeur im Untergrund"
JGT01_jbtx:0	"Niemals kapitulieren"
JGT01_jbtx_desc:0	"Wir werden an den Stränden kämpfen, wir werden an den feindlichen Landungsstellen kämpfen, wir werden auf den Feldern und Straßen kämpfen, wir werden in den Bergen kämpfen. Wir werden niemals kapitulieren."
JGT01_yizhigaoang:0	"Operative Theorie der großen Tiefe"
JGT01_yizhigaoang_desc:0	"Um einen umfassenden Sieg über den Feind zu erringen, ist es notwendig, eine Reihe von aufeinanderfolgenden Angriffen durchzuführen, um alle feindlichen Kräfte zu treffen und den Feind zu desorganisieren, damit er seinen hartnäckigen Widerstand nicht fortsetzen kann."
JGT01_tzdg:0	"KÖNIGREICH GOTTES"
JGT01_tzdg_desc:0	"Das Reich Gottes ist auf die Erde gekommen."
JGT01_dlzz:0	"Amphibischer Angriff"
JGT01_dlzz_desc:0	"Wir haben einen langen und schwierigen Weg vor uns, und wir stehen einem mächtigen Feind gegenüber, der uns leicht besiegen könnte. Wir werden vielleicht nicht sofort gewinnen können, aber wir werden kämpfen und kämpfen und kämpfen und kämpfen."
JGT01_qhhq:0	"Verbesserte Logistik"
JGT01_meiguolj:0	"Begrenzte Überwachen"
JGT01_meiguolj_desc:0	"Segmentierte Starts und Landungen, Punkt-für-Punkt-Angriffe"
JGT01_jzjh:0	"Amerikanische Yakuza"
JGT01_jzjh_desc:0	"Bewältigung der gesamten Aufgabe auf einen Schlag"
JGT01_bwbl:0	"Verteidigung von Berlin"
JGT01_bwbl_desc:0	"Der Untergang"
JGT01_zphm:0	"Wert Eisenbahngeschütz"
JGT01_zphm_desc:0	"Während des Ersten und des Zweiten Weltkriegs begann Deutschland, Eisenbahngeschütze als Waffe zur Bombardierung von Festungen und Schützengräben einzusetzen, wodurch der Einsatz von Eisenbahngeschützen einen neuen Höhepunkt erreichte."
JGT01_beijinlun:0	"Streik im Norden"
JGT01_beijinlun_desc:0	"Die Anwendung von Gewalt zur Lösung der Nordfrage, um die Stabilität des Nordens zu gewährleisten, als die Entwicklung des deutsch-sowjetischen Krieges die günstigste Entwicklung für das Reich war."
JGT01_nanjinlun:0	"Den Süden angreifen"
JGT01_nanjinlun_desc:0	"Die Südsee, es ist eine bewegte Zeit...."
JGT01_jfwyh:0	"Befreiungskomitee"
JGT01_jfwyh_desc:0	"Frankreich hat eine Schlacht verloren, aber nicht den Krieg."
JGT01_sibada:0	"Der Geist von Sparta"
JGT01_sibada_desc:0	"Heute Abend speisen wir in der HÖLLE!"
JGT01_dlmyc:0	"Oströmisches Erbe"
JGT01_dlmyc_desc:0	"Konstantin, Dragases, Valerio, Kaiser der Römer von Gottes Gnaden."
JGT01_dbssj:0	"thebanische heilige armee"
JGT01_dbssj_desc:0	"Eine Legion sollte aus Kriegern bestehen, die sich gegenseitig lieben, damit sie eine unzerbrechliche und uneinnehmbare Macht bilden können."
JGT01_baqi:0	"Acht Banner"
JGT01_baqi_desc:0	"Die acht Banner sind das Fundament unseres Landes, das Land hat das nicht nötig. Die acht Banner der Mandschurei sind das Fundament unserer Dynastie, das Fundament darf nicht fixiert werden. Die acht Banner sind das Fundament des Landes."
JGT01_guandongjun:0	"Kwantung-Armee"
JGT01_guandongjun_desc:0	"Bei Sonnenuntergang können wir die Berge und Flüsse sehen, unsere Elite-Armee ist stark, und die Menschen der verbündeten Länder werden für immer glücklich sein, voller Ruhm! Die Kwantung-Armee."
JGT01_ynql:0	"Janisary"
JGT01_ynql_desc:0	"Morgen sollen sie unsere Stärke sehen, sollen sie in ihrer Verzweiflung aufschreien! Ihr hartnäckiger Widerstand ist keine Schande, er ist mutig, aber töricht!"
JGT01_qhq:0	"Erweitertes Logistikteam"
JGT01_qhq_desc:0	"Integration arbeitsloser Jugendlicher in das Q-Logistikteam, das für die Verstärkung der Logistik und Versorgung der Stehenden Armee zuständig ist"
JGT01_adwdry:0	"Der Ruhm von Adua"
JGT01_adwdry_desc:0	"Der große Kaiser von Äthiopien, Menelik II, hat uns zum Sieg von Adua geführt, der Welt gezeigt, wozu unsere Armee fähig ist und die Kolonialisten zum Rückzug ihrer Truppen gezwungen. Wir haben es beim letzten Mal geschafft und wir werden es auch dieses Mal schaffen."
JGT01_abet:0	"Embilta"
JGT01_abet_desc:0	"Die riesige äthiopische Armee basierte auf jahrhundertealten Traditionen und umfasste Truppen aus den feudalen Domänen, die zusammengezogen und einberufen worden waren. Die traditionellen Ambirta-Hörner und -Trommeln werden während der Schlachten ununterbrochen gespielt, auch wenn die Armee auf dem Marsch ist."
JGT01_kaluosi:0	"Der Geist des pfeifenden Soldaten"
JGT01_kaluosi_desc:0	"Die Hingabe der Wuthering Soldiers an Gott und die Loyalität zu ihrem König ist überragend. Sie werden auf dem Schlachtfeld sogar von Priestern begleitet, die inmitten der Kämpfe Gebete am Sterbebett sprechen. Bei der Verteidigung der ewigen Gott-Mutterland-Macht werden die Ideale von Carlos niemals in Frage gestellt!"
JGT01_dalufengsuo:0	"Fortführung des Kontinentalsystems"
JGT01_dalufengsuo_desc:0	"Alle Schiffe neutraler Staaten, die in Großbritannien angelegt haben, werden zusammen mit ihren Frachtschiffen beschlagnahmt; und Schiffe neutraler Staaten, die sich Großbritannien unterworfen haben, gelten als ihrer Nationalität beraubt und können gekapert werden."
JGT01_sdjlbxzy:0	"Drei Regeln der Disziplin und acht zu beachtende Punkte"
JGT01_sdjlbxzy_desc:0	"Erstens, alle Handlungen folgen dem Befehl; zweitens, nehmen Sie der Masse keine Nadel und keinen Faden weg; drittens, alle Beschlagnahmungen sollten der Allgemeinheit zurückgegeben werden. Die acht Punkte der Aufmerksamkeit sind: Erstens, sprechen Sie freundlich; zweitens, kaufen und verkaufen Sie fair; drittens, geben Sie zurück, was Sie geliehen haben; viertens, bezahlen Sie, was Sie beschädigt haben; fünftens, schlagen oder fluchen Sie nicht; sechstens, beschädigen Sie keine Ernte; siebtens, belästigen Sie keine Frauen; und achttens, misshandeln Sie keine Gefangenen."
JGT01_wczmlhql:0	"Proletarier vereinigt euch!"
JGT01_wczmlhql_desc:0	"Der Tod gehört nicht zur Arbeiterklasse!"
JGT01_gthl:0	"Flut aus Eisen"
JGT01_gthl_desc:0	"Die großen Operationen der Mechanisierten Korps der Sowjetunion am Ende des Krieges"
JGT01_sljzyq:0	"Der Sieg ist zum Greifen nah"
JGT01_sljzyq_desc:0	"Unterstützen Sie unsere tapfere Rote Armee und unsere glorreiche Rote Marine mit all unserer Kraft! Nutzen Sie die ganze Kraft des Volkes, um den Feind zu vernichten! Marschiert für unseren Sieg!"
JGT01_bahongyiyu:0	"hakkō ichiu"
JGT01_bahongyiyu_desc:0	"Öffnen Sie die Wellen und verkünden Sie das Prestige des Landes in alle Richtungen."
JGT01_wscf:0	"Banzai-Angriff"
JGT01_wscf_desc:0	"てんのうへいか,ばんざい！"
JGT01_kjls:0	"Fallschirmjäger"
JGT01_kjls_desc:0	"Hitlers grüner Teufel"
JGT01_tbkqt:0	"SAS"
JGT01_tbkqt_desc:0	"Obwohl wir die Schlacht an der Front verloren haben, reichten die Elitespezialeinheiten des britischen Empire aus, um Hitler nachts wach zu halten."
JGT01_hqbj:0	"Logistischer Nachschub"
JGT01_hqbj_desc:0	"Eine gute Logistik entscheidet über den Sieg im Krieg."
JGT01_gmqs:0	"Bogenschießen"
JGT01_gmqs_desc:0	"Wo die Gemeinde, wird testen, müssen zunächst den Bogen und Pferd qualifiziert, und dann erlaubt, das Haus zu betreten, so eine Zeit, wenn der alte Sohn des Herrn sind nicht vertraut mit dem Bogen und Pferd."
JGT01_xinjun:0	"Neue Armee"
JGT01_xinjun_desc:0	"Da das Militär ganz im westlichen Stil organisiert und ausgerüstet ist, muss das Militärpersonal kultiviert sein, und deshalb wird die Intelligenz bevorzugt."
JGT01_tupo:0	"Durchbruch an Schlüsselstellen"
JGT01_tupo_desc:0	"Angreifen, angreifen, angreifen."
JGT01_shandianzhan:0	"Panzerlehr"
JGT01_shandianzhan_desc:0	"Ich habe keine Zeit, Sie gefangen zu nehmen."
JGT01_jidongfangyu:0	"flexible Verteidigung"
JGT01_jidongfangyu_desc:0	"Raum für Zeit"
JGT01_qhz:0	"Grabenkämpfe"
JGT01_qhz_desc:0	"Alles ruhig an der Westfront"
JGT01_youjizhan:0	"Guerillakrieg"
JGT01_youjizhan_desc:0	"Der Feind rückt vor, wir ziehen uns zurück, der Feind ist stationiert, wir stören, der Feind ist müde, wir kämpfen, der Feind zieht sich zurück, wir verfolgen."
JGT01_tianlu:0	"Tian Lu Taktik"
JGT01_tianlu_desc:0	"Tian LuIt genügt dem Gesetz der Tiefe von Himmel und Erde, erschöpft das Geheimnis des Universums, lässt die Geister und Götter weinen, das Personal ist schwer zu verstehen, es gibt keinen Namen dafür, deshalb nennt man es die Tian LuIt Taktik 。"
JGT01_azck:0	"Verdeckte Manipulation"
JGT01_zhianzhan:0	"Kriegsführung nach Recht und Ordnung"
JGT01_zhianzhan_desc:0	"Der Feind ist in der Dunkelheit, ich bin im Licht."
JGT01_shoucuo:0	"Feuerkraft und Manöver"
JGT01_shoucuo_desc:0	"Die grundlegende Methode, den Feind mit Feuerkraft zu bekämpfen und ein ständiges Manöver gegen den Feind aufrechtzuerhalten, gilt für alle Ebenen, von der Feldarmee bis hin zur Gewehrtruppe."
JGT01_tzzm:0	"Der Speer des Gottes"
JGT01_tzzm_desc:0	"Geflügelte Kavallerie, für!!"
JGT01_adidi:0	"Arditti Kommando"
JGT01_adidi_desc:0	"Dolch, Bombe, Herz. Brennen, schwarze Flamme. Hurra! Italien! Es lebe! Savoyen!"
JGT01_tjsqb:0	"Kataphractoi"
JGT01_tjsqb_desc:0	"Sie werden zurück sein wie der Blitz."
JGT01_wljwd:0	"Varangianische Garde"
JGT01_wljwd_desc:0	"Möge dieses Kreuz der Schild und die Waffe des Allerhöchsten sein, George Varangipoulos."
JGT01_hsj:0	"All Blacks"
JGT01_hsj_desc:0	"Fascisti! Ganz Italien - die Zeit für unseren Showdown ist gekommen!"
JGT01_kaqiusha:0	"Orgeln von Stalin"
JGT01_kaqiusha_desc:0	"So wie die Birnenblüten überall blühen, schwimmt die weiche Gaze auf dem Fluss, Katuysha steht am steilen Ufer, ihre Lieder sind wie die Pracht des Frühlings...."
JGT01_mmhld:0	"Marmon-Herrington"
JGT01_mmhld_desc:0	"Marmon-Herrington Panzerwagen Diese gepanzerten Fahrzeuge waren für die SADF vorgesehen und wurden 1940-1941 in großer Zahl zur Unterstützung von Infanterieeinheiten, insbesondere gegen die Italiener in Ostafrika, produziert.。"
JGT01_fzwj:0	"Das Dach von Afrika"
JGT01_fzwj_desc:0	"Das Hochplateau macht zwei Drittel der Fläche unseres Landes aus, und die hochgelegene Lebensumgebung hat unsere Krieger heldenhaft und unnachgiebig gemacht, und alle fremden Eindringlinge werden am Ende besiegt werden!"
JGT01_rszs:0	"Hidalgo"
JGT01_rszs_desc:0	"Die meisten äthiopischen Kavalleristen gehörten dem Stamm der Oromo an, einer der größten nomadischen Gruppen der Gela, die manchmal mit dem äthiopischen Kaiser verbündet waren und manchmal gegen ihn kämpften."
JGT01_laojinweijun:0	"Alte Garde"
JGT01_laojinweijun_desc:0	"Die Veteranengarde, die elitärste Truppe unter Napoleons Kommando, war die kaiserliche Garde, die aus den Eliteveteranen der französischen Armee bestand."
JGT01_weijing:0	"Berserker"
JGT01_weijing_desc:0	"In den weiten Wäldern hier, gekleidet in meine kriegerische Ausrüstung, stürzte ich mich auf meinen Speer, "
JGT01_sansan:0	"Drei-Drittel-System"
JGT01_sansan_desc:0	"Die Taktik des Drei-Drittel-Systems wurde erstmals im Widerstandskrieg gegen die japanische Aggression entwickelt, reifte während des nationalistisch-kommunistischen Bürgerkriegs heran und wurde im Widerstandskrieg gegen die USA und bei der Hilfe für Korea intensiv genutzt. Sie ist eine Art Angriffstaktik für die Infanterie unserer Armee."
tactic_breakthrough_preferred_weight_factor:0	"Wenn für die Wahl der Taktik, Extra-Durchbruchswahrscheinlichkeit"
tactic_guerrilla_tactics_preferred_weight_factor:0	"Wenn für die Wahl der Taktik, Guerilla Guerilla-Taktik Wahrscheinlichkeit"
tactic_blitz_preferred_weight_factor:0	"Wenn für die Wahl der Taktik, Guerilla-Blitz-Wahrscheinlichkeit"
tactic_backhand_blow_preferred_weight_factor:0	"Wenn für die Wahl der Taktik,Guerilla Rückhand_Schlag-Wahrscheinlichkeit"
modifier_tactic_banzai_charge_preferred_weight_factor:0	"Wenn für die Wahl der Taktik,Guerrilla-Taktik Banzai Wahrscheinlichkeit"
tactic_tactical_withdrawal_preferred_weight_factor:0	"Wenn für die Wahl der Taktik,Guerillataktik Rückzugswahrscheinlichkeit"
modifier_tactic_elastic_defense_preferred_weight_factor:0	"Wenn für die Wahl der Taktik, Guerillataktik elastische Wahrscheinlichkeit "
JGT03_hjhkbb:0	"Imperial Airways Hauptquartier"
JGT03_yghjkj:0	"Königliche Luftwaffe"
JGT04_dgkj:0	"Deutsche Luftwaffe"
jgt5_slkj:0	"Sowjetische Luftwaffe "
JGT03_hhwz:0	"Voreingenommenheit gegenüber der Marinefliegerei"
JGT03_hhwz_desc:0	"Flugzeuge sind nur zur Unterstützung der Marine und zur Aufklärung nützlich."
JGT03_lhwz:0	"Bevorzugung der Heeresfliegerei"
JGT03_lhwz_desc:0	"Die Aufgabenbeschreibung ist eigentlich ganz einfach: Bombardieren Sie dort, wo die Generäle es Ihnen befehlen."
JGT03_hjyj:0	"Raketenforschung"
JGT03_hjyj_desc:0	"Diese fortschrittlichen Waffen könnten die Zukunft der Kriegsführung bestimmen...."
JGT03_jxss:0	"Der schreiende Tod"
JGT03_jxss_desc:0	"Hören Sie ruhig zu, wenn die Stimme dieses Jericho ertönt...."
JGT03_btfw:0	"Landesverteidigung"
JGT03_btfw_desc:0	"Abschießen eines ankommenden Feindes"
JGT03_kzys:0	"Lufttransport"
JGT03_kzys_desc:0	"Die Luftwaffe ist in der Lage, eine Luftbrücke zur Versorgung der Truppen zu bauen"
JGT04_lskwhkt:0	"Raskova Airborne"
JGT04_lskwhkt_desc:0	"Der Schrecken der Dunklen Hexe wird für immer über den feindlichen Streitkräften verweilen...für immer..."
JGT03_hjjzj:0	"Marinefliegerei"
JGT03_mklsjd:0	"McClusky Luftlandung"
JGT03_mklsjd_desc:0	"Der tapfere Kommandant McClusky hat uns vielleicht einen unerwarteten Effekt im Krieg beschert....."
JGT03_ljhz:0	"Landbombardierung"
JGT03_ljhz_desc:0	"Mit der Infanterie durch die Linien brechen"
JGT03_zlhzj:0	"Direktprojektor-Programm"
JGT03_zlhzj_desc:0	"Die Hölle winkt den Krauts...."
JGT03_yydl:0	"Eien no zero"
JGT03_yydl_desc:0	"Der Teufel über dem Pazifik"
JGT02_usahj:0	"Das maritime Erbe der Vereinigten Staaten"
JGT02_usahj_desc:0	"Der Vorgänger der United States Navy war die Continental Navy, die während des amerikanischen Revolutionskriegs gegründet wurde."
JGT02_gbrhj:0	"Tradition der Royal Navy"
JGT02_gbrhj_desc:0	"Es dauert nur drei Jahre, ein Schlachtschiff zu bauen, aber dreihundert Jahre, eine Marinetradition zu entwickeln."
JGT02_gerhj:0	"Deutsche Marinetradition"
JGT02_gerhj_desc:0	"Nach der Vereinigung Deutschlands im Jahr 1871 wurde die Macht der Kaiserlichen Marine durch die Entwicklung der Industrie stark gestärkt und sie wurde zeitweise zur zweitstärksten Seestreitkraft der Welt nach der Royal Navy."
JGT02_japhj:0	"Japanische Marine-Tradition"
JGT02_japhj_desc:0	"Seit der Meiji-Restauration hat sich Japan Großbritannien zum Vorbild genommen und mit der ganzen Kraft der Nation eine mächtige Marine aufgebaut. Nach den Erfahrungen des Chinesisch-Japanischen Krieges und des Russisch-Japanischen Krieges ist die japanische Marine die drittgrößte der Welt geworden, nach der britischen und der amerikanischen Marine."
JGT02_itahj:0	"Italienische Marinetradition"
JGT02_itahj_desc:0	"In den 1870er Jahren entwickelte sich der Kapitalismus nach der Einigung Italiens rasant. Um die internationalen Märkte zu plündern und die koloniale Expansion im Ausland voranzutreiben, begann die italienische Regierung, den Bau ihrer Marine zu beschleunigen, was sie zu einer der mächtigsten Seestreitkräfte der Welt in dieser Zeit machte."
JGT02_sulian:0	"Sowjetische Marine"
JGT02_sulian_desc:0	"Die Rote Marine der UdSSR, die Seestreitkräfte der Sowjetunion, bestand aus fünf Teilstreitkräften: U-Boote, Überwasserschiffe, Luftfahrt, Küstenraketenartillerie und Marineinfanterie."
JGT02_shae:0	"Zaristisches Russland Marinetradition"
JGT02_shae_desc:0	"Die zaristische russische Marine war die Marine des zaristischen Russlands von seiner Gründung im Jahr 1696 bis zur Februarrevolution von 1917. Nach der Einnahme der Festungen im Asowschen Meer erkannte die russische Duma die Bedeutung des Aufbaus einer regulären Marine und verabschiedete am 20. Oktober 1696 ein Gesetz über den Aufbau der Marine. Dieser Tag gilt als die Geburtsstunde der kaiserlichen russischen Marine."
JGT02_aosiman:0	"Der Wiederaufbau des osmanischen Marineerbes"
JGT02_aosiman_desc:0	"Zu Beginn des 14. Jahrhunderts begann das Osmanische Reich mit dem Aufbau einer Marine, die in der Aufbauphase vor allem der Verteidigung und dem Schutz der Küste diente; zu Beginn des 16. Jahrhunderts erreichte die Marine des Osmanischen Reiches ihre Blütezeit, und zu Beginn des 17."
JGT02_dongluoma:0	"Wiederbelebung der oströmischen Marinetradition"
JGT02_dongluoma_desc:0	"Bis zum Ende des 8. Jahrhunderts hatte sich die byzantinische Flotte zu einer gut organisierten und gut bewaffneten Streitmacht entwickelt und war die wichtigste Seemacht im Mittelmeer. Sie war der muslimischen Flotte ebenbürtig, aber im 10. Jahrhundert hatten die Byzantiner ihre Vormachtstellung im östlichen Mittelmeer wiedererlangt."
JGT02_daqing:0	"Das Vermächtnis der Beiyang Marine"
JGT02_daqinga_desc:0	"Am 17. Dezember 1888 wurde die Beiyang-Marinedivision auf der Insel Liugong in Weihaiwei, Provinz Shandong, formell gegründet. Die Qing-Regierung stellte jährlich 4 Millionen Tael Silber für den Bau der Marine zur Verfügung. Die Stärke der Flotte war einst die erste in Asien und die neunte in der Welt."
JGT02_aoxiong:0	"Österreichisch-ungarisches Marineerbe"
JGT02_aoxiong_desc:0	"Die österreichisch-ungarische Marine existierte von 1867-1918 und war die Seemacht der österreichisch-ungarischen Monarchie. Die offizielle deutsche Bezeichnung war kaiserliche und königliche Kriegsmarine, abgekürzt k.u.k. Kriegsmarine."
JGT02_helan:0	"Tradition der Königlich Niederländischen Marine"
JGT02_helan_desc:0	"Die moderne niederländische Marine geht auf den 8. Januar 1488 zurück, als sie durch das vom Heiligen Römischen Kaiser Maximilian I. erlassene „Statut der Meere“ gegründet wurde. Später war sie während des Achtzigjährigen Krieges unter den Habsburgern unabhängig von den habsburgischen Niederlanden."
JGT02_weijing:0	"Langschiff"
JGT02_weijing_desc:0	"Die Wikinger segelten über die Meere, um Angst zu verbreiten und Länder zu erobern. Sie überquerten die Ozeane und begaben sich auf eine Reise ins Unbekannte, wo nur die Starken siegen würden. Mit Mut und Entschlossenheit können wir unsere Flotte wieder aufbauen und die Meere erneut beherrschen."
JGT02_wudijiandui:0	"Wiederbelebung der spanischen Armada"

JGT02_lsqh:0	"Stiller Jäger"
JGT02_lsqh_desc:0	"Bleiben Sie ruhig. Alle Schiffe halten sich bereit..."
JGT02_hql:0	"Theorie der Seemacht"
JGT02_hql_desc:0	"Die Kontinente auf der Erdoberfläche sind von Ozeanen und Meeren umgeben, die einen Transportvorteil gegenüber dem Land haben. Wer die Ozeane kontrolliert, kann die Kontinente kontrollieren, und der Schlüssel zur Seemacht ist eine Seestreitmacht, die zu Blockaden und Entscheidungsschlachten auf See fähig ist."
JGT02_jjzcjh:0	"Notprogramm für den Schiffbau"
JGT02_jjzcjh_desc:0	"Ich bitte den Kongress zu erklären, dass zwischen den Vereinigten Staaten und dem Kaiserreich Japan seit Sonntag, dem 7. Dezember 1941, als Japan seinen unprovozierten und verabscheuungswürdigen Angriff startete, der Kriegszustand herrscht."
JGT02_rbl:0	"Die Sonne wird niemals untergehen"
JGT02_rbl_desc:0	"Die Sonne geht auf unserem Territorium nie unter."
JGT02_dapj:0	"Beschuss von der anderen Seite der Straße"
JGT02_dapj_desc:0	"Die maritime Artillerieunterstützung ist ein zuverlässiger Schutz für die Krieger des Marine Corps"
JGT02_hhjd:0	"Konvoiflotte"
JGT02_hhjd_desc:0	"Die maritimen Transportwege sind das Lebenselixier des Seeverkehrs in den Anrainerstaaten"
JGT02_hmzz:0	"Trägergestützte Operationen"
JGT02_hmzz_desc:0	"Das Zeitalter der großen Schiffe und der großen Kanonen ging zu Ende, und die Zeit der Marinefliegerei ging zu Ende."
JGT02_lhjd:0	"Kombinierte Flotte"
JGT02_lhjd_desc:0	"Der Vorgänger der Kombinierten Flotte war die Ständige Flotte, die am 29. Juli 1889 gegründet wurde. Die japanische Kombinierte Flotte wurde am 28. Dezember 1903 gegründet und am 1. Mai 1945 aufgelöst."
expandable_soldier_doctrine_spirit:0	"Doktrin des ausbaufähigen Soldaten"
JGT01_zzwy:0	"Politischer Kommissar"
JGT01_zzwy_desc:0	"Die vollständige Bezeichnung lautet Politischer Kommissar. Es handelt sich um den führenden Kader, der für die parteipolitische Arbeit in den Kampfeinheiten der Armeen der UdSSR und der sozialistischen Länder nach dem Vorbild der Sowjetunion auf Regimentsebene und darüber verantwortlich ist, wobei die militärischen Befehlshaber auf derselben Ebene zusammenfassend als Leiter der Einheit bezeichnet werden."
airborne_vanguard_spirit:0	"Luftlande-Vorhut"
JGT01_smzypd:0	"Granaten über Leichen"
JGT01_smzypd_desc:0	"Die Armeedoktrin, sich durch den richtigen Einsatz von Feuerkraft einen Vorteil gegenüber dem Feind zu verschaffen und dann die Feuerkraft des Feindes zu unterdrücken."
JGT01_zyqbj:0	"CIA"
JGT01_zyqbj_desc:0	"Eine Organisation, die geheime Detektivarbeit betreibt, um vertrauliche Informationen von einem Gegner oder Konkurrenten zu erhalten oder Sabotageaktivitäten zum Vorteil der Partei durchzuführen, für die sie arbeitet."
JGT01_yggs:0	"Festung"
JGT01_yggs_desc:0	"Auf eine starke Festung ist immer Verlass"
JGT01_sdz:0	"Blitzkrieg"
JGT01_sdz_desc:0	"Panzer-Vorwärts!"
JGT01_tzzz:0	"Spezialtruppen"
JGT01_tzzz_desc:0	"Wer wagt, gewinnt"
JGT01_zzcc:0	"Unser Wille vereint sich wie eine Festung"
JGT01_zzcc_desc:0	"Wir werden unser Fleisch und Blut einsetzen, um eine weitere Große Mauer zu errichten."
JGT01_gxzy:0	"Herausragende Verdienste"
JGT01_zzj:0	"das Politische Büro"
JGT01_zzj_desc:0	"Männer, Waffen und militärische Ideologie, die drei Grundelemente einer Armee."
JGT01_xdjx:0	"West Point"
JGT01_xdjx_desc:0	"Richtige Strategie und Taktik sind wichtiger als überlegene Kraft."
JGT01_wushidao:0	"bushido"
JGT01_wushidao_desc:0	"Stirb ohne zu denken, stirb ohne Angst, stirb ohne zu zögern."
JGT01_scmz:0	"Die Mandschurei zuerst"
JGT01_scmz_desc:0	"Die Mandschus sind für die Acht Banner zuständig."
JGT01_wzgh:0	"Gleichheit der fünf Völker"
JGT01_wzgh_desc:0	"Die Völker Chinas und der Mandschurei sind gleichberechtigt, und zusammen mit den Chinesen, Mandschus, Mongolen, Muslimen und Tibetern bilden sie das Volk einer großen Nation."
JGT01_hfjx:0	"Militärakademie der Republik China"
JGT01_hfjx_desc:0	"Der Weg ist nicht weit, lassen Sie sich nicht beunruhigen. Wir werden weiterhin treu und aufrichtig sein. Führen Sie den Geist unserer Schule weiter. Führen Sie den Geist unserer Schule weiter!"
JGT01_ncsb:0	"OB"
JGT01_ncsb_desc:0	"Die faschistische paramilitärische Organisation Ossewa brandwag wird die Führung unserer Streitkräfte übernehmen. Um die Interessen der weißen Südafrikaner weiter zu sichern, müssen wir den Anteil der Farbigen in Südafrika begrenzen, indem wir sie aus den Streitkräften entfernen und auf das Land zurücktreiben"
JGT01_nslmdry:0	"Salomos Nachfolger"
JGT01_nslmdry_desc:0	"Das Äthiopische Reich war in geistiger Hinsicht der Nachfolger des Reiches von Axum, das von den Nachkommen des legendären Königs Salomon und der Königin von Saba, den Verteidigern des koptisch-orthodoxen Glaubens, regiert wurde. Ihr Untergang war eine Tragödie für die äthiopische koptische Orthodoxie, aber der äthiopische Geist lebt weiter - und es liegt an denen wie uns, die nach ihnen kommen, ihn wiederzubeleben!"
JGT01_zyxz:0	"Die Verfassung der Freiheit"
JGT01_zyxz_desc:0	"Befreien wir uns von der Angst, befreien wir uns von der gegenseitigen Unterdrückung, befreien wir uns von unserer eigenen Unterdrückung, und schaffen wir gemeinsam eine Gesellschaft der Liebe und des Friedens."
JGT01_napolun:0	"Militärakademie Saint-Cyr"
JGT01_napolun_desc:0	"Ils s'instruisent pour vaincre."
JGT01_fulongzhi:0	"Militärakademie Frunze"
JGT01_fulongzhi_desc:0	"Im April 1924 wurde Wolodymyr in seiner Eigenschaft als stellvertretender Vorsitzender des Revolutionären Militärkomitees der UdSSR und Stabschef der Roten Armee der Arbeiter und Bauern zum Direktor der Militärakademie ernannt."
JGT01_sanghesite:0	"Königliche Militärakademie Sandhurst"
JGT01_sanghesite_desc:0	"Die Königliche Militärakademie Sandhurst ist eine der wichtigsten Einrichtungen für die Ausbildung von Nachwuchsoffizieren in Großbritannien und eine der ältesten und renommiertesten Institutionen der Welt für die Ausbildung von Armeeoffizieren."
JGT01_xsjjs:0	"Der Geist der neuen Vierten Armee"
JGT01_xsjjs_desc:0	"Auf den Befehl der Partei hören, fester Glaube; Ausdauer, Tapferkeit und Mut; die gesamte Situation berücksichtigen, für das Land tolerieren; innere und äußere Einheit, Einigkeit im Ziel; Einigkeit im Ziel, strenge Disziplin."
JGT01_wdwgzz:0	"Der Große Vaterländische Krieg"
JGT01_wdwgzz_desc:0	"Die Rote Armee, die Rote Marine und alle Bürger der UdSSR sollten jeden Zentimeter des sowjetischen Territoriums verteidigen, sollten bis zum letzten Blutstropfen für die Verteidigung unserer Städte und Dörfer kämpfen und den Mut, die Initiative und den Einfallsreichtum zeigen, der unserem Volk innewohnt."
JGT01_tszddf:0	"Die Klinge des Eisernen Kreuzes"
JGT01_tszddf_desc:0	"Die germanischen Völker stehen über allen anderen Völkern."
JGT01_xsdfn:0	"Frauen im neuen Zeitalter"
JGT01_xsdfn_desc:0	"Emanzipation der Frauen und Entwicklung der Arbeitskraft"
JGT01_lql:0	"Die Heartland-Theorie"
JGT01_lql_desc:0	"Wer das Kernland kontrolliert, kontrolliert die Weltinsel, und wer die Weltinsel kontrolliert, kontrolliert die Welt."
JGT01_ycshycx:0	"Kämpfen bis zum bitteren Ende"
JGT01_ycshycx_desc:0	"einhunderttausend junge Männer einhunderttausend Soldaten; Der Kommandeur im Untergrund"
JGT01_jbtx:0	"Niemals kapitulieren"
JGT01_jbtx_desc:0	"Wir werden an den Stränden kämpfen, wir werden an den feindlichen Landungsstellen kämpfen, wir werden auf den Feldern und Straßen kämpfen, wir werden in den Bergen kämpfen. Wir werden niemals kapitulieren."
JGT01_yizhigaoang:0	"Operative Theorie der großen Tiefe"
JGT01_yizhigaoang_desc:0	"Um einen umfassenden Sieg über den Feind zu erringen, ist es notwendig, eine Reihe von aufeinanderfolgenden Angriffen durchzuführen, um alle feindlichen Kräfte zu treffen und den Feind zu desorganisieren, damit er seinen hartnäckigen Widerstand nicht fortsetzen kann."
JGT01_tzdg:0	"KÖNIGREICH GOTTES"
JGT01_tzdg_desc:0	"Das Reich Gottes ist auf die Erde gekommen."
JGT01_dlzz:0	"Amphibischer Angriff"
JGT01_dlzz_desc:0	"Wir haben einen langen und schwierigen Weg vor uns, und wir stehen einem mächtigen Feind gegenüber, der uns leicht besiegen könnte. Wir werden vielleicht nicht sofort gewinnen können, aber wir werden kämpfen und kämpfen und kämpfen und kämpfen."
JGT01_qhhq:0	"Verbesserte Logistik"
JGT01_meiguolj:0	"Begrenzte Überwachen"
JGT01_meiguolj_desc:0	"Segmentierte Starts und Landungen, Punkt-für-Punkt-Angriffe"
JGT01_jzjh:0	"Amerikanische Yakuza"
JGT01_jzjh_desc:0	"Bewältigung der gesamten Aufgabe auf einen Schlag"
JGT01_bwbl:0	"Verteidigung von Berlin"
JGT01_bwbl_desc:0	"Der Untergang"
JGT01_zphm:0	"Wert Eisenbahngeschütz"
JGT01_zphm_desc:0	"Während des Ersten und des Zweiten Weltkriegs begann Deutschland, Eisenbahngeschütze als Waffe zur Bombardierung von Festungen und Schützengräben einzusetzen, wodurch der Einsatz von Eisenbahngeschützen einen neuen Höhepunkt erreichte."
JGT01_beijinlun:0	"Streik im Norden"
JGT01_beijinlun_desc:0	"Die Anwendung von Gewalt zur Lösung der Nordfrage, um die Stabilität des Nordens zu gewährleisten, als die Entwicklung des deutsch-sowjetischen Krieges die günstigste Entwicklung für das Reich war."
JGT01_nanjinlun:0	"Den Süden angreifen"
JGT01_nanjinlun_desc:0	"Die Südsee, es ist eine bewegte Zeit...."
JGT01_jfwyh:0	"Befreiungskomitee"
JGT01_jfwyh_desc:0	"Frankreich hat eine Schlacht verloren, aber nicht den Krieg."
JGT01_sibada:0	"Der Geist von Sparta"
JGT01_sibada_desc:0	"Heute Abend speisen wir in der HÖLLE!"
JGT01_dlmyc:0	"Oströmisches Erbe"
JGT01_dlmyc_desc:0	"Konstantin, Dragases, Valerio, Kaiser der Römer von Gottes Gnaden."
JGT01_dbssj:0	"thebanische heilige armee"
JGT01_dbssj_desc:0	"Eine Legion sollte aus Kriegern bestehen, die sich gegenseitig lieben, damit sie eine unzerbrechliche und uneinnehmbare Macht bilden können."
JGT01_baqi:0	"Acht Banner"
JGT01_baqi_desc:0	"Die acht Banner sind das Fundament unseres Landes, das Land hat das nicht nötig. Die acht Banner der Mandschurei sind das Fundament unserer Dynastie, das Fundament darf nicht fixiert werden. Die acht Banner sind das Fundament des Landes."
JGT01_guandongjun:0	"Kwantung-Armee"
JGT01_guandongjun_desc:0	"Bei Sonnenuntergang können wir die Berge und Flüsse sehen, unsere Elite-Armee ist stark, und die Menschen der verbündeten Länder werden für immer glücklich sein, voller Ruhm! Die Kwantung-Armee."
JGT01_ynql:0	"Janisary"
JGT01_ynql_desc:0	"Morgen sollen sie unsere Stärke sehen, sollen sie in ihrer Verzweiflung aufschreien! Ihr hartnäckiger Widerstand ist keine Schande, er ist mutig, aber töricht!"
JGT01_qhq:0	"Erweitertes Logistikteam"
JGT01_qhq_desc:0	"Integration arbeitsloser Jugendlicher in das Q-Logistikteam, das für die Verstärkung der Logistik und Versorgung der Stehenden Armee zuständig ist"
JGT01_adwdry:0	"Der Ruhm von Adua"
JGT01_adwdry_desc:0	"Der große Kaiser von Äthiopien, Menelik II, hat uns zum Sieg von Adua geführt, der Welt gezeigt, wozu unsere Armee fähig ist und die Kolonialisten zum Rückzug ihrer Truppen gezwungen. Wir haben es beim letzten Mal geschafft und wir werden es auch dieses Mal schaffen."
JGT01_abet:0	"Embilta"
JGT01_abet_desc:0	"Die riesige äthiopische Armee basierte auf jahrhundertealten Traditionen und umfasste Truppen aus den feudalen Domänen, die zusammengezogen und einberufen worden waren. Die traditionellen Ambirta-Hörner und -Trommeln werden während der Schlachten ununterbrochen gespielt, auch wenn die Armee auf dem Marsch ist."
JGT01_kaluosi:0	"Der Geist des pfeifenden Soldaten"
JGT01_kaluosi_desc:0	"Die Hingabe der Wuthering Soldiers an Gott und die Loyalität zu ihrem König ist überragend. Sie werden auf dem Schlachtfeld sogar von Priestern begleitet, die inmitten der Kämpfe Gebete am Sterbebett sprechen. Bei der Verteidigung der ewigen Gott-Mutterland-Macht werden die Ideale von Carlos niemals in Frage gestellt!"
JGT01_dalufengsuo:0	"Fortführung des Kontinentalsystems"
JGT01_dalufengsuo_desc:0	"Alle Schiffe neutraler Staaten, die in Großbritannien angelegt haben, werden zusammen mit ihren Frachtschiffen beschlagnahmt; und Schiffe neutraler Staaten, die sich Großbritannien unterworfen haben, gelten als ihrer Nationalität beraubt und können gekapert werden."
JGT01_sdjlbxzy:0	"Drei Regeln der Disziplin und acht zu beachtende Punkte"
JGT01_sdjlbxzy_desc:0	"Erstens, alle Handlungen folgen dem Befehl; zweitens, nehmen Sie der Masse keine Nadel und keinen Faden weg; drittens, alle Beschlagnahmungen sollten der Allgemeinheit zurückgegeben werden. Die acht Punkte der Aufmerksamkeit sind: Erstens, sprechen Sie freundlich; zweitens, kaufen und verkaufen Sie fair; drittens, geben Sie zurück, was Sie geliehen haben; viertens, bezahlen Sie, was Sie beschädigt haben; fünftens, schlagen oder fluchen Sie nicht; sechstens, beschädigen Sie keine Ernte; siebtens, belästigen Sie keine Frauen; und achttens, misshandeln Sie keine Gefangenen."
JGT01_wczmlhql:0	"Proletarier vereinigt euch!"
JGT01_wczmlhql_desc:0	"Der Tod gehört nicht zur Arbeiterklasse!"
JGT01_gthl:0	"Flut aus Eisen"
JGT01_gthl_desc:0	"Die großen Operationen der Mechanisierten Korps der Sowjetunion am Ende des Krieges"
JGT01_sljzyq:0	"Der Sieg ist zum Greifen nah"
JGT01_sljzyq_desc:0	"Unterstützen Sie unsere tapfere Rote Armee und unsere glorreiche Rote Marine mit all unserer Kraft! Nutzen Sie die ganze Kraft des Volkes, um den Feind zu vernichten! Marschiert für unseren Sieg!"
JGT01_bahongyiyu:0	"hakkō ichiu"
JGT01_bahongyiyu_desc:0	"Öffnen Sie die Wellen und verkünden Sie das Prestige des Landes in alle Richtungen."
JGT01_wscf:0	"Banzai-Angriff"
JGT01_wscf_desc:0	"てんのうへいか,ばんざい！"
JGT01_kjls:0	"Fallschirmjäger"
JGT01_kjls_desc:0	"Hitlers grüner Teufel"
JGT01_tbkqt:0	"SAS"
JGT01_tbkqt_desc:0	"Obwohl wir die Schlacht an der Front verloren haben, reichten die Elitespezialeinheiten des britischen Empire aus, um Hitler nachts wach zu halten."
JGT01_hqbj:0	"Logistischer Nachschub"
JGT01_hqbj_desc:0	"Eine gute Logistik entscheidet über den Sieg im Krieg."
JGT01_gmqs:0	"Bogenschießen"
JGT01_gmqs_desc:0	"Wo die Gemeinde, wird testen, müssen zunächst den Bogen und Pferd qualifiziert, und dann erlaubt, das Haus zu betreten, so eine Zeit, wenn der alte Sohn des Herrn sind nicht vertraut mit dem Bogen und Pferd."
JGT01_xinjun:0	"Neue Armee"
JGT01_xinjun_desc:0	"Da das Militär ganz im westlichen Stil organisiert und ausgerüstet ist, muss das Militärpersonal kultiviert sein, und deshalb wird die Intelligenz bevorzugt."
JGT01_tupo:0	"Durchbruch an Schlüsselstellen"
JGT01_tupo_desc:0	"Angreifen, angreifen, angreifen."
JGT01_shandianzhan:0	"Panzerlehr"
JGT01_shandianzhan_desc:0	"Ich habe keine Zeit, Sie gefangen zu nehmen."
JGT01_jidongfangyu:0	"flexible Verteidigung"
JGT01_jidongfangyu_desc:0	"Raum für Zeit"
JGT01_qhz:0	"Grabenkämpfe"
JGT01_qhz_desc:0	"Alles ruhig an der Westfront"
JGT01_youjizhan:0	"Guerillakrieg"
JGT01_youjizhan_desc:0	"Der Feind rückt vor, wir ziehen uns zurück, der Feind ist stationiert, wir stören, der Feind ist müde, wir kämpfen, der Feind zieht sich zurück, wir verfolgen."
JGT01_tianlu:0	"Tian Lu Taktik"
JGT01_tianlu_desc:0	"Tian LuIt genügt dem Gesetz der Tiefe von Himmel und Erde, erschöpft das Geheimnis des Universums, lässt die Geister und Götter weinen, das Personal ist schwer zu verstehen, es gibt keinen Namen dafür, deshalb nennt man es die Tian LuIt Taktik 。"
JGT01_azck:0	"Verdeckte Manipulation"
JGT01_zhianzhan:0	"Kriegsführung nach Recht und Ordnung"
JGT01_zhianzhan_desc:0	"Der Feind ist in der Dunkelheit, ich bin im Licht."
JGT01_shoucuo:0	"Feuerkraft und Manöver"
JGT01_shoucuo_desc:0	"Die grundlegende Methode, den Feind mit Feuerkraft zu bekämpfen und ein ständiges Manöver gegen den Feind aufrechtzuerhalten, gilt für alle Ebenen, von der Feldarmee bis hin zur Gewehrtruppe."
JGT01_tzzm:0	"Der Speer des Gottes"
JGT01_tzzm_desc:0	"Geflügelte Kavallerie, für!!"
JGT01_adidi:0	"Arditti Kommando"
JGT01_adidi_desc:0	"Dolch, Bombe, Herz. Brennen, schwarze Flamme. Hurra! Italien! Es lebe! Savoyen!"
JGT01_tjsqb:0	"Kataphractoi"
JGT01_tjsqb_desc:0	"Sie werden zurück sein wie der Blitz."
JGT01_wljwd:0	"Varangianische Garde"
JGT01_wljwd_desc:0	"Möge dieses Kreuz der Schild und die Waffe des Allerhöchsten sein, George Varangipoulos."
JGT01_hsj:0	"All Blacks"
JGT01_hsj_desc:0	"Fascisti! Ganz Italien - die Zeit für unseren Showdown ist gekommen!"
JGT01_kaqiusha:0	"Orgeln von Stalin"
JGT01_kaqiusha_desc:0	"So wie die Birnenblüten überall blühen, schwimmt die weiche Gaze auf dem Fluss, Katuysha steht am steilen Ufer, ihre Lieder sind wie die Pracht des Frühlings...."
JGT01_mmhld:0	"Marmon-Herrington"
JGT01_mmhld_desc:0	"Marmon-Herrington Panzerwagen Diese gepanzerten Fahrzeuge waren für die SADF vorgesehen und wurden 1940-1941 in großer Zahl zur Unterstützung von Infanterieeinheiten, insbesondere gegen die Italiener in Ostafrika, produziert.。"
JGT01_fzwj:0	"Das Dach von Afrika"
JGT01_fzwj_desc:0	"Das Hochplateau macht zwei Drittel der Fläche unseres Landes aus, und die hochgelegene Lebensumgebung hat unsere Krieger heldenhaft und unnachgiebig gemacht, und alle fremden Eindringlinge werden am Ende besiegt werden!"
JGT01_rszs:0	"Hidalgo"
JGT01_rszs_desc:0	"Die meisten äthiopischen Kavalleristen gehörten dem Stamm der Oromo an, einer der größten nomadischen Gruppen der Gela, die manchmal mit dem äthiopischen Kaiser verbündet waren und manchmal gegen ihn kämpften."
JGT01_laojinweijun:0	"Alte Garde"
JGT01_laojinweijun_desc:0	"Die Veteranengarde, die elitärste Truppe unter Napoleons Kommando, war die kaiserliche Garde, die aus den Eliteveteranen der französischen Armee bestand."
JGT01_weijing:0	"Berserker"
JGT01_weijing_desc:0	"In den weiten Wäldern hier, gekleidet in meine kriegerische Ausrüstung, stürzte ich mich auf meinen Speer, "
JGT01_sansan:0	"Drei-Drittel-System"
JGT01_sansan_desc:0	"Die Taktik des Drei-Drittel-Systems wurde erstmals im Widerstandskrieg gegen die japanische Aggression entwickelt, reifte während des nationalistisch-kommunistischen Bürgerkriegs heran und wurde im Widerstandskrieg gegen die USA und bei der Hilfe für Korea intensiv genutzt. Sie ist eine Art Angriffstaktik für die Infanterie unserer Armee."
