l_german:
expandable_soldier_doctrine_spirit:0	"Doktrin des entbehrlichen Soldaten"
#####    
JGT01_zzwy:0	"Politischer Kommissar"
JGT01_zzwy_desc:0	"Der vollständige Name lautet politischer Kommissar, und es handelt sich um den führenden Kader, der für die Partei- und politische Arbeit in den Kampfeinheiten der Armeen der UdSSR und der sozialistischen Länder nach sowjetischem Vorbild auf Regimentsniveau und darüber verantwortlich ist, wobei die Militärkommandanten auf derselben Ebene gemeinsam als Leiter der Einheit bezeichnet werden."
airborne_vanguard_spirit:0	"Luftlandevorhut"
JGT01_smzypd:0	"Granaten über Leichen"
JGT01_smzypd_desc:0	"Die Doktrin der Armee, sich durch die richtige Verteilung der Feuerkraft einen Vorteil gegenüber dem Feind zu verschaffen und dann die Feuerkraft des Feindes zu unterdrücken."
JGT01_zyqbj:0	"CIA"
JGT01_zyqbj_desc:0	"Eine Organisation, die verdeckte Ermittlungen durchführt, um vertrauliche Informationen von einem Gegner oder Konkurrenten zu erhalten oder Sabotageaktivitäten zum Vorteil der Partei durchzuführen, für die sie arbeitet."
JGT01_yggs:0	"Befestigung"
JGT01_yggs_desc:0	"Auf eine starke Festung ist immer Verlass."
JGT01_sdz:0	"Blitzkrieg"
JGT01_sdz_desc:0	"Panzer vor!"
JGT01_tzzz:0	"Spezialeinheiten"
JGT01_tzzz_desc:0	"Wer wagt, gewinnt"
JGT01_zzcc:0	"Unser Wille vereint uns wie eine Festung"
JGT01_zzcc_desc:0	"Wir werden mit unserem Fleisch und Blut eine weitere Große Mauer errichten."
JGT01_gxzy:0	"Herausragende Verdienste"
JGT01_zzj:0	"Das Politbüro"
JGT01_zzj_desc:0	"Männer, Waffen und militärische Ideologie, die drei Grundelemente einer Armee."
JGT01_xdjx:0	"West Point"
JGT01_xdjx_desc:0	"Die richtige Strategie und Taktik sind wichtiger als überlegene Streitkräfte."
JGT01_wushidao:0	"Bushido"
JGT01_wushidao_desc:0	"Sterben Sie ohne zu zögern, sterben Sie ohne Angst, sterben Sie ohne zu zögern."
JGT01_scmz:0	"Mandschurei zuerst"
JGT01_scmz_desc:0	"Die Mandschu sind für die Acht Banner verantwortlich."
JGT01_wzgh:0	"Gleichheit der fünf Völker"
JGT01_wzgh_desc:0	"Die Menschen in China und der Mandschurei sind gleichberechtigt und bilden zusammen mit den Chinesen, Mandschuren, Mongolen, Muslimen und Tibetern das Volk einer großen Nation."
JGT01_hfjx:0	"Militärakademie der Republik China"
JGT01_hfjx_desc:0	"Der Weg ist nicht weit, seien Sie nicht beunruhigt. Wir werden weiterhin treu und aufrichtig sein. Führen Sie den Geist unserer Schule fort. Führen Sie den Geist unserer Schule fort!"
JGT01_ncsb:0	"OB"
JGT01_ncsb_desc:0	"Die faschistische paramilitärische Organisation Ossewa Brandwag wird unsere Streitkräfte anführen, und um die Interessen der weißen Südafrikaner weiter zu sichern, müssen wir den Anteil der Farbigen in Südafrika begrenzen, indem wir sie aus den Streitkräften entfernen und sie zurück aufs Land und in die ländlichen Gebiete treiben."
JGT01_nslmdry:0	"Salomos Nachfolger"
JGT01_nslmdry_desc:0	"Das äthiopische Reich war der geistige Nachfolger des Reiches von Axum, das von den Nachkommen des legendären Königs Salomon und der Königin von Saba, den Verteidigern des koptisch-orthodoxen Glaubens, regiert wurde. Ihr Untergang war eine Tragödie für die äthiopisch-koptische Orthodoxie, aber der äthiopische Geist lebt weiter – und es liegt an denen wie uns, die nach ihnen kommen, ihn wiederzubeleben!"
JGT01_zyxz:0	"Die Verfassung der Freiheit"
JGT01_zyxz_desc:0	"Befreien wir uns von der Angst, befreien wir uns von der Unterdrückung durch andere, befreien wir uns von unserer eigenen Unterdrückung und schaffen wir gemeinsam eine Gesellschaft der Liebe und des Friedens."
JGT01_napolun:0	"Militärakademie Saint-Cyr"
JGT01_napolun_desc:0	"Ils s'instruisent pour vaincre."
JGT01_fulongzhi:0	"Militärakademie Frunze"
JGT01_fulongzhi_desc:0	"Im April 1924 wurde Wolodymyr in seiner Eigenschaft als stellvertretender Vorsitzender des Revolutionären Militärkomitees der UdSSR und Stabschef der Roten Armee der Arbeiter und Bauern zum Direktor der Militärakademie ernannt."
JGT01_sanghesite:0	"Königliche Militärakademie Sandhurst"
JGT01_sanghesite_desc:0	"Die Königliche Militärakademie Sandhurst ist eine wichtige Einrichtung für die Ausbildung von Offizieren im Vereinigten Königreich und eine der ältesten und renommiertesten Einrichtungen für die Ausbildung von Offizieren weltweit."
JGT01_xsjjs:0	"Der Geist der neuen vierten Armee"
JGT01_xsjjs_desc:0	"Auf die Befehle der Partei hören, feste Überzeugungen; Ausdauer, Tapferkeit und Mut; die gesamte Situation berücksichtigen, für das Land tolerieren; interne und externe Einheit, Einheit der Ziele; Einheit der Ziele, strenge Disziplin."
JGT01_wdwgzz:0	"Der Große Vaterländische Krieg"
JGT01_wdwgzz_desc:0	"Die Rote Armee, die Rote Marine und alle Bürger der UdSSR sollten jeden Zentimeter des sowjetischen Territoriums verteidigen, bis zum letzten Tropfen Blut für die Verteidigung unserer Städte und Dörfer kämpfen und die Tapferkeit, Initiative und Findigkeit zeigen, die unserem Volk eigen sind."
JGT01_tszddf:0	"Die Klinge des Eisernen Kreuzes"
JGT01_tszddf_desc:0	"Die germanischen Völker stehen über allen anderen Völkern."
JGT01_xsdfn:0	"Frauen im neuen Zeitalter"
JGT01_xsdfn_desc:0	"Emanzipation der Frauen und Entwicklung der Arbeitskräfte"
JGT01_lql:0	"Die Heartland-Theorie"
JGT01_lql_desc:0	"Wer das Kernland beherrscht, beherrscht die Weltinsel, und wer die Weltinsel beherrscht, beherrscht die Welt."
JGT01_ycshycx:0	"Kampf bis zum bitteren Ende"
JGT01_ycshycx_desc:0	"Hunderttausend junge Männer, hunderttausend Soldaten; Der Kommandant im Untergrund"
JGT01_jbtx:0	"Niemals kapitulieren"
JGT01_jbtx_desc:0	"Wir werden an den Stränden kämpfen, wir werden an den Landungsstellen des Feindes kämpfen, wir werden auf den Feldern und Straßen kämpfen, wir werden in den Bergen kämpfen. Wir werden niemals kapitulieren."
JGT01_yizhigaoang:0	"Theorie der großräumigen Operationen"
JGT01_yizhigaoang_desc:0	"Um einen umfassenden Sieg über den Feind zu erringen, ist es notwendig, eine Reihe aufeinanderfolgender Angriffe durchzuführen, um alle feindlichen Streitkräfte zu treffen und den Feind zu desorganisieren, damit er seinen hartnäckigen Widerstand nicht fortsetzen kann."
JGT01_tzdg:0	"KÖNIGREICH GOTTES"
JGT01_tzdg_desc:0	"Das Reich Gottes ist auf die Erde gekommen."
JGT01_dlzz:0	"Amphibischer Angriff"
JGT01_dlzz_desc:0	"Wir haben einen langen und schwierigen Weg vor uns und stehen einem mächtigen Feind gegenüber, der uns leicht besiegen könnte. Wir werden möglicherweise nicht sofort gewinnen können, aber wir werden kämpfen und kämpfen und kämpfen und kämpfen."
JGT01_qhhq:0	"Verbesserte Logistik"
JGT01_meiguolj:0	"Bounding Overwatch"
JGT01_meiguolj_desc:0	"Segmentierte Starts und Landungen, Punkt-für-Punkt-Angriffe"
JGT01_jzjh:0	"Amerikanische Yakuza"
JGT01_jzjh_desc:0	"Die gesamte Aufgabe auf einen Schlag erledigen"
JGT01_bwbl:0	"Verteidigung Berlins"
JGT01_bwbl_desc:0	"Der Untergang"
JGT01_zphm:0	"Bedeutung der Eisenbahnkanone"
JGT01_zphm_desc:0	"Während des Ersten und Zweiten Weltkriegs begann Deutschland, Eisenbahnkanonen als Waffe zum Beschuss von Festungen und Schützengräben einzusetzen, wodurch der Einsatz von Eisenbahnkanonen einen neuen Höhepunkt erreichte."
JGT01_beijinlun:0	"Schlag nach Norden"
JGT01_beijinlun_desc:0	"Die Nordfrage mit Gewalt lösen, um die Stabilität des Nordens zu gewährleisten, als die Entwicklung des deutsch-sowjetischen Krieges für das Reich am günstigsten verlief."
JGT01_nanjinlun:0	"Angriff auf den Süden"
JGT01_nanjinlun_desc:0	"Die Südsee, es ist eine ereignisreiche Zeit ..."
JGT01_jfwyh:0	"Befreiungskomitee"
JGT01_jfwyh_desc:0	"Frankreich hat eine Schlacht verloren, aber Frankreich hat den Krieg nicht verloren."
JGT01_sibada:0	"Der Geist Spartas"
JGT01_sibada_desc:0	"Heute Abend speisen wir in der Hölle!"
JGT01_dlmyc:0	"Das östliche römische Erbe"
JGT01_dlmyc_desc:0	"Konstantin, Dragases, Valerio, Kaiser der Römer durch die Gnade Gottes."
JGT01_dbssj:0	"Heilige Armee von Theben"
JGT01_dbssj_desc:0	"Eine Legion sollte aus Kriegern bestehen, die sich gegenseitig schätzen, damit sie eine unzerstörbare und uneinnehmbare Streitmacht bilden können." "
JGT01_baqi:0	"Acht Banner"
JGT01_baqi_desc:0	"Die acht Banner sind das Fundament unseres Landes, das Land hat keinen Bedarf daran. Die acht Banner der Mandschurei sind das Fundament unserer Dynastie, das Fundament darf nicht verändert werden. Die acht Banner sind das Fundament des Landes."
JGT01_guandongjun:0	"Kwantung-Armee"
JGT01_guandongjun_desc:0	"Im Sonnenuntergang können wir die Berge und Flüsse sehen, unsere Elitetruppe ist stark, und die Menschen der verbündeten Länder werden für immer glücklich sein, voller Ruhm! Die Kwantung-Armee."
JGT01_ynql:0	"Janitscharen"
JGT01_ynql_desc:0	"Morgen werden wir ihnen unsere Stärke zeigen, sie werden in ihrer Verzweiflung aufschreien! Ihr hartnäckiger Widerstand ist zwar tapfer, aber töricht und keine Schande!"
JGT01_qhq:0	"Erweitertes Logistikteam"
JGT01_qhq_desc:0	"Integration arbeitsloser Jugendlicher in das Q-Logistikteam, das für die Verstärkung der Logistik und Versorgung der stehenden Armee zuständig ist"
JGT01_adwdry:0	"Der Ruhm von Adua"
JGT01_adwdry_desc:0	"Der große Kaiser von Äthiopien, Menelik II., führte uns zum Sieg von Adua, zeigte der Welt, wozu unsere Armee fähig ist, und zwang die Kolonialisten erfolgreich zum Rückzug ihrer Truppen. Wir haben es letztes Mal geschafft und wir werden es auch dieses Mal schaffen."
JGT01_abet:0	"Embilta"
JGT01_abet_desc:0	"Basierend auf jahrhundertealten Traditionen umfasste die riesige äthiopische Armee Truppen aus den feudalen Domänen, die versammelt und einberufen worden waren. Die traditionellen Ambirta-Hörner und -Trommeln werden während der Schlachten ununterbrochen gespielt, selbst wenn die Armee auf dem Marsch ist."
JGT01_kaluosi:0	"Der Geist des pfeifenden Soldaten"
JGT01_kaluosi_desc:0	"Die Hingabe der Wuthering Soldiers an Gott und ihre Loyalität gegenüber ihrem König sind unübertroffen, und sie werden sogar auf dem Schlachtfeld von Priestern begleitet, die mitten im Kampf Sterbebettgebete sprechen. Zur Verteidigung des ewigen Gottes, des Vaterlandes und der Macht werden die Ideale von Carlos niemals kompromittiert!"
JGT01_dalufengsuo:0	"Fortsetzung des Kontinentalsystems"
JGT01_dalufengsuo_desc:0	"Alle Schiffe neutraler Staaten, die in Großbritannien angelegt haben, werden zusammen mit ihren Frachtschiffen beschlagnahmt; und Schiffe neutraler Staaten, die sich Großbritannien unterworfen haben, gelten als ihrer Nationalität beraubt und können gekapert werden."
JGT01_sdjlbxzy:0	"Drei Disziplinarregeln und acht Punkte, die zu beachten sind"
JGT01_sdjlbxzy_desc:0	"Erstens: Alle Handlungen erfolgen auf Befehl; zweitens: Nehmen Sie den Massen keine Nadel und keinen Faden weg; drittens: Alle Beschlagnahmungen sind der Öffentlichkeit zurückzugeben. Die acht Punkte, die zu beachten sind, lauten: Erstens, sprechen Sie freundlich; zweitens, kaufen und verkaufen Sie fair; drittens, geben Sie zurück, was Sie sich ausgeliehen haben; viertens, bezahlen Sie für das, was Sie beschädigt haben; fünftens, schlagen oder beschimpfen Sie niemanden; sechstens, beschädigen Sie keine Ernte; siebtens, belästigen Sie keine Frauen; und achtens, misshandeln Sie keine Gefangenen."
JGT01_wczmlhql:0	"Proletarier aller Länder, vereinigt euch!"
JGT01_wczmlhql_desc:0	"Der Tod gehört nicht zur Arbeiterklasse!"
JGT01_gthl:0	"Eiserne Flut"
JGT01_gthl_desc:0	"Die großen mechanisierten Korpsoperationen der Sowjetunion am Ende des Krieges"
JGT01_sljzyq:0	"Der Sieg ist zum Greifen nah"
JGT01_sljzyq_desc:0	"Unterstützen Sie unsere tapfere Rote Armee und unsere glorreiche Rote Marine mit aller Kraft! Setzen Sie die gesamte Kraft des Volkes ein, um den Feind zu vernichten! Marschieren Sie für unseren Sieg!"
JGT01_bahongyiyu:0	"hakkō ichiu"
JGT01_bahongyiyu_desc:0	"Öffnen Sie die Wellen und verkünden Sie das Ansehen des Landes in alle Richtungen."
JGT01_wscf:0	"Banzai-Angriff"
JGT01_wscf_desc:0	"てんのうへいか,ばんざい！"
JGT01_kjls:0	"Fallschirmjäger"
JGT01_kjls_desc:0	"Hitlers grüner Teufel"
JGT01_tbkqt:0	"SAS"
JGT01_tbkqt_desc:0	"Obwohl wir die Frontschlacht verloren haben, reichten die Elite-Spezialeinheiten des Britischen Empire aus, um Hitler nachts wach zu halten."
JGT01_hqbj:0	"Logistische Nachschubversorgung"
JGT01_hqbj_desc:0	"Eine gute Logistik entscheidet über den Sieg im Krieg."
JGT01_gmqs:0	"Bogenschießen"
JGT01_gmqs_desc:0	"Wo die Gemeinde prüft, muss zuerst die Eignung für Bogen und Pferd geprüft werden, bevor man das Haus betreten darf, sodass es eine Zeit gab, in der die alten Söhne des Herrn nicht mit Bogen und Pferd vertraut waren."
JGT01_xinjun:0	"Neue Armee"
JGT01_xinjun_desc:0	"Da das Militär vollständig nach westlichem Vorbild organisiert und ausgerüstet ist, ist es notwendig, dass das Militärpersonal gebildet ist, weshalb Intellektuelle bevorzugt werden."
JGT01_tupo:0	"Durchbruch an Schlüsselstellen"
JGT01_tupo_desc:0	"Angriff, Angriff, Angriff."
JGT01_shandianzhan:0	"Panzer Lehr"
JGT01_shandianzhan_desc:0	"Ich habe keine Zeit, Sie gefangen zu nehmen."
JGT01_jidongfangyu:0	"flexible Verteidigung"
JGT01_jidongfangyu_desc:0	"Raum für Zeit"
JGT01_qhz:0	"Grabenkrieg"
JGT01_qhz_desc:0	"Im Westen nichts Neues"
JGT01_youjizhan:0	"Guerillakrieg"
JGT01_youjizhan_desc:0	"Der Feind rückt vor, wir ziehen uns zurück; der Feind bleibt stehen, wir stören ihn; der Feind ist müde, wir kämpfen; der Feind zieht sich zurück, wir verfolgen ihn."
JGT01_tianlu:0	"Tian Lu-Taktik"
JGT01_tianlu_desc:0	"Tian LuEs reicht aus, das Gesetz der Tiefe von Himmel und Erde zu kennen, das Geheimnis des Universums zu erschöpfen, damit die Geister und Götter weinen, das Personal ist schwer zu verstehen, es gibt keinen Namen dafür, daher wird es Tian LuIt-Taktik genannt."
JGT01_azck:0	"Verdeckte Manipulation"
JGT01_zhianzhan:0	"Kriegsführung mit Recht und Ordnung"
JGT01_zhianzhan_desc:0	"Der Feind ist im Dunkeln, ich bin im Licht."
JGT01_shoucuo:0	"Feuerkraft und Manöver"
JGT01_shoucuo_desc:0	"Die grundlegende Methode, den Feind mit Feuerkraft anzugreifen und ein ständiges Manöver gegen den Feind aufrechtzuerhalten, gilt auf allen Ebenen, von der Feldarmee bis zum Gewehrzug."
JGT01_tzzm:0	"Der Speer Gottes"
JGT01_tzzm_desc:0	"Flügelkavallerie, vorwärts!"
JGT01_adidi:0	"Arditti-Kommando"
JGT01_adidi_desc:0	"Dolch, Bombe, Herz. Brenne, schwarze Flamme. Hurra! Italien! Es lebe Savoyen!"
JGT01_tjsqb:0	"Kataphraktiker"
JGT01_tjsqb_desc:0	"Sie werden zurückkehren wie der Blitz."
JGT01_wljwd:0	"Warägergarde"
JGT01_wljwd_desc:0	"Möge dieses Kreuz der Schild und die Waffe des Allerhöchsten sein, Georgios Varangipoulos."
JGT01_hsj:0	"All Blacks"
JGT01_hsj_desc:0	"Fascisti! Ganz Italien – die Zeit für unsere Entscheidungsschlacht ist gekommen!"
JGT01_kaqiusha:0	"Orgues de Staline"
JGT01_kaqiusha_desc:0	"So wie überall die Birnenblüten blühen, schwebt der weiche Schleier auf dem Fluss, Katuysha steht am steilen Ufer, ihre Lieder sind wie die Pracht des Frühlings ..."
JGT01_mmhld:0	"Marmon-Herrington"
JGT01_mmhld_desc:0	"Marmon-Herrington-Panzerwagen Diese gepanzerten Fahrzeuge sollten in die SADF-Fahrzeuge integriert werden und wurden 1940–1941 in großer Stückzahl hergestellt, um Infanterieeinheiten zu unterstützen, insbesondere gegen die Italiener in Ostafrika."
JGT01_fzwj:0	"Dach Afrikas"
JGT01_fzwj_desc:0	"Das Plateau macht zwei Drittel der Fläche unseres Landes aus, und die Lebensbedingungen in großer Höhe haben unsere Krieger heldenhaft und unnachgiebig gemacht, sodass alle ausländischen Invasoren letztendlich besiegt werden!"
JGT01_rszs:0	"Hidalgo"
JGT01_rszs_desc:0	"Die meisten äthiopischen Kavalleristen stammten aus dem Stamm der Oromo, einer der größten nomadischen Gela-Gruppen, die manchmal mit dem äthiopischen Kaiser verbündet waren und manchmal gegen ihn kämpften."
JGT01_laojinweijun:0	"Alte Garde"
JGT01_laojinweijun_desc:0	"Die Veteranengarde, die elitärsten Truppen unter Napoleons Kommando, war die kaiserliche Garde, die sich aus den Eliteveteranen der französischen Armee zusammensetzte."
JGT01_weijing:0	"Berserker"
JGT01_weijing_desc:0	"In diesem riesigen Wald, gekleidet in meine Kriegsausrüstung, stürzte ich mich auf meinen Speer."
JGT01_sansan:0	"Drei-Drittel-System"
JGT01_sansan_desc:0	"Das Dreidrittelsystem entstand während des Widerstandskrieges gegen die japanische Aggression, reifte während des Bürgerkriegs zwischen Nationalisten und Kommunisten und wurde im Widerstandskrieg gegen die USA und bei der Hilfe für Korea intensiv genutzt. Es handelt sich um eine Art Infanterie-Angriffstaktik, die im Ausbildungslehrplan der Infanterie unserer Armee enthalten ist."
tactic_breakthrough_preferred_weight_factor:0	"Bei der Wahl der Taktik: zusätzliche Durchbruchwahrscheinlichkeit"
tactic_guerrilla_tactics_preferred_weight_factor:0	"Bei der Wahl der Taktik: Guerilla-Guerilla-Taktik-Wahrscheinlichkeit"
tactic_blitz_preferred_weight_factor:0	"Bei der Wahl der Taktik: Guerilla-Blitz-Wahrscheinlichkeit"
tactic_backhand_blow_preferred_weight_factor:0	"Bei der Wahl der Taktik: Guerilla-Rückhandschlag-Wahrscheinlichkeit"
modifier_tactic_banzai_charge_preferred_weight_factor:0	"Bei der Wahl der Taktik: Guerilla-Taktik-Banzai-Wahrscheinlichkeit"
tactic_tactical_withdrawal_preferred_weight_factor:0	"Bei der Wahl der Taktik: Guerilla-Taktischer Rückzug-Wahrscheinlichkeit"
modifier_tactic_elastic_defense_preferred_weight_factor:0	"Bei Wahl der Taktik: Wahrscheinlichkeit für Guerilla-Taktik Elastic"
JGT03_hjhkbb:0	"Hauptquartier der Imperial Airways"
JGT03_yghjkj:0	"Royal Air Force"
JGT04_dgkj:0	"Deutsche Luftwaffe"
jgt5_slkj:0	"Sowjetische Luftwaffe"
JGT03_hhwz:0	"Bevorzugung der Marinefliegerei"
JGT03_hhwz_desc:0	"Flugzeuge sind nur als Unterstützung für die Marine und zur Aufklärung nützlich."
JGT03_lhwz:0	"Bevorzugung der Heeresfliegerei"
JGT03_lhwz_desc:0	"Die Aufgabenbeschreibung ist eigentlich ganz einfach: Bomben Sie dort, wo die Generäle es Ihnen befehlen."
JGT03_hjyj:0	"Raketenforschung"
JGT03_hjyj_desc:0	"Diese fortschrittlichen Waffen könnten die Zukunft der Kriegsführung bestimmen ..."
JGT03_jxss:0	"Der schreiende Tod"
JGT03_jxss_desc:0	"Hören Sie einfach ruhig zu, als die Stimme dieses Jericho erklang ..."
JGT03_btfw:0	"Heimatschutz"
JGT03_btfw_desc:0	"Einen anfliegenden Feind abschießen"
JGT03_kzys:0	"Lufttransport"
JGT03_kzys_desc:0	"Die Luftwaffe ist in der Lage, eine Luftbrücke zur Versorgung der Truppen aufzubauen."
JGT04_lskwhkt:0	"Raskova Airborne"
JGT04_lskwhkt_desc:0	"Der Schrecken der Dunklen Hexe wird für immer über den feindlichen Streitkräften schweben, für immer ..."
JGT03_hjjzj:0	"Marinefliegerei"
JGT03_mklsjd:0	"McClusky Airborne"
JGT03_mklsjd_desc:0	"Der tapfere Kommandant McClusky hat uns möglicherweise einen unerwarteten Vorteil im Krieg verschafft ..."
JGT03_ljhz:0	"Landbombardierung"
JGT03_ljhz_desc:0	"Durchbruch der Linien mit der Infanterie"
JGT03_zlhzj:0	"Direktprojektorprogramm"
JGT03_zlhzj_desc:0	"Die Hölle erwartet die Deutschen ..."
JGT03_yydl:0	"Eien no zero"
JGT03_yydl_desc:0	"Der Teufel über dem Pazifik"
JGT02_usahj:0	"Das Erbe der United States Navy"
JGT02_usahj_desc:0	"Der Vorgänger der United States Navy war die Continental Navy, die während des Amerikanischen Unabhängigkeitskrieges gegründet wurde."
JGT02_gbrhj:0	"Tradition der Royal Navy"
JGT02_gbrhj_desc:0	"Es dauert nur drei Jahre, um ein Schlachtschiff zu bauen, aber dreihundert Jahre, um eine Marinetradition zu entwickeln."
JGT02_gerhj:0	"Deutsche Marinetradition"
JGT02_gerhj_desc:0	"Nach der Vereinigung Deutschlands im Jahr 1871 wurde mit der Entwicklung der Industrie die Macht der Kaiserlichen Marine erheblich gestärkt, sodass sie zeitweise nach der Royal Navy zur zweitstärksten Seemacht der Welt wurde."
JGT02_japhj:0	"Japanische Marinetradition"
JGT02_japhj_desc:0	"Seit der Meiji-Restauration hat Japan Großbritannien als Vorbild genommen und mit aller Kraft des Landes eine mächtige Marine aufgebaut. Nach den Erfahrungen des Chinesisch-Japanischen Krieges und des Russisch-Japanischen Krieges ist die japanische Marine zur drittgrößten der Welt geworden, nur noch übertroffen von der britischen und der amerikanischen Marine."
JGT02_itahj:0	"Italienische Marinetradition"
JGT02_itahj_desc:0	"In den 1870er Jahren entwickelte sich der Kapitalismus nach der Vereinigung Italiens rasant. Um internationale Märkte zu erschließen und eine koloniale Expansion im Ausland zu erreichen, begann die italienische Regierung mit dem beschleunigten Aufbau ihrer Marine, die zu einer der mächtigsten Marinen der Welt zu dieser Zeit wurde."
JGT02_sulian:0	"Sowjetische Marine"
JGT02_sulian_desc:0	"Die Rote Marine der UdSSR, die Seestreitkräfte der Sowjetunion, bestand aus fünf Zweigen: U-Booten, Überwasserschiffen, Luftwaffe, Küstenraketenartillerie und Marineinfanterie."
JGT02_shae:0	"Marinetradition des zaristischen Russlands"
JGT02_shae_desc:0	"Die zaristische russische Marine war die Marine des zaristischen Russlands von ihrer Gründung im Jahr 1696 bis zur Februarrevolution 1917. Nach der Eroberung der Festungen im Asowschen Meer erkannte die russische Duma die Bedeutung des Aufbaus einer regulären Marine und verabschiedete am 20. Oktober 1696 ein Gesetz über den Aufbau der Marine. Dieser Tag gilt als Geburtsstunde der russischen Kaiserlichen Marine."
JGT02_aosiman:0	"Wiederaufbau des osmanischen maritimen Erbes"
JGT02_aosiman_desc:0	"Zu Beginn des 14. Jahrhunderts begann das Osmanische Reich mit dem Aufbau einer Marine, die in der Entwicklungsphase hauptsächlich zur Verteidigung und zum Schutz der Küste eingesetzt wurde. Zu Beginn des 16. Jahrhunderts erreichte die Marine des Osmanischen Reiches ihre Blütezeit, und zu Beginn des 17. Jahrhunderts begann ihr Niedergang. "
JGT02_dongluoma:0	"Wiederbelebung der östlichen römischen Seefahrertradition"
JGT02_dongluoma_desc:0	"Bis zum Ende des 8. Jahrhunderts hatte sich die byzantinische Marine zu einer gut organisierten und gut bewaffneten Streitmacht entwickelt und war die wichtigste Seemacht im Mittelmeerraum. Sie war der muslimischen Marine ebenbürtig, doch im 10. Jahrhundert hatten die Byzantiner ihre Vorherrschaft im östlichen Mittelmeerraum zurückgewonnen."
JGT02_daqing:0	"Das Vermächtnis der Beiyang-Marine"
JGT02_daqinga_desc:0	"Am 17. Dezember 1888 wurde die Beiyang-Marineabteilung offiziell auf der Insel Liugong in Weihaiwei in der Provinz Shandong gegründet, wobei die Qing-Regierung jährlich 4 Millionen Tael Silber für den Bau von Kriegsschiffen bereitstellte. Die Flotte war einst die stärkste in Asien und die neuntstärkste weltweit."
JGT02_aoxiong:0	"Das Erbe der österreichisch-ungarischen Marine"
JGT02_aoxiong_desc:0	"Die österreichisch-ungarische Marine existierte von 1867 bis 1918 und war die Seemacht des Österreichisch-Ungarischen Reiches. Der offizielle deutsche Name lautete "Kaiserliche und Königliche Kriegsmarine", abgekürzt "k.u.k. Kriegsmarine"."
JGT02_helan:0	"Tradition der Königlich Niederländischen Marine"
JGT02_helan_desc:0	"Die moderne niederländische Marine geht auf den 8. Januar 1488 zurück, als sie durch das vom Heiligen Römischen Kaiser Maximilian I. erlassene "Seegesetz" gegründet wurde. Später wurde sie während des Achtzigjährigen Krieges von den Habsburgern unabhängig von den Habsburgischen Niederlanden."
JGT02_weijing:0	"Langschiff"
JGT02_weijing_desc:0	"Die Wikinger segelten über die Meere, um Angst zu verbreiten und Länder zu erobern. Sie überquerten die Ozeane und begaben sich auf eine Reise ins Unbekannte, wo nur die Starken bestehen konnten. Mit Mut und Entschlossenheit können wir unsere Marine wieder aufbauen und erneut die Meere beherrschen."
JGT02_wudijiandui:0	"Wiederbelebung der spanischen Armada"
JGT02_wudijiandui_desc:0	"Die spanische Marine, der maritime Teil der spanischen Streitkräfte, geht auf das späte Mittelalter zurück und ist eine der ältesten aktiven Marinen der Welt und eine der wenigen Hochseemarinen weltweit."
JGT02_lsqh:0	"Stiller Jäger"
JGT02_lsqh_desc:0	"Bitte Ruhe bewahren. Alle Schiffe bitte bereit halten ..."
JGT02_hql:0	"Seemachtstheorie"
JGT02_hql_desc:0	"Die Kontinente auf der Erdoberfläche sind von Ozeanen und Meeren umgeben, die gegenüber dem Land einen Transportvorteil bieten. Wer die Ozeane kontrolliert, kann die Kontinente kontrollieren. Der Schlüssel zur Seemacht ist eine Seestreitmacht, die in der Lage ist, Blockaden zu errichten und entscheidende Seeschlachten zu führen."
JGT02_jjzcjh:0	"Notfall-Schiffbauprogramm"
JGT02_jjzcjh_desc:0	"Ich bitte den Kongress, zu erklären, dass seit Sonntag, dem 7. Dezember 1941, als Japan seinen unprovozierten und verabscheuungswürdigen Angriff startete, zwischen den Vereinigten Staaten und dem Kaiserreich Japan Kriegszustand herrscht."
JGT02_rbl:0	"Die Sonne wird niemals untergehen"
JGT02_rbl_desc:0	"Die Sonne geht niemals über unserem Territorium unter."
JGT02_dapj:0	"Beschuss über die Meerenge hinweg"
JGT02_dapj_desc:0	"Die Unterstützung durch Seartillerie ist ein zuverlässiger Schutz für die Soldaten des Marine Corps."
JGT02_hhjd:0	"Konvoiflotte"
JGT02_hhjd_desc:0	"Seetransportwege sind die Lebensader des Seeverkehrs in Ländern, die an das Meer grenzen."
JGT02_hmzz:0	"Operationen von Flugzeugträgern aus"
JGT02_hmzz_desc:0	"Das Zeitalter der großen Schiffe und großen Geschütze neigte sich dem Ende zu, und die Zeit der Marinefliegerei ging zu Ende."
JGT02_lhjd:0	"Kombinierte Flotte"
JGT02_lhjd_desc:0	"Der Vorgänger der Kombinierten Flotte war die Ständige Flotte, die am 29. Juli 1889 gebildet wurde. Die japanische Kombinierte Flotte wurde am 28. Dezember 1903 gegründet und am 1. Mai 1945 aufgelöst."
