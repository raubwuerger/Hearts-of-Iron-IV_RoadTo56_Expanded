l_german:
reserves_mobilized:0	"Nationale Miliz mobilisiert"
reserves_mobilized_desc:0	"Unsere nationalen Milizen sind derzeit mobilisiert und im Einsatz. Das erhöht unsere Stärke, verursacht aber auch wirtschaftliche Belastungen für unser Land. "
demobilization_failed:0	"Versäumte Demobilisierung"
demobilization_failed_desc:0	"Wir haben es versäumt, uns rechtzeitig mit den Herausforderungen einer massiven paramilitärischen Mobilisierung zu befassen, und halten an der Integration der Milizen als fester Bestandteil unserer Militärstruktur fest. §Wir müssen uns auf schwerwiegende negative Auswirkungen in unserer Gesellschaft und Wirtschaft einstellen, bis sich die Menschen daran gewöhnt haben."
militia_formed:0	"Nationale Miliz gebildet"
militia_formed_desc:0	"Unsere nationalen Milizkräfte sind gebildet und bereit. Sie können im Falle eines Krieges mobilisiert und eingesetzt werden. "
fighting_forever:0	"Kämpfen für immer"
fighting_forever_desc:0	"§RI reißt meine Brücken hinter mir ab ... dann bleibt mir nichts anderes übrig, als vorwärts zu gehen.§!"
small_loan_repayment:0	"Kleine Kreditrückzahlung"
medium_loan_repayment:0	"Mittlere Darlehensrückzahlung"
large_loan_repayment:0	"Rückzahlung eines großen Kredits"
increased_taxation:0	"Erhöhte Besteuerung"
