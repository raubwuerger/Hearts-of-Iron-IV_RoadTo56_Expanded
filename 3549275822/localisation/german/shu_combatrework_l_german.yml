category_all_DIV_HQ:0	"Alle HQ-Abteilungen"
HQ:0	"Hauptquartier-Abteilung"
HQ_desc:0	"Kommandoeinheit Bataillon"
DIV_HQ:0	"Infanterie HQ-Abteilung"
DIV_HQ_desc:0	"Eine Division ist eine große militärische Einheit oder Formation, die normalerweise aus 10.000 bis 20.000 Soldaten besteht. Infanteriedivisionen während der Weltkriege umfassten in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen besteht eine Division aus mehreren Regimentern oder Brigaden; mehrere Divisionen wiederum bilden in der Regel ein Korps. In den meisten modernen Streitkräften ist eine Division in der Regel die kleinste Einheit mit kombinierten Waffen, die zu eigenständigen Operationen fähig ist. Das liegt an ihrer autarken Rolle als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungstruppen, die in verschiedenen organischen Kombinationen zusammengestellt werden können.\nTypen im Zweiten Weltkrieg:\nKavallerie-, Panzer- und Infanterie- und Fallschirmjäger-/Luftlandedivisionen."
DIV_HQ_airborne:0	"£special_forces_texticon Luftlande-Hauptquartier-Abkommando"
DIV_HQ_airborne_desc:0	"Kommandoeinheit.§A Eine Division ist eine große militärische Einheit oder Formation, die normalerweise aus 10.000 bis 20.000 Soldaten besteht. Fallschirmjäger-/Luftlandedivisionen während der Weltkriege umfassten in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; mehrere Divisionen wiederum bilden in der Regel ein Korps. In den meisten modernen Armeen ist eine Division in der Regel die kleinste Einheit, die zu unabhängigen Operationen fähig ist. Das liegt an ihrer selbsttragenden Rolle als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungstruppen, die in verschiedenen organischen Kombinationen zusammengestellt werden können.\nTypen im Zweiten Weltkrieg:\nKavallerie-, Panzer-, Infanterie- und Fallschirmjäger-/Luftlandedivision."
DIV_HQ_car:0	"Motorisiertes HQ-Abkommando"
