DIV_HQ_arm:0	"Mechanisiertes HQ-Abkommando"
DIV_HQ_arm_desc:0	"Kommandoeinheit.\nEine Division ist eine große militärische Einheit oder Formation, die normalerweise aus 10.000 bis 20.000 Soldaten besteht. Infanteriedivisionen während der Weltkriege umfassten in der Regel 30.000 oder mehr Soldaten.\nIn den meisten Armeen setzt sich eine Division aus mehreren Regimentern oder Brigaden zusammen; mehrere Divisionen wiederum bilden in der Regel ein Korps. In den meisten modernen Armeen ist eine Division in der Regel die kleinste Einheit, die zu unabhängigen Operationen fähig ist. Das liegt an ihrer selbsttragenden Rolle als Einheit mit einer Reihe von Kampftruppen und geeigneten Kampfunterstützungstruppen, die in verschiedenen organischen Kombinationen angeordnet werden können.\nTypen im Zweiten Weltkrieg:\nKavallerie-, Panzer- und Infanterie- und Fallschirmjäger-/Luftlandedivision."
light_infantry:0	"Leichte Infanterie"
light_infantry_desc:0	"Leichtere Infanterie, die besser für unwegsames Gelände ausgerüstet ist."
garrison:0	"Garnison"
garrison_desc:0	"Auf Verteidigungsmaßnahmen spezialisierte Infanterie, die nicht für den Kampf an der Front geeignet ist."
