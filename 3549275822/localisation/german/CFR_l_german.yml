l_german:
CFR_EMPTY_STR:	"£civ_factory $industrial_complex$ Eingabe"
CFR_resource_modifier:	"£civ_factory_output $industrial_complex$ Input-Mangel"
CFR_factory_output_modifier:	"Ressourcen für zivile Fabriken"
CFR_decision_category:	"$CFR_desc_byline$$CFR_desc_resources$$CFR_desc_factories$[CFR_technology_desc][CFR_input_shortage_desc]"
CFR_decision_category_desc:	"Da unsere zivile Industriekapazität wächst, wird sie zusätzliche Ressourcen benötigen, um ihre volle Kapazität aufrechtzuerhalten."
CFR_desc_byline:	"\n\nWir benötigen derzeit §Y[?CFR_steel_usage]§! §4$PRODUCTION_MATERIALS_STEEL$§! , §Y[?CFR_chromium_usage]§! §6$PRODUCTION_MATERIALS_CHROMIUM$§! und §Y[?CFR_oil_usage]§! §3$PRODUCTION_MATERIALS_OIL$§! für unsere §Y[?num_of_civilian_factories] Zivilen Fabriken§!."
CFR_desc_resources:	"\n\n§Y[?CFR_light_industry]§! unserer zivilen Fabriken benötigen §G50% weniger§! Ressourcen, da sie für Zwecke mit geringer Intensität zugewiesen werden, wie $PRODUCTION_CONSUMER_GOODS$, $CONSTRUCTION_FACTORIES_PROJECTS_LABEL$ und $CONSTRUCTION_FACTORIES_TRADE_LABEL$."
CFR_desc_factories:	"\n\nWir benötigen §G5% weniger§! Input-Ressourcen, weil wir §H$construction2$§! erforscht haben."
CFR_desc_tech_1:	"\n\nWir benötigen §G10% weniger§! Input-Ressourcen, weil wir §H$construction3$§! recherchiert haben."
CFR_desc_tech_2:	"\n\nWir benötigen §G15% weniger§! Input-Ressourcen, weil wir §H$construction4$§! recherchiert haben."
CFR_desc_tech_3:	"\n\nWir benötigen §G20% weniger§! Input-Ressourcen, weil wir §H$construction5$§! recherchiert haben."
CFR_desc_tech_4:	"\n\nWir haben derzeit einen §Einsatzmangel§! von [?CFR_steel_deficit|0-] §4$PRODUCTION_MATERIALS_STEEL$§! , [?CFR_chromium_deficit|0-] §6$PRODUCTION_MATERIALS_CHROMIUM$§! und [?CFR_oil_deficit|0-] §3$PRODUCTION_MATERIALS_OIL$§!, was zu einer §Reduzierung§! des $industrial_complex$ Outputs von [?CFR_factory_output_reduction|%.2+] führt."
CFR_desc_shortage:	""
