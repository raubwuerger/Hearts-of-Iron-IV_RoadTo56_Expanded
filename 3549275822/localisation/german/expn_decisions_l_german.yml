focus_air_superiority:0	"Luftkampfmanöver"
focus_air_superiority_desc:0	"Durch die Ausbildung unserer Piloten in fortgeschrittenen taktischen Luftmanövern verbessern wir ihre Agilität, Kampfkraft und Leistung bei Luftüberlegenheitsmissionen. Diese neuen Techniken verschaffen unseren Luftflügeln einen Vorteil in Luftkämpfen und sichern unsere Dominanz am Himmel."
focus_ground_attack:0	"Präzisionsangriffe am Boden"
focus_ground_attack_desc:0	"Durch die Organisation spezialisierter Staffeln für Luftnahunterstützung und Präzisionsangriffe am Boden kann unsere Luftwaffe präzise und vernichtende Schläge gegen feindliche Stellungen ausführen. Diese Einheiten stören die feindliche Verteidigung und bieten unseren vorrückenden Bodentruppen ständige Unterstützung, wodurch eine bessere Koordination zwischen Luft- und Bodenoperationen gewährleistet wird."
focus_naval_invasion:0	"Vermessung von Landeplätzen für die Marine"
focus_naval_invasion_desc:0	"Mit Hilfe von Langstrecken-Spionageflugzeugen und U-Booten können vielversprechende Landeplätze ausfindig gemacht und mit der erforderlichen Präzision kartiert werden. Dies unterstützt unsere Truppen an den Stränden und erleichtert die Arbeit unserer Planungsstäbe."
focus_navy_actions:0	"Modulare Nachrüstung und Reparatur von Pionieren"
focus_navy_actions_desc:0	"Durch die Umstellung von individuell gebauten Schiffen auf einen modularen Ansatz können Interkompatibilität, Flexibilität und Skaleneffekte erschlossen werden. Dies eröffnet Möglichkeiten für Synergien und belebt leistungsstarke Lösungen für die Seekriegsführung."
focus_field_experience:0	"Erfahrungen aus dem Kampfgeschehen"
focus_field_experience_desc:0	"Jede Schlacht hinterlässt Spuren bei unseren Kommandanten und Soldaten. Indem sie sich den Strapazen an der Front stellen, sammeln sie wertvolle Erfahrungen und verfeinern ihre Taktiken. Gleichzeitig bieten Kriegsbeuten die Möglichkeit, feindliche Ausrüstung zu erbeuten, wodurch die Erfahrungen aus dem Kampfgeschehen sowohl in Fähigkeiten als auch in greifbare Vorteile umgewandelt werden."
focus_fuel_consumption:0	"Optimierter Kraftstoffverbrauch"
focus_fuel_consumption_desc:0	"Durch die Umsetzung von Kraftstoffsparmaßnahmen in unseren Streitkräften reduzieren wir den Verbrauch kritischer Ressourcen durch unsere Armeen, Luftstreitkräfte und Marinen. Dadurch wird sichergestellt, dass unsere Einheiten länger im Einsatz bleiben, ihre Dynamik beibehalten und längere Kampagnen durchführen können, ohne die Versorgungslinien zu überlasten."
focus_aerial_buildings:0	"Optimierung des Baus von Luftwaffenstützpunkten"
focus_aerial_buildings_desc:0	"Durch die Optimierung des Baus von Luftwaffenstützpunkten, Radarstationen und Luftabwehrsystemen können wir Verteidigungs- und Einsatzstrukturen schneller bereitstellen. Dies beschleunigt die Befestigung unseres Luftraums und stellt sicher, dass unsere Streitkräfte schnell auf jede Bedrohung aus der Luft reagieren können."
