civil_investments:0	"In die zivile Industrie investieren"
civil_investments_desc:0	"Wir können den Staatshaushalt zur Finanzierung des Baus neuer Industrieanlagen einsetzen, um das Wirtschaftswachstum zu fördern und die Produktionskapazitäten unseres Landes zu verbessern. "
war_investments:0	"Investitionen in die Rüstungsindustrie"
war_investments_desc:0	"Wir können staatliche Mittel für die Errichtung von Fabriken zur Herstellung von Waffen bereitstellen, um eine ständige Versorgung mit Waffen zur Unterstützung unserer nationalen Verteidigungsanstrengungen zu gewährleisten."
naval_investments:0	"Investitionen in die maritime Industrie"
naval_investments_desc:0	"Wir können staatliche Mittel einsetzen, um den Bau neuer Werften zu finanzieren, um unsere maritime Infrastruktur zu stärken und unsere maritimen und industriellen Fähigkeiten zu verbessern."
land_nationalization:0	"Verstaatlichung von Land in Privatbesitz"
land_nationalization_desc:0	"In unserem Land gibt es ungenutzte Flächen, die sich im Besitz ausländischer Unternehmen befinden. Um sicherzustellen, dass sie zu unserer nationalen Entwicklung beitragen, können wir diese Ländereien beschlagnahmen und sie einer langfristigen produktiven Nutzung zuführen. "
forced_industrialization:0	"Rasche Industrialisierung"
forced_industrialization_desc:0	"Anstatt auf Investitionen zu warten oder sie zu fördern, können wir die Industrialisierung beschleunigen, indem wir Gebäude beschlagnahmen, die sich für die Umwandlung in Industrieanlagen eignen, und sie effizient umnutzen, um unseren Bedarf in kurzer Zeit zu decken."
petrol_investment:0	"In die Erdölindustrie investieren"
petrol_investment_desc:0	"Wir können den Bau neuer Raffinerien für die heimische Produktion von synthetischem Öl fördern, um unsere Abhängigkeit von Importen zu verringern und unsere Energieunabhängigkeit zu stärken."
land_distribution:0	"Landverteilung"
land_distribution_desc:0	"In unserem Land haben viele Menschen mit Armut zu kämpfen und müssen unmenschliche Lebensbedingungen ertragen. Um dem entgegenzuwirken, können wir die überfüllten städtischen Slums räumen und diesen Menschen ein paar Hektar Land für die Landwirtschaft zur Verfügung stellen, um ihnen einen Neuanfang und die Möglichkeit zu geben, sich ein besseres Leben aufzubauen."
steel_investments:0	"In die Stahlproduktion investieren"
steel_investments_desc:0	"Stahl ist ein wichtiger Werkstoff für die Leicht- und Schwerindustrie in der modernen Welt. Durch die Förderung des Baus von Stahlwerken können wir unsere Stahlproduktionskapazität erheblich steigern und ausreichende Reserven für den industriellen und nationalen Bedarf sicherstellen."
establish_university:0	"Neue Universität gründen"
establish_university_desc:0	"Hochschuleinrichtungen spielen eine entscheidende Rolle bei der Förderung unserer nationalen Forschungsanstrengungen. Indem wir einen Teil des Staatshaushalts für die Gründung neuer Universitäten bereitstellen, können wir sicherstellen, dass unser Land wettbewerbsfähig bleibt und in der modernen Welt nicht zurückfällt."
forced_recruitment:0	"Obligatorische Rekrutierung"
forced_recruitment_desc:0	"In der Tat ist es die Pflicht eines jeden Bürgers, in Zeiten der Not zur Verteidigung unserer Nation beizutragen, sei es durch freiwilliges Handeln oder, wenn nötig, durch die Erfüllung seiner gesetzlichen Pflichten. Das Überleben und die Stärke unserer Nation hängen von den kollektiven Anstrengungen aller ihrer Bürger ab."
seize_industry:0	"Beschlagnahme von Produktionsanlagen"
seize_industry_desc:0	"Wir können "vorübergehend" Fabriken in Privatbesitz beschlagnahmen und sie in Waffenproduktionsanlagen umwandeln oder ihre Ressourcen umleiten, um zu den nationalen Kriegsanstrengungen beizutragen und die rasche Produktion wichtiger Materialien für unsere Sache sicherzustellen."
mining_effort:0	"Umfangreiche Bergbauanstrengungen"
mining_effort_desc:0	"Andere seltene Materialien wie Wolfram und Aluminium sind von entscheidender Bedeutung, insbesondere für die Rüstungsindustrie. Wir müssen unsere Bergbaubemühungen intensivieren, um potenzielle Wolfram- und Aluminiumvorkommen in unserem Land zu erschließen und diese lebenswichtigen Ressourcen für unseren Produktionsbedarf zu sichern."
infrastructure_investments:0	"Ausbau der staatlichen Infrastruktur"
infrastructure_investments_desc:0	"Um unseren ländlichen Raum zu modernisieren, müssen wir uns auf die Verbesserung der Qualität der Straßen und der gesamten Infrastruktur in den ländlichen Gebieten konzentrieren, um eine bessere Anbindung zu gewährleisten und das Wirtschaftswachstum in der gesamten Region zu fördern."
seize_weaponry:0	"Beschlagnahme ziviler Waffen"
seize_weaponry_desc:0	"Es ist klar, dass eine beträchtliche Anzahl von zugelassenen und nicht zugelassenen Schusswaffen im Besitz von Bürgern im ganzen Land ist. In dieser kritischen Zeit können wir diese Waffen beschlagnahmen, um unsere Streitkräfte zu versorgen und sicherzustellen, dass sie für die bevorstehenden Herausforderungen gerüstet sind."
seize_transport:0	"Beschlagnahme ziviler Handelsschiffe"
seize_transport_desc:0	"Die Aufrechterhaltung unserer Logistiklinien auf See ist für den ununterbrochenen Fluss von Nachschub und potenziellen Waffeneinfuhren von entscheidender Bedeutung. Um dies zu gewährleisten, können wir zivile Handelsflotten beschlagnahmen. "
austerity_measures:0	"Sparmaßnahmen"
austerity_measures_desc:0	"Harte Zeiten erfordern harte Entscheidungen, und in diesen schwierigen Momenten müssen wir neue Gesetze erlassen, um die Industrie zu regulieren und die Bevölkerung zu einem aktiveren Beitrag zu unseren Kriegsanstrengungen zu zwingen."
railway_effort:0	"Investitionen in nationale Eisenbahnen"
railway_effort_desc:0	"In unserer Zeit sind Eisenbahnen das Lebenselixier einer Nation, sie verbinden ihre lebenswichtigen Regionen und ermöglichen wirtschaftlichen und logistischen Zusammenhalt. Indem wir einen Teil unseres Budgets für einen bestimmten Zeitraum zur Förderung der Eisenbahnindustrie bereitstellen, können wir unsere Infrastruktur verbessern und nachhaltiges Wachstum und Konnektivität gewährleisten. "
mobilize_reserves:0	"Mobilisierung der Miliz"
form_militias:0	"Bildung der nationalen Miliz"
form_militias_desc:0	"Zusätzlich zu unserer Berufsarmee können wir unsere Zivilbevölkerung so organisieren, dass sie in Kriegszeiten als paramilitärische Kräfte dient. Indem wir fähige und qualifizierte Personen in paramilitärischen Organisationen registrieren, können wir im Bedarfsfall schnell eine fähige und effektive Truppe mobilisieren. §Die Entscheidung für diesen Beschluss wird die Mobilisierung und den Einsatz nationaler Milizdivisionen in Kriegszeiten ermöglichen. Die Anzahl der Divisionen, die mobilisiert werden können, hängt von der Anzahl unserer zivilen Fabriken ab. "
mobilize_reserves_desc:0	"Wir müssen unsere paramilitärischen Organisationen mobilisieren, um Milizbrigaden aufzustellen, die sich aus den Reihen unserer qualifizierten Bevölkerung rekrutieren, um unsere Verteidigung zu verstärken. §A Es wird wirtschaftliche Folgen haben, aber wir brauchen jede Hand, die ein Gewehr halten und abfeuern kann.§! "
demobilization_mission:0	"Demobilisierung der Miliz"
demobilization_mission_desc:0	"Jetzt, wo der Krieg vorbei ist, sollten wir unsere Miliz demobilisieren und ihnen die Rückkehr in den Alltag ermöglichen. §Wenn wir weiterhin qualifizierte Menschen in unseren Streitkräften aktiv halten, kann dies zu schweren Unruhen und weiteren wirtschaftlichen Belastungen führen."
demobilize_reserves:0	"Demobilisierung der nationalen Miliz"
demobilize_reserves_desc:0	"Jetzt, wo der Krieg vorbei ist, sollten wir unsere Miliz demobilisieren und sie in den Alltag zurückkehren lassen."
investments_category:0	"Nationale Entwicklung"
investments_category_desc:0	"Da die Bedeutung der wirtschaftlichen und industriellen Entwicklung mit jedem Tag zunimmt, insbesondere in diesen turbulenten Zeiten, müssen wir den strategischen Einsatz von Regierungsgeldern zur Verbesserung und Modernisierung unserer wirtschaftlichen und industriellen Infrastruktur priorisieren. Nur durch solche Anstrengungen können wir den Status einer vollständig modernisierten Nation erreichen."
mobilization_category:0	"Nationale Mobilisierung"
mobilization_category_desc:0	"Der Krieg ist über unser Land hereingebrochen, und es ist nun unsere Pflicht, alle notwendigen Maßnahmen zu ergreifen, um unsere Souveränität zu verteidigen und unser Volk zu schützen. In diesen schwierigen Zeiten müssen schwierige Entscheidungen getroffen werden, aber kein Opfer ist zu groß, wenn es um die Bewahrung unserer Unabhängigkeit geht. "
purchase_surplus_equipment:0	"Kauf überschüssiger Ausrüstung"
purchase_surplus_equipment_desc:0	"Neutrale Staaten sind oft bereit, ihren Kunden veraltete, aber noch funktionsfähige militärische Ausrüstung zu liefern. Durch den Kauf der erforderlichen Waffen von diesen Dritten können wir vorübergehend unsere Ausrüstungsdefizite beheben. "
fight_forever:0	"Das letzte Gefecht"
fight_forever_desc:0	"Wenn ich meine Brücken hinter mir abreiße, bleibt mir nichts anderes übrig, als weiterzugehen." §Wählen Sie diese Entscheidung mit Bedacht, denn sie ist nur einmalig verfügbar. Wenn du diese Entscheidung triffst, kannst du nach der Kapitulation keine weiteren Entscheidungen mehr treffen!§!""
economics_category:0	"Nationale Finanzen"
economics_category_desc:0	"Die Steuerpolitik und die Finanzstruktur eines Landes sind für seine Stärke und Widerstandsfähigkeit von entscheidender Bedeutung. Als Regierung haben wir die Befugnis und die Verantwortung, unser Finanzsystem zu verändern und gegebenenfalls neu zu justieren. Strategische Entscheidungen, die zum richtigen Zeitpunkt getroffen werden, können unsere wirtschaftlichen Fähigkeiten und unseren nationalen Wohlstand erheblich verbessern.  "
take_small_loan:0	"Kleine Kredite aufnehmen"
take_small_loan_desc:0	"Wir können kleine und kurzfristige Kredite in Anspruch nehmen, um unseren Haushalt vorübergehend aufzustocken und unsere wirtschaftlichen Kapazitäten zu stärken. "
take_medium_loan:0	"Mittleres Darlehen"
take_medium_loan_desc:0	"Wir können mittelgroße und kurzfristige Kredite in Anspruch nehmen, um unser Budget vorübergehend aufzustocken und unsere wirtschaftlichen Fähigkeiten zu stärken. "
take_large_loan:0	"Großes Darlehen"
take_large_loan_desc:0	"Wir können große und kurzfristige Kredite in Anspruch nehmen, um unser Budget vorübergehend aufzustocken und unsere wirtschaftliche Leistungsfähigkeit zu stärken. "
poverty_fund:0	"Investitionen in den Sozialbereich"
poverty_fund_desc:0	"Wir können zusätzliche staatliche Mittel bereitstellen, um die Unterstützung für unsere Sozialprogramme vorübergehend zu erhöhen. Die Aufstockung der Leistungen für die einkommensschwache Bevölkerung wird dazu beitragen, unser Land zu stabilisieren, indem die wirtschaftliche Ungleichheit verringert und der soziale Zusammenhalt gefördert wird."
government_savings:0	"Erhöhung der staatlichen Einsparungen"
government_savings_desc:0	"Für einen begrenzten Zeitraum können wir bestimmte nicht lebensnotwendige" Ausgaben aus dem Staatshaushalt streichen. Die durch diese Maßnahmen eingesparten Mittel können zur Unterstützung und Stärkung unserer Wirtschaft eingesetzt werden."
increase_taxes:0	"Steuern erhöhen"
increase_taxes_desc:0	"Wir können gezielte Erhöhungen in bestimmten Steuerbereichen wie der Einkommens- und Verbrauchssteuer vornehmen, um die Staatseinnahmen zu erhöhen und wichtige nationale Initiativen zu unterstützen."
decrease_taxes:0	"Zusätzliche Steuern streichen"
decrease_taxes_desc:0	"Während die Regierungen oft höhere Steuern bevorzugen, um ihren Betrieb aufrechtzuerhalten, vertritt die Öffentlichkeit in der Regel eine andere Meinung. Um Spannungen abzubauen und unsere unzufriedene Bevölkerung zu besänftigen, können wir eine vorübergehende Senkung der Steuersätze in Erwägung ziehen, um den guten Willen und die Stabilität zu fördern."
make_investments:0	"In ausländische Märkte investieren"
make_investments_desc:0	"Wir können aus dem Staatshaushalt in ausländische Börsen, Märkte oder Grundstücke investieren. Auch wenn solche Unternehmungen immer mit Risiken verbunden sind, können wir unter der Anleitung unserer qualifizierten und erfahrenen Wirtschaftsexperten potenziell Gewinne aus diesen Investitionen erzielen. "
general_staff_category:0	"Oberkommando der Armee"
general_staff_category_desc:0	"Schlachten werden von Soldaten geschlagen, aber es sind die hochrangigen Offiziere in unseren Streitkräften, die die Pläne formulieren und sie leiten. In Kriegszeiten müssen wir über spezifische Strategien entscheiden, die wir an Land umsetzen.   "
focus_offensive:0	"Fokus auf Offensive"
focus_offensive_desc:0	"Das Oberkommando wird seine Pläne mit dem Schwerpunkt auf Offensivoperationen ausarbeiten."
focus_defence:0	"Fokus auf Verteidigung"
focus_defence_desc:0	"Das Oberkommando wird seine Pläne in erster Linie mit Blick auf die Defensive ausarbeiten."
focus_planning:0	"Fokus auf Planung"
focus_planning_desc:0	"Das Oberkommando wird seine Pläne so ausarbeiten, dass es sich in erster Linie auf die Vorbereitung der Offensive konzentriert."
focus_logistics:0	"Schwerpunkt Logistik"
focus_logistics_desc:0	"Das Oberkommando wird seine Pläne mit dem Hauptaugenmerk auf die Sicherstellung eines konstanten Nachschubflusses ausarbeiten."
capitulation_category:0	"Geschlagen, aber nicht besiegt"
capitulation_category_desc:0	"Trotz der Tapferkeit unserer Soldaten und unserer größten Anstrengungen ist unser Land in die Hände des Feindes gefallen. Wir haben jedoch eine Exilregierung eingesetzt und können durch entschlossenes politisches Manövrieren die Werkzeuge und Ausrüstungen beschaffen, die wir zur Fortsetzung unseres Befreiungskampfes benötigen."
purchase_civ_factory:0	"Kauf einer Fabrik für zivile Zwecke"
purchase_civ_factory_desc:0	"Wir können einen Teil unseres Budgets für den Kauf einer Fabrik auf verbündetem Boden bereitstellen, um sie in unsere Wirtschaft einzubinden und unsere Produktionskapazitäten zu stärken."
purchase_mil_factory:0	"Kauf einer Fabrik für die Rüstungsproduktion"
purchase_mil_factory_desc:0	"Wir können einen Teil unseres Budgets für den Kauf einer Fabrik auf verbündetem Boden bereitstellen, um sie für die Waffenproduktion zur Versorgung unserer Truppen zu nutzen."
ask_manpower:0	"Bitten Sie um Arbeitskräfte"
ask_manpower_desc:0	"Durch gezielte Lobbyarbeit könnten wir unsere Verbündeten davon überzeugen, einen Teil ihrer Truppen unter unser Kommando zu stellen und so die Größe und Stärke unserer Armee erheblich zu erhöhen. "
request_guns:0	"Waffen anfordern"
request_guns_desc:0	"Obwohl jedes Land in Kriegszeiten einen kritischen Bedarf an Waffen und Munition hat, können wir versuchen, unsere Verbündeten davon zu überzeugen, einen Teil ihrer veralteten oder überschüssigen Waffen zur Unterstützung unserer Bemühungen abzugeben."
request_equipment:0	"Ausrüstung anfordern"
request_equipment_desc:0	"Waffen sind zwar das wichtigste Kriegswerkzeug, doch unsere Truppen ohne ausreichende Ausrüstung in die Schlacht zu schicken, ist ein sicherer Weg, um unsere Arbeitskräfte in der modernen Kriegsführung zu schwächen. Wir müssen Druck auf unsere Verbündeten ausüben, damit sie uns die notwendige Ausrüstung zur Verfügung stellen, um unsere Streitkräfte zu unterstützen."
rescue_volunteers:0	"Rettung von Widerstandsmitgliedern"
rescue_volunteers_desc:0	"Zahlreiche Freiwillige und Widerstandskämpfer in unserem Heimatland kämpfen tapfer gegen die Unterdrückung durch den Feind. Durch die Einleitung verdeckter Operationen können wir diese Personen retten und in unsere Armee integrieren. "
request_funds:0	"Mittel beantragen"
request_funds_desc:0	"Da unsere Ressourcen nach dem Verlust unseres Heimatlandes stark begrenzt sind, können wir unsere Verbündeten um finanzielle Unterstützung bitten. Diese Hilfe würde uns dabei helfen, unsere Bemühungen aufrechtzuerhalten und für unser Volk zu sorgen, bis es uns gelingt, unser Land zu befreien."
aircraft_market_category:0	"Globaler Luftfahrzeugmarkt"
aircraft_market_category_desc:0	"Der Einsatz von Flugzeugen in der Kriegsführung ist kaum mehr als drei Jahrzehnte alt, und doch hat die Welt in dieser kurzen Zeitspanne erlebt, wie sie das Spiel auf dem Schlachtfeld verändert haben. Unsere industriellen und technologischen Fähigkeiten reichen nicht an die der Großmächte heran und sind möglicherweise nicht ausreichend für eine inländische Massenproduktion von Luftfahrzeugen. Mit diplomatischen Bemühungen und einer Aufstockung des Budgets können wir unseren Luftraum jedoch sicherer machen."
