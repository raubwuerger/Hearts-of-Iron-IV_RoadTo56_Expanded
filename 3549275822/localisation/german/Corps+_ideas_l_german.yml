l_german:
street_sweepers_spirit:0	"Straßenfeger"
street_sweepers_spirit_desc:1	"Die Spezialisierung auf die Bekämpfung von Unruhen bringt Vorteile im Kampf in der Stadt mit sich."
street_sweepers_academy_spirit_tt:0	"Neue Offiziere: §Y+1 Angriff und Verteidigung§!\nUrban Assault Specialist XP Gain: §G+50%§!\nAnführer der Kavallerie XP-Gewinn: §G+25%§!\nKavallerie-EP-Gewinn durch Kampf: §G+25% §! \nGepanzerte Fahrzeuge XP-Gewinn aus dem Kampf: §G+25% §! "
petrol_is_blood_spirit:0	"Benzin ist Blut"
petrol_is_blood_spirit_desc:1	"Verweigern Sie jeglichen unnötigen Treibstoffverbrauch. Spare in der Zeit, so hast du in der Not."
recruitment_drive_spirit:0	"Rekrutierungsboni"
recruitment_drive_spirit_desc:1	"Wir arbeiten unermüdlich daran, maximale Anreize zu schaffen, sich zu melden, und denken kreativ, um zusätzliche Freiwillige zu finden."
seniority_spirit:0	"Bevorzugung des Dienstalters"
seniority_spirit_desc:1	"Unsere Offiziere werden aufgrund ihrer Erfahrung bei der Organisation und Führung unserer Streitkräfte befördert."
seniority_spirit_tt:0	"Neue Offiziere: §Y+1 Planung und Logistik§!\nSkilled Staffer XP Gain: §G+100%§!\nVerstärkungsrate: §G+2%§!\nMax Planung §G+20%§!"
asymmetrical_warfare_spirit:0	"Asymmetrische Kriegsführung"
asymmetrical_warfare_spirit_desc:1	"Ohne die Ressourcen, um die Front voranzutreiben, greifen wir auf unkonventionelle Taktiken zurück, um die Linie zu halten."
asymmetrical_warfare_spirit_tt:0	"Zusätzliche §YGuerillataktik§! Taktische Chance, wenn es sich um eine bevorzugte Taktik handelt §G+100.00%§!"
adaptable_modernizers_spirit:0	"Anpassungsfähige Modernisierer"
adaptable_modernizers_spirit_tt:0	"Additional §YBackhand Blow§! Taktische Chance, wenn es sich um eine bevorzugte Taktik handelt §G+100.00%§!"
industry_connections_spirit:0	"Industrie-Verbindungen"
industry_connections_spirit_desc:1	"Unser Armeestab arbeitet eng mit führenden Vertretern der Industrie zusammen."
gifted_strategists_spirit:0	"Begabte Strategen"
gifted_strategists_spirit_desc:1	"Marinekommandeure müssen die Fähigkeit besitzen, das inhärente Chaos eines Gefechts zu überwinden, sowohl um feindliche Schiffe zu zerstören als auch um zu überleben, um an einem anderen Tag zu kämpfen."
green_water_navy_spirit:0	"Grünes Wasser Marine"
green_water_navy_spirit_desc:1	"Die Bewachung der Küsten und flachen Gewässer erfordert eine Flotte, die auf eine geringere Tonnage ausgerichtet ist."
blue_water_navy_spirit:0	"Blauwasser-Marine"
blue_water_navy_spirit_desc:1	"Um Seemacht auf globaler Ebene zu projizieren, ist die Navigation in tieferen Gewässern erforderlich."
prized_ship_spirit:0	"Geschätztes Schiff"
prized_ship_spirit_desc:1	"Ein mächtiges Kriegsschiff ist mehr als nur ein Prunkstück."
naval_traditions_spirit:0	"Marinetraditionen"
naval_traditions_spirit_desc:1	"Was machen wir mit einem betrunkenen Seemann?"
aa_experts_spirit:0	"AA-Experten"
aa_experts_spirit_desc:1	"Was hoch kommt, muss auch wieder runter."
marines_spirit:0	"Marine-Unterstützung"
marines_spirit_desc:1	"Service an Land und auf See."
efficient_shipping_spirit:0	"Effiziente Schifffahrt"
efficient_shipping_spirit_desc:1	"Bewundern Sie ein kleines Schiff, aber laden Sie Ihre Fracht in ein großes."
torpedo_bombers_spirit:0	"Torpedo-Bombardierung"
torpedo_bombers_spirit_desc:1	"„Einen Torpedobomber zu fliegen ist so, als würde man versuchen, einen Schraubenzieher in das Schlüsselloch einer rasenden Lokomotive zu werfen, während man auf einem fliegenden Pfeil balanciert.“ - Vizeadmiral Marc Mitsher, U.S. Navy."
torpedo_bombers_spirit_tt:0	"Kosten für die Konstruktion der Zelle eines kleinen Marinebombers: §G-75%§!\nKleine Flugzeugträger-Zellen Konstruktionskosten: §G-75%§!"
flight_plan_optimization_spirit:0	"Flugweg-Optimierung"
flight_plan_optimization_spirit_desc:1	"Fliegen, Navigieren, Kommunizieren."
aeronautical_production_spirit:0	"Aeronautical Production Board"
aeronautical_production_spirit_desc:1	"Die Luftfahrt war weder eine Industrie noch eine Wissenschaft. Sie war ein Wunder." - Igor Sikorsky"
experimental_rocketry_spirit:0	"Rocketeers"
experimental_rocketry_spirit_desc:1	"Wenn die Raketen einmal oben sind, ist es egal, wo sie herunterkommen..."
tactical_warfare_spirit:0	"Taktische Kriegsführung"
disregard_for_the_common_soldier_spirit:0	"Doktrin des ausbaufähigen Soldaten"
