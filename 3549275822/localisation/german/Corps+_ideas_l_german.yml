street_sweepers_academy_spirit_tt:0	"Neue Offiziere: §Y+1 Angriff und Verteidigung§!\nXP-Gewinn für Spezialisten für städtische Angriffe: §G+50 %§!\nXP-Gewinn für Kavallerieführer:  §G+25 %§!\nXP-Gewinn der Kavallerie aus Kämpfen: §G+25 % §! \nPanzerwagen-XP-Gewinn aus Kämpfen: §G+25 % §! "
