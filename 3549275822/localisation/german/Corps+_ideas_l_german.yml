seniority_spirit_tt:0	"Neue Offiziere: §Y+1 Planung und Logistik§!\nErfahrungspunkte für qualifizierte Mitarbeiter: §G+100 %§!\nVerstärkungsrate: §G+2 %§!\nMaximale Planung §G+20 %§!"
asymmetrical_warfare_spirit:0	"Asymmetrische Kriegsführung"
